<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Inspector</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d1117;font-family:system-ui,sans-serif;color:#fff;overflow:hidden;height:100vh;}
#layout{display:flex;width:100vw;height:100vh;}
#actions{width:300px;min-width:300px;background:#090d15;border-right:1px solid #1a2233;overflow-y:auto;display:flex;flex-direction:column;}
#actions-header{font-size:10px;letter-spacing:2px;color:#555;padding:12px 14px 8px;border-bottom:1px solid #111a28;flex-shrink:0;}
.arow{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid #0f1520;transition:background .1s;}
.arow:hover{background:#0f1825;}
.arow.active{background:#0d1f35;border-left:3px solid #4a90ff;}
.arow:not(.active){border-left:3px solid transparent;}
.a-num{font-size:11px;color:#334;width:18px;flex-shrink:0;}
.a-tag{font-size:10px;padding:2px 5px;border-radius:3px;flex-shrink:0;}
.tag-auto{background:#1a2a1a;color:#4ade80;}
.tag-dom{background:#1a1a2e;color:#818cf8;}
.a-name{font-size:13px;font-weight:700;}
.a-anim{font-size:10px;color:#445;margin-top:1px;}
.a-desc{font-size:10px;color:#334;margin-top:1px;}
#stage{flex:1;position:relative;overflow:hidden;}
canvas#cc{position:absolute;inset:0;image-rendering:pixelated;image-rendering:crisp-edges;}
#hud{position:absolute;top:12px;left:12px;right:12px;pointer-events:none;}
#action-display{background:#0008;border:1px solid #1a2233;border-radius:8px;padding:8px 14px;display:inline-block;min-width:220px;}
#action-name{font-size:22px;font-weight:800;color:#fff;letter-spacing:1px;}
#action-meta{font-size:11px;color:#556;margin-top:2px;}
#hint{position:absolute;bottom:12px;left:12px;font-size:11px;color:#2a3a4a;letter-spacing:1px;}
#scale-ctrl{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:8px;font-size:11px;color:#556;}
#scale-ctrl button{background:#111a28;border:1px solid #1a2233;color:#aaa;padding:3px 9px;border-radius:4px;cursor:pointer;font-size:13px;}
#scale-ctrl button:hover{background:#1a2a3a;}
</style>
</head>
<body>
<div id="layout">
  <div id="actions">
    <div id="actions-header">🐱 ACTION INSPECTOR — click to trigger</div>
  </div>
  <div id="stage">
    <canvas id="cc"></canvas>
    <div id="hud">
      <div id="action-display">
        <div id="action-name">—</div>
        <div id="action-meta"></div>
      </div>
    </div>
    <div id="hint">← click an action to inspect it</div>
    <div id="scale-ctrl">
      <span id="scale-lbl">4×</span>
      <button id="btn-minus">−</button>
      <button id="btn-plus">+</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

// ── FRAME MAP from aseprite ─────────────────────────────────────────────────
// Each entry: [firstFrame, lastFrame]  (0-indexed, 8 frames per row, 32px each)
const ANIMS = {
  Sit_1:      [0,   7],
  Sit_2:      [8,   15],
  Idle_1:     [16,  23],
  Idle_2:     [24,  31],
  W_1:        [32,  39],
  W_2:        [40,  47],
  W_3:        [48,  51],
  Run_1:      [52,  53],
  Run_2:      [54,  56],
  Rest_1:     [57,  60],
  Rest_2:     [61,  68],
  Dream:      [69,  76],
  Creep_Up:   [77,  80],
  Crawl:      [81,  84],
  Sit_U_D:    [85,  92],
  Sit_Up:     [85,  88],
  Sit_Down:   [89,  92],
  Stop:       [93,  96],
  Aggress:    [97,  104],
  J_1:        [105, 112],
  J_U_D:      [113, 120],
  J_2:        [113, 116],
  J_3:        [117, 120],
  Bow_Sit:    [121, 128],
  B_S_1:      [121, 124],
  B_S_2:      [125, 128],
  Bow_Idle:   [129, 136],
  B_I_1:      [129, 132],
  B_I_2:      [133, 136],
  Look_Around:[137, 160],
  Eat:        [161, 168],
  Dmg:        [169, 170],
  Death_1:    [171, 178],
  Death_2:    [179, 186],
  Deat_End:   [187, 190],
  Spawn_2:    [191, 198],
  Attack_1:   [199, 202],
  Attack_2:   [203, 206],
  Attack_3:   [207, 210],
  Attack_4:   [211, 214],
  Attack_5:   [215, 218],
  Dig_1:      [219, 222],
  Dig_2:      [223, 226],
  Pooping:    [227, 230],
  On_2_Paws:  [231, 238],
  On_4_Paws:  [239, 246],
  Scratching: [247, 254],
};

// ── ACTION DEFINITIONS ──────────────────────────────────────────────────────
const ACTIONS = [
  {n:'walk',        tag:'auto', label:'Walk',         anims:['W_1','W_2','W_3'],          desc:'Strolls across the play area'},
  {n:'run',         tag:'auto', label:'Run',          anims:['Run_1','Run_2'],             desc:'Sprints quickly'},
  {n:'sit',         tag:'auto', label:'Sit',          anims:['Sit_1','Sit_2'],             desc:'Sits idle'},
  {n:'sleep',       tag:'auto', label:'Sleep',        anims:['Rest_1','Rest_2','Dream'],   desc:'Rests and sleeps, z\'s float up'},
  {n:'groom',       tag:'auto', label:'Groom',        anims:['B_S_1','B_S_2'],            desc:'Grooms face with paw'},
  {n:'stretch',     tag:'auto', label:'Stretch',      anims:['Bow_Idle','B_I_1','B_I_2'], desc:'Full body stretch'},
  {n:'tailflick',   tag:'auto', label:'Tail Flick',   anims:['Idle_1','Idle_2'],          desc:'Idle flicking tail'},
  {n:'jump',        tag:'auto', label:'Jump',         anims:['J_1','J_U_D','J_2','J_3'],  desc:'Leaps and lands'},
  {n:'roll',        tag:'auto', label:'Roll',         anims:['Sit_1'],                    desc:'Spins in place (chasetail variant)'},
  {n:'sneak',       tag:'auto', label:'Sneak',        anims:['Creep_Up','Crawl'],         desc:'Low belly-to-ground stalk'},
  {n:'startled',    tag:'auto', label:'Startled',     anims:['Aggress'],                  desc:'Arched back, puffed up, then relaxes'},
  {n:'chasetail',   tag:'auto', label:'Chase Tail',   anims:['Sit_1','Sit_2'],            desc:'Spins chasing own tail'},
  {n:'stalkCursor', tag:'auto', label:'Stalk Cursor', anims:['Creep_Up'],                 desc:'Slowly creeps toward mouse'},
  {n:'cursorPounce',tag:'auto', label:'Pounce Cursor',anims:['J_1','J_2'],               desc:'Charges mouse, heart on contact'},
  {n:'pawButton',   tag:'dom',  label:'Paw Button',   anims:['B_S_1','B_S_2'],           desc:'Walks to a button and paws it'},
  {n:'sitOnRow',    tag:'dom',  label:'Sit on Row',   anims:['Sit_U_D'],                  desc:'Walks to a leaderboard row and sits'},
  {n:'peekBox',     tag:'dom',  label:'Peek Box',     anims:['Sit_Up'],                   desc:'Peeks head over a group card'},
  {n:'cornerStare', tag:'dom',  label:'Corner Stare', anims:['Idle_1'],                   desc:'Walks to a corner and stares'},
  {n:'perchBox',    tag:'dom',  label:'Perch Box',    anims:['Sit_Down'],                 desc:'Sits on top of a group card'},
  {n:'climbEdge',   tag:'dom',  label:'Climb Edge',   anims:['Stop'],                     desc:'Perches at the edge of a card'},
];

// Build sidebar
const list = document.getElementById('actions');
ACTIONS.forEach((a,i)=>{
  const row = document.createElement('div');
  row.className='arow'; row.dataset.action=a.n;
  row.innerHTML=`
    <span class="a-num">${i+1}</span>
    <span class="a-tag tag-${a.tag}">${a.tag}</span>
    <div>
      <div class="a-name">${a.label}</div>
      <div class="a-anim">${a.anims.join(' → ')}</div>
      <div class="a-desc">${a.desc}</div>
    </div>`;
  row.addEventListener('click',()=>forceAction(a));
  list.appendChild(row);
});

// ── CANVAS + SPRITE SHEET ───────────────────────────────────────────────────
const stage = document.getElementById('stage');
const canvas = document.getElementById('cc');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let W, H;
function resize(){ W=canvas.width=stage.offsetWidth; H=canvas.height=stage.offsetHeight; }
resize(); window.addEventListener('resize', resize);

const sheet = new Image();
sheet.src = 'Cat-Sheet.png';

const SPRITE_SRC = 32; // source pixels per sprite
const COLS = 8;
let SCALE = 4;

// ── STATE ───────────────────────────────────────────────────────────────────
let currentAction = null;
let currentAnimIdx = 0;  // which anim in the action's list
let frameIdx = 0;        // frame within current anim
let fTimer = 0;
const FRAME_MS = 120;

let cat = { x: 300, y: 0, vx: 0, dir: 1, arrived: false, tX: null };
let spinning = false, spinAngle = 0;
let mx = W/2, my = H/2;

stage.addEventListener('mousemove', e => {
  const r = stage.getBoundingClientRect();
  mx = e.clientX - r.left; my = e.clientY - r.top;
});

// ── FORCE ACTION ─────────────────────────────────────────────────────────────
function forceAction(def) {
  document.querySelectorAll('.arow').forEach(r=>r.classList.remove('active'));
  const el = document.querySelector(`.arow[data-action="${def.n}"]`);
  if(el){ el.classList.add('active'); el.scrollIntoView({block:'nearest'}); }

  document.getElementById('action-name').textContent = def.label;
  document.getElementById('action-meta').textContent =
    `${def.tag==='dom'?'DOM-interactive':'Autonomous'} · action ${ACTIONS.indexOf(def)+1}/${ACTIONS.length}`;

  currentAction = def;
  currentAnimIdx = 0;
  frameIdx = 0; fTimer = 0;
  cat.vx = 0; cat.arrived = false; cat.tX = null;
  spinning = false; spinAngle = 0;

  const n = def.n;
  const FLOOR = H - 60;
  cat.y = FLOOR;

  if(n==='walk'||n==='sneak'||n==='stalkCursor'){
    cat.vx = (Math.random()<.5?1:-1) * (n==='sneak'?32:60);
    cat.dir = Math.sign(cat.vx);
  } else if(n==='run'){
    cat.vx = (Math.random()<.5?1:-1)*150;
    cat.dir = Math.sign(cat.vx);
  } else if(n==='roll'||n==='chasetail'){
    spinning = true;
  } else if(n==='jump'){
    cat.vy = -220;
  } else if(n==='cursorPounce'){
    // tracks mouse
  }
}

// ── UPDATE ───────────────────────────────────────────────────────────────────
let last = 0;
function update(dt) {
  if(!currentAction) return;
  const FLOOR = H - 60;
  const n = currentAction.n;

  // frame advance
  fTimer += dt;
  if(fTimer >= FRAME_MS){
    fTimer = 0;
    frameIdx++;
    const anim = currentAction.anims[currentAnimIdx];
    const [af, at] = ANIMS[anim]||[0,0];
    const len = at - af + 1;
    if(frameIdx >= len){
      frameIdx = 0;
      // cycle through anims in sequence
      currentAnimIdx = (currentAnimIdx+1) % currentAction.anims.length;
    }
  }

  // movement
  if(cat.tX !== null){
    const dx = cat.tX - cat.x;
    if(Math.abs(dx)>6){ cat.vx=Math.sign(dx)*70; cat.dir=Math.sign(dx); }
    else{ cat.vx=0; cat.arrived=true; }
  }
  if(n==='cursorPounce'||n==='stalkCursor'){
    const dx = mx - cat.x;
    cat.vx = Math.sign(dx)*(n==='cursorPounce'?180:45);
    cat.dir = Math.sign(dx)||1;
  }

  cat.x += cat.vx * dt/1000;
  if(cat.vy){ cat.vy += 430*dt/1000; cat.y += cat.vy*dt/1000; }
  if(cat.y >= FLOOR){ cat.y=FLOOR; cat.vy=0; }
  if(n!=='jump') cat.y = FLOOR;

  const PL=20, PR=W-20;
  if(cat.x<PL){ cat.x=PL; cat.vx=Math.abs(cat.vx); cat.dir=1; }
  if(cat.x>PR){ cat.x=PR; cat.vx=-Math.abs(cat.vx); cat.dir=-1; }

  if(spinning) spinAngle += dt * 0.004;
}

// ── DRAW ─────────────────────────────────────────────────────────────────────
function getSpriteXY(frameNum) {
  const col = frameNum % COLS;
  const row = Math.floor(frameNum / COLS);
  return { sx: col * SPRITE_SRC, sy: row * SPRITE_SRC };
}

function drawCat(cx, cy) {
  if(!sheet.complete || !currentAction) return;
  const anim = currentAction.anims[currentAnimIdx];
  const [af] = ANIMS[anim]||[0,0];
  const absFrame = af + frameIdx;
  const {sx, sy} = getSpriteXY(absFrame);

  const size = SPRITE_SRC * SCALE;
  const dx = Math.round(cx - size/2);
  const dy = Math.round(cy - size);

  if(spinning){
    ctx.save();
    ctx.translate(cx, cy - size/2);
    ctx.rotate(spinAngle);
    // flip if dir < 0
    if(cat.dir < 0){ ctx.scale(-1,1); }
    ctx.drawImage(sheet, sx, sy, SPRITE_SRC, SPRITE_SRC, -size/2, -size/2, size, size);
    ctx.restore();
  } else {
    ctx.save();
    if(cat.dir < 0){
      ctx.translate(cx + size/2, 0);
      ctx.scale(-1,1);
      ctx.drawImage(sheet, sx, sy, SPRITE_SRC, SPRITE_SRC, 0, dy, size, size);
    } else {
      ctx.drawImage(sheet, sx, sy, SPRITE_SRC, SPRITE_SRC, dx, dy, size, size);
    }
    ctx.restore();
  }
}

function draw() {
  ctx.clearRect(0,0,W,H);
  const FLOOR = H - 60;

  // floor
  ctx.save(); ctx.strokeStyle='#111a28'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,FLOOR+2); ctx.lineTo(W,FLOOR+2); ctx.stroke();
  ctx.restore();

  // cursor crosshair for pounce/stalk
  if(currentAction && (currentAction.n==='cursorPounce'||currentAction.n==='stalkCursor')){
    ctx.save(); ctx.strokeStyle='#ff448833'; ctx.lineWidth=1; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(mx,0); ctx.lineTo(mx,H); ctx.stroke();
    ctx.restore();
  }

  drawCat(Math.round(cat.x), Math.round(cat.y));

  // z's for sleep
  if(currentAction && currentAction.n==='sleep'){
    const t = Date.now();
    const za = 0.3+0.4*Math.sin(t*.002);
    const zf = (t*.014)%24;
    ctx.save(); ctx.globalAlpha=za; ctx.fillStyle='#8888ff';
    const size = SPRITE_SRC*SCALE;
    ctx.font=`bold ${SCALE*4}px monospace`;
    ctx.fillText('z', cat.x+size*.35, cat.y-size-zf);
    ctx.font=`bold ${SCALE*3}px monospace`;
    ctx.fillText('z', cat.x+size*.5, cat.y-size-8-zf);
    ctx.restore();
  }

  // heart for pounce contact
  if(currentAction && currentAction.n==='cursorPounce' && Math.abs(mx-cat.x)<30){
    ctx.save(); ctx.fillStyle='#ff4488'; ctx.globalAlpha=.85;
    ctx.font=`${SCALE*5}px sans-serif`; ctx.textAlign='center';
    ctx.fillText('♡', cat.x, cat.y-SPRITE_SRC*SCALE-5);
    ctx.restore();
  }
}

// ── SCALE CONTROLS ────────────────────────────────────────────────────────────
document.getElementById('btn-minus').onclick=()=>{ SCALE=Math.max(1,SCALE-1); document.getElementById('scale-lbl').textContent=SCALE+'×'; };
document.getElementById('btn-plus').onclick=()=>{  SCALE=Math.min(8,SCALE+1); document.getElementById('scale-lbl').textContent=SCALE+'×'; };

// ── LOOP ─────────────────────────────────────────────────────────────────────
function loop(ts){
  const dt = Math.min(ts-last, 80); last=ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}

// Init cat position center of stage
resize();
cat.x = W/2; cat.y = H - 60;
sheet.onload = () => { forceAction(ACTIONS[0]); };
requestAnimationFrame(ts=>{ last=ts; loop(ts); });

})();
</script>
</body>
</html>
