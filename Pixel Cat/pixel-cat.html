<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Cat Overlay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d1117;font-family:system-ui,sans-serif;color:#fff;overflow:hidden;}
#demo{position:relative;width:100vw;height:100vh;}
#lb{position:absolute;left:0;top:0;width:358px;bottom:0;background:#090d15;border-right:1px solid #1a2233;}
.lb-title{font-size:10px;letter-spacing:2px;color:#555;padding:10px 14px 6px;}
.lrow{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;font-size:18px;font-weight:800;cursor:default;}
.lrow:hover{background:#0f1420;}
.pos{color:#505878;font-size:14px;margin-right:8px;}
.score-up{color:#4ade80;}
.score-zero{color:#3a4455;}
#area{position:absolute;left:358px;right:0;top:0;bottom:0;padding:20px 18px;}
.area-title{font-size:16px;font-weight:700;text-align:center;margin-bottom:16px;}
.groups-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.gcard{border-radius:8px;padding:11px 13px;}
.gcard .gtitle{font-weight:700;font-size:13px;margin-bottom:7px;}
.gcard .gname{font-size:13px;margin-bottom:2px;}
.actions{display:flex;justify-content:center;gap:10px;margin-top:8px;}
.btn-pick{background:#1a1a2e;color:#aaa;border:1px solid #333;padding:7px 18px;border-radius:8px;cursor:pointer;font-size:13px;}
.btn-pick:hover{background:#252540;}
.btn-done{background:#4a4aff;color:#fff;border:none;padding:7px 18px;border-radius:8px;cursor:pointer;font-size:13px;}
.btn-done:hover{background:#5a5aff;}
#cc{position:absolute;inset:0;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges;}
#lbl{position:absolute;bottom:8px;left:362px;font-size:10px;color:#2a2a50;letter-spacing:1px;text-transform:uppercase;}
</style>
</head>
<body>
<div id="demo">
  <div id="lb">
    <div class="lb-title">🏆 LEADERBOARD</div>
    <div class="lrow"><span><span class="pos"></span>🥇 Neymar</span><span class="score-up">+2</span></div>
    <div class="lrow"><span><span class="pos"></span>🥈 Jancy</span><span class="score-up">+1</span></div>
    <div class="lrow"><span><span class="pos"></span>🥉 Jojo</span><span class="score-up">+1</span></div>
    <div class="lrow"><span><span class="pos">4</span> Liam Lin</span><span class="score-up">+1</span></div>
    <div class="lrow"><span><span class="pos">5</span> Carina</span><span class="score-zero">0</span></div>
    <div class="lrow"><span><span class="pos">6</span> Foden</span><span class="score-zero">0</span></div>
    <div class="lrow"><span><span class="pos">7</span> Morphius</span><span class="score-zero">0</span></div>
    <div class="lrow"><span><span class="pos">8</span> Sakana</span><span class="score-zero">0</span></div>
    <div class="lrow"><span><span class="pos">9</span> William</span><span class="score-zero">0</span></div>
    <div class="lrow"><span><span class="pos">10</span> Yoyo Sheng</span><span class="score-zero">0</span></div>
    <div class="lrow"><span><span class="pos">11</span> Yoyo Wang</span><span class="score-zero">0</span></div>
  </div>
  <div id="area">
    <div class="area-title">EAP 2 — Groups</div>
    <div class="groups-grid">
      <div class="gcard" style="border:1.5px solid #4a4aff;background:#07071a;">
        <div class="gtitle" style="color:#6868ff;">Group 1</div>
        <div class="gname">Foden</div><div class="gname">Jojo</div><div class="gname">Morphius</div>
      </div>
      <div class="gcard" style="border:1.5px solid #1a7a4a;background:#041409;">
        <div class="gtitle" style="color:#2aaa6a;">Group 2</div>
        <div class="gname">Sakana</div><div class="gname">Jancy</div>
      </div>
      <div class="gcard" style="border:1.5px solid #8a5500;background:#120c00;">
        <div class="gtitle" style="color:#cc8820;">Group 3</div>
        <div class="gname">William</div><div class="gname">Liam Lin</div>
      </div>
      <div class="gcard" style="border:1.5px solid #8a1a33;background:#130008;">
        <div class="gtitle" style="color:#cc3355;">Group 4</div>
        <div class="gname">Yoyo Sheng</div><div class="gname">Yoyo Wang</div>
      </div>
      <div class="gcard" style="border:1.5px solid #4a4aff;background:#07071a;">
        <div class="gtitle" style="color:#6868ff;">Group 5</div>
        <div class="gname">Carina</div><div class="gname">Neymar</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn-pick">🎲 Pick again</button>
      <button class="btn-done">Done</button>
    </div>
  </div>
  <canvas id="cc"></canvas>
  <div id="lbl"></div>
</div>

<!-- ============================================================
     PIXEL CAT OVERLAY
     To add to your own project: copy from here to the closing
     script tag and paste just before </body> in your HTML.
     Change PLAY_LEFT to match the right edge of your sidebar.
     ============================================================ -->
<script>
(function(){
  'use strict';

  // ── CONFIG ──────────────────────────────────────────────────
  const PLAY_LEFT = 362;   // x where the cat's play area starts (right of sidebar)
  const FLOOR_MARGIN = 30; // px from bottom of window for the floor
  const S = 3;             // pixel scale: 1 art pixel = 3 canvas pixels
  // ────────────────────────────────────────────────────────────

  const container = document.getElementById('demo') || document.body;
  let cw, ch, FLOOR, PR;

  function getSize() {
    cw = container.offsetWidth;
    ch = container.offsetHeight;
    FLOOR = ch - FLOOR_MARGIN;
    PR = cw - 14;
  }

  // Canvas setup
  const canvas = document.getElementById('cc') || (function(){
    const c = document.createElement('canvas');
    c.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;image-rendering:pixelated;image-rendering:crisp-edges;';
    document.body.appendChild(c);
    return c;
  })();
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  function resizeCanvas() {
    getSize();
    canvas.width = cw;
    canvas.height = ch;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // Colors
  const C = {
    out:  '#7070b8',
    body: '#0e0e22',
    eye:  '#55eeff',
    pup:  '#001535',
    ewh:  '#ffffff',
    nos:  '#ff4488',
    ear:  '#ff2266',
    whis: '#3a3a60',
  };

  // Drawing helpers
  let OX = 0, OY = 0;
  function p(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(OX+x*S, OY+y*S, w*S, h*S); }
  function po(x,y,w,h){ ctx.fillStyle=C.out; ctx.fillRect(OX+(x-1)*S, OY+(y-1)*S, (w+2)*S, (h+2)*S); }

  // DOM finders (relative to container)
  function relRect(el){
    const cr=container.getBoundingClientRect(), er=el.getBoundingClientRect();
    return { l:er.left-cr.left, t:er.top-cr.top, r:er.right-cr.left, b:er.bottom-cr.top, w:er.width, h:er.height };
  }
  function findEls(sel){
    return [...container.querySelectorAll(sel)].filter(el=>{
      const r=el.getBoundingClientRect(); return r.width>10&&r.height>5;
    });
  }

  // Cat state
  const cat = {
    x:500, y:0, vx:0, vy:0, dir:1,
    action:'walk', frame:0, fT:0, aT:0, aDur:2000,
    blink:false, bT:0,
    tailT:0, tailDir:1,
    mx:0, my:0,
    puffed:false, roll:0, spin:0,
    grooming:false, stretch:0,
    tX:null, tY:null, arrived:false,
  };

  container.addEventListener('mousemove', e=>{
    const r=container.getBoundingClientRect();
    cat.mx=e.clientX-r.left; cat.my=e.clientY-r.top;
  });

  // Actions with weights
  const ACTS = [
    {n:'walk',w:12}, {n:'run',w:7}, {n:'sit',w:9}, {n:'sleep',w:5},
    {n:'groom',w:7}, {n:'stretch',w:4}, {n:'tailflick',w:7}, {n:'jump',w:5},
    {n:'roll',w:3}, {n:'sneak',w:6}, {n:'startled',w:4}, {n:'chasetail',w:4},
    {n:'stalkCursor',w:5}, {n:'cursorPounce',w:4}, {n:'pawButton',w:5},
    {n:'sitOnRow',w:6}, {n:'peekBox',w:5}, {n:'cornerStare',w:5},
    {n:'perchBox',w:3}, {n:'climbEdge',w:3},
  ];
  function pickAction(){
    let r=Math.random()*ACTS.reduce((s,a)=>s+a.w,0);
    for(const a of ACTS){ r-=a.w; if(r<=0) return a.n; }
    return 'sit';
  }

  function startAction(){
    cat.aT=0; cat.frame=0; cat.arrived=false;
    cat.tX=null; cat.tY=null; cat.grooming=false; cat.puffed=false; cat.vx=0;
    const n=pickAction(); cat.action=n;
    const lbl=document.getElementById('lbl'); if(lbl) lbl.textContent=n;

    const rnd=n=>Math.random()*n;
    if(n==='walk')       { cat.aDur=2500+rnd(2500); cat.vx=(Math.random()<.5?1:-1)*55; cat.dir=Math.sign(cat.vx); }
    else if(n==='run')   { cat.aDur=900+rnd(1100);  cat.vx=(Math.random()<.5?1:-1)*148; cat.dir=Math.sign(cat.vx); }
    else if(n==='sneak') { cat.aDur=2000+rnd(2000); cat.vx=(Math.random()<.5?1:-1)*32; cat.dir=Math.sign(cat.vx); }
    else if(n==='sit'||n==='tailflick') { cat.aDur=1800+rnd(2500); }
    else if(n==='sleep') { cat.aDur=3500+rnd(3000); }
    else if(n==='groom') { cat.aDur=2500+rnd(2000); cat.grooming=true; }
    else if(n==='stretch')     { cat.aDur=2200; }
    else if(n==='jump')        { cat.aDur=1100; cat.vy=-225; }
    else if(n==='roll')        { cat.aDur=2100; cat.roll=0; }
    else if(n==='chasetail')   { cat.aDur=2200; cat.spin=0; }
    else if(n==='startled')    { cat.aDur=1500; cat.puffed=true; }
    else if(n==='stalkCursor'||n==='cursorPounce') { cat.aDur=2500; }
    else if(n==='pawButton') {
      cat.aDur=2800;
      const b=findEls('button,.btn-pick,.btn-done,[role="button"]');
      if(b.length){ const r=relRect(b[Math.floor(Math.random()*b.length)]); cat.tX=r.l+r.w/2; cat.tY=r.b; }
    }
    else if(n==='sitOnRow') {
      cat.aDur=3200;
      const rows=findEls('.lrow,tr,[class*="row"],[class*="item"]');
      if(rows.length){ const r=relRect(rows[Math.floor(Math.random()*rows.length)]); cat.tX=Math.max(PLAY_LEFT+50,r.l+r.w*.7); cat.tY=r.t+2; }
    }
    else if(n==='peekBox'||n==='perchBox'||n==='climbEdge') {
      cat.aDur=3000;
      const cards=findEls('.gcard,[class*="card"],[class*="group"],[class*="box"]');
      if(cards.length){ const r=relRect(cards[Math.floor(Math.random()*cards.length)]); cat.tX=r.l+r.w*.2+Math.random()*r.w*.6; cat.tY=r.t; }
    }
    else if(n==='cornerStare') {
      cat.aDur=2800;
      const corners=[{x:PLAY_LEFT+28,y:40},{x:PR-28,y:40},{x:PLAY_LEFT+28,y:FLOOR-10},{x:PR-28,y:FLOOR-10}];
      const c=corners[Math.floor(Math.random()*4)]; cat.tX=c.x; cat.tY=c.y;
    }
    else { cat.aDur=2000; }
  }

  function update(dt){
    // Tail wag
    cat.tailT+=dt*.0025*cat.tailDir;
    if(Math.abs(cat.tailT)>1.2) cat.tailDir*=-1;

    // Blink
    cat.bT+=dt;
    const bInt=cat.action==='sleep'?999999:(cat.action==='stalkCursor'?1400:3200+Math.random()*2000);
    if(cat.bT>bInt){ cat.blink=true; cat.bT=0; }
    if(cat.blink&&cat.bT>140) cat.blink=false;

    // Frame advance
    cat.fT+=dt;
    const fspd=cat.action==='run'?52:cat.action==='sneak'?160:105;
    if(cat.fT>fspd){ cat.frame++; cat.fT=0; }

    // Action timer
    cat.aT+=dt;
    if(cat.aT>=cat.aDur) startAction();

    // Move toward target
    if(cat.tX!==null){
      const dx=cat.tX-cat.x;
      if(Math.abs(dx)>8){ cat.vx=Math.sign(dx)*72; cat.dir=Math.sign(dx); }
      else{ cat.vx=0; cat.arrived=true; }
    }

    // Cursor tracking
    if(cat.action==='stalkCursor'||cat.action==='cursorPounce'){
      const dx=cat.mx-cat.x;
      const spd=cat.action==='cursorPounce'?185:48;
      if(Math.abs(dx)>28){ cat.vx=Math.sign(dx)*spd; cat.dir=Math.sign(dx); }
      else cat.vx=0;
    }

    // Apply velocity
    cat.x+=cat.vx*dt/1000;
    cat.y+=cat.vy*dt/1000;

    // Gravity for jump
    if(cat.vy!==0){ cat.vy+=435*dt/1000; if(cat.y>=FLOOR){ cat.y=FLOOR; cat.vy=0; } }
    if(cat.action!=='jump') cat.y=FLOOR;

    // Wall bounce
    if(cat.x<PLAY_LEFT+20){ cat.x=PLAY_LEFT+20; cat.vx=Math.abs(cat.vx); cat.dir=1; }
    if(cat.x>PR-20){ cat.x=PR-20; cat.vx=-Math.abs(cat.vx); cat.dir=-1; }

    // Action-specific updates
    if(cat.action==='roll')        cat.roll+=dt*.005;
    if(cat.action==='chasetail')   cat.spin+=dt*.006;
    if(cat.action==='stretch')     cat.stretch=Math.sin(cat.aT/cat.aDur*Math.PI);
    if(cat.action==='startled'&&cat.aT>750) cat.puffed=false;
  }

  // ── DRAW FUNCTIONS ───────────────────────────────────────────

  function drawTail(tx,ty,dir,t){
    const wag=Math.sin(t)*13;
    const c1x=tx+dir*(-24)+wag, c1y=ty-24;
    const ex=tx+dir*(-6)+wag*1.5, ey=ty-50;
    ctx.save(); ctx.lineCap='round';
    ctx.strokeStyle=C.out; ctx.lineWidth=S*2;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.quadraticCurveTo(c1x,c1y,ex,ey); ctx.stroke();
    ctx.strokeStyle=C.body; ctx.lineWidth=S;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.quadraticCurveTo(c1x,c1y,ex,ey); ctx.stroke();
    ctx.restore();
  }

  // Side-view (walk, run, jump, sneak uses own variant)
  function drawSide(ox,oy,fr,blink,dir){
    ctx.save();
    if(dir<0){ ctx.translate((ox+9*S)*2,0); ctx.scale(-1,1); }
    OX=ox; OY=oy;
    const lf=[0,1,0,-1][fr%4];
    // Outlines
    po(5,0,2,2); po(9,0,2,2);   // ears
    po(4,2,9,7);                  // head
    po(0,7,12,7);                 // body
    po(1,14,2,4); po(7+lf,14,2,4); // legs
    po(0,17,3,2); po(6+lf,17,3,2); // paws
    // Fills
    p(5,0,2,2,C.body); p(9,0,2,2,C.body);
    p(4,2,9,7,C.body); p(0,7,12,7,C.body);
    p(1,14,2,4,C.body); p(7+lf,14,2,4,C.body);
    p(0,17,3,2,C.body); p(6+lf,17,3,2,C.body);
    // Inner ear
    p(5,0,1,1,C.ear); p(9,0,1,1,C.ear);
    // Eye
    if(!blink){ p(9,4,2,2,C.eye); p(10,4,1,1,C.pup); p(9,4,1,1,C.ewh); }
    else { p(9,5,2,1,C.out); }
    p(12,6,1,1,C.nos); // nose
    // Whiskers
    ctx.fillStyle=C.whis;
    ctx.fillRect(OX+13*S, OY+6*S, 4*S, 1);
    ctx.fillRect(OX+13*S, OY+7*S+1, 3*S, 1);
    ctx.restore();
  }

  // Front sitting view
  function drawSit(ox,oy,blink,groom,fr){
    OX=ox; OY=oy;
    po(3,0,2,3); po(9,0,2,3);   // ears
    po(2,2,10,8);                 // head
    po(3,9,8,8);                  // body
    po(2,16,3,3); po(9,16,3,3);  // paws
    p(3,0,2,3,C.body); p(9,0,2,3,C.body);
    p(2,2,10,8,C.body); p(3,9,8,8,C.body);
    p(2,16,3,3,C.body); p(9,16,3,3,C.body);
    p(4,0,1,2,C.ear); p(10,0,1,2,C.ear); // inner ear
    if(!blink){
      p(5,5,2,2,C.eye); p(9,5,2,2,C.eye);
      p(6,5,1,1,C.pup); p(10,5,1,1,C.pup);
      p(5,5,1,1,C.ewh); p(9,5,1,1,C.ewh);
    } else { p(5,6,2,1,C.out); p(9,6,2,1,C.out); }
    p(7,7,2,1,C.nos);
    if(groom){ const gy=fr%8<4?10:8; po(8,gy,3,3); p(8,gy,3,3,C.body); }
  }

  // Sleeping curl
  function drawSleep(ox,oy){
    OX=ox; OY=oy+S*2;
    po(1,4,13,7);  p(1,4,13,7,C.body);  // curled body
    po(1,1,8,5);   p(1,1,8,5,C.body);   // head resting
    po(2,0,2,3);   p(2,0,2,3,C.body);   // ear
    p(3,0,1,2,C.ear);
    p(3,3,3,1,C.out); // closed eye line
    p(5,5,1,1,C.nos);
    // Curled tail arc
    ctx.save();
    ctx.strokeStyle=C.out; ctx.lineWidth=S*2; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(OX+11*S, OY+8*S, 4*S, 0.1, Math.PI*1.1, false); ctx.stroke();
    ctx.strokeStyle=C.body; ctx.lineWidth=S;
    ctx.beginPath(); ctx.arc(OX+11*S, OY+8*S, 4*S, 0.1, Math.PI*1.1, false); ctx.stroke();
    ctx.restore();
  }

  // Stretching (body elongates)
  function drawStretch(ox,oy,phase){
    OX=ox; OY=oy;
    const ext=Math.round(phase*5), bw=12+ext;
    po(0,7,bw,6);   p(0,7,bw,6,C.body);
    if(phase>0.3){ po(0,4,5,4); p(0,4,5,4,C.body); } // butt up
    po(bw-8,1,9,7); p(bw-8,1,9,7,C.body);
    po(bw-7,0,2,2); po(bw-4,0,2,2); p(bw-7,0,2,2,C.body); p(bw-4,0,2,2,C.body);
    p(bw-3,4,2,2,C.eye); p(bw-2,4,1,1,C.pup);
    po(bw-7,13,2,4); p(bw-7,13,2,4,C.body);
    po(bw-4,13,2,4); p(bw-4,13,2,4,C.body);
    po(1,13,2,4);    p(1,13,2,4,C.body);
  }

  // Low sneak
  function drawSneak(ox,oy,fr,dir){
    ctx.save();
    if(dir<0){ ctx.translate((ox+9*S)*2,0); ctx.scale(-1,1); }
    OX=ox; OY=oy;
    const lf=fr%2;
    po(5,0,2,2); po(8,0,2,2);
    po(3,1,11,5); po(0,5,14,5);
    po(1,9,2,3); po(5+lf,9,2,3); po(10,9,2,3);
    p(5,0,2,2,C.body); p(8,0,2,2,C.body);
    p(3,1,11,5,C.body); p(0,5,14,5,C.body);
    p(1,9,2,3,C.body); p(5+lf,9,2,3,C.body); p(10,9,2,3,C.body);
    p(5,0,1,1,C.ear); p(8,0,1,1,C.ear);
    p(10,2,3,3,C.eye); p(12,2,1,1,C.pup); p(10,2,1,1,C.ewh);
    p(13,4,1,1,C.nos);
    ctx.restore();
  }

  // Startled arched back
  function drawStartled(ox,oy,puffed){
    OX=ox; OY=oy;
    const pf=puffed?2:0;
    po(0-pf,4,16+pf*2,7+pf); p(0-pf,4,16+pf*2,7+pf,C.body);
    po(4,0,9,6); p(4,0,9,6,C.body);
    po(4,0,2,2); po(9,0,2,2); p(4,0,2,2,C.body); p(9,0,2,2,C.body);
    p(5,0,1,1,C.ear); p(10,0,1,1,C.ear);
    p(6,2,2,2,C.eye); p(10,2,2,2,C.eye);
    p(7,2,1,1,C.pup); p(11,2,1,1,C.pup);
    po(1,11,3,4); po(5,11,3,4); po(9,11,3,4); po(12,11,3,4);
    p(1,11,3,4,C.body); p(5,11,3,4,C.body); p(9,11,3,4,C.body); p(12,11,3,4,C.body);
  }

  // Peek over edge (just head + paws)
  function drawPeek(cx,topY){
    OX=cx-7*S; OY=topY-5*S;
    po(2,0,2,2); po(9,0,2,2);
    po(1,1,11,5); p(1,1,11,5,C.body);
    p(2,0,2,2,C.body); p(9,0,2,2,C.body);
    p(3,0,1,1,C.ear); p(10,0,1,1,C.ear);
    p(4,2,2,2,C.eye); p(8,2,2,2,C.eye);
    p(5,2,1,1,C.pup); p(9,2,1,1,C.pup);
    p(4,2,1,1,C.ewh); p(8,2,1,1,C.ewh);
    p(6,4,2,1,C.nos);
    po(2,6,3,2); po(9,6,3,2); p(2,6,3,2,C.body); p(9,6,3,2,C.body);
  }

  // ── MAIN DRAW ────────────────────────────────────────────────

  function draw(){
    ctx.clearRect(0,0,cw,ch);

    const cx=Math.round(cat.x), cy=Math.round(cat.y);
    const bw=18*S, bh=20*S;
    const ox=cx-bw/2, oy=cy-bh;
    const fr=cat.frame, blink=cat.blink, dir=cat.dir, act=cat.action;
    const tbx=dir>0?cx-8*S:cx+8*S, tby=cy-12*S;

    if(act==='sleep'){
      drawSleep(ox,oy);

    } else if(act==='roll'){
      ctx.save(); ctx.translate(cx,cy-9*S); ctx.rotate(cat.roll);
      drawSit(-bw/2,-bh/2+S*2,false,false,0);
      ctx.restore();

    } else if(act==='chasetail'){
      ctx.save(); ctx.translate(cx,cy-9*S); ctx.rotate(cat.spin);
      drawSit(-bw/2,-bh/2+S*2,false,false,0);
      ctx.restore();

    } else if(act==='stretch'){
      drawStretch(ox,oy,cat.stretch);

    } else if(act==='startled'){
      drawTail(tbx,tby,dir,cat.aT*.005);
      drawStartled(ox,oy,cat.puffed);

    } else if(act==='sneak'){
      drawTail(tbx,tby+S*2,dir,cat.aT*.002);
      drawSneak(ox,oy+S*4,fr,dir);

    } else if(act==='peekBox'){
      if(cat.arrived&&cat.tY!==null){ drawPeek(cx,cat.tY); }
      else{ drawTail(tbx,tby,dir,cat.tailT); drawSide(ox,oy,fr,blink,dir); }

    } else if(act==='sit'||act==='groom'||act==='tailflick'){
      drawTail(cx, cy-9*S, dir, cat.tailT);
      drawSit(ox+S, oy+S*2, blink, cat.grooming, fr);

    } else if(act==='pawButton'||act==='sitOnRow'||act==='cornerStare'||act==='perchBox'||act==='climbEdge'){
      if(cat.arrived){
        drawTail(cx,cy-9*S,dir,cat.tailT);
        drawSit(ox+S,oy+S*2,blink,act==='pawButton',fr);
      } else {
        drawTail(tbx,tby,dir,cat.tailT);
        drawSide(ox,oy,fr,blink,dir);
      }

    } else if(act==='cursorPounce'){
      drawTail(tbx,tby,dir,cat.tailT);
      if(Math.abs(cat.mx-cx)<28){
        ctx.save(); ctx.translate(cx,cy-bh/2); ctx.rotate(dir*-.35);
        drawSide(-bw/2,-bh/2,fr,false,1);
        ctx.restore();
      } else {
        drawSide(ox,oy,fr,blink,dir);
      }

    } else {
      // walk, run, jump, stalkCursor, default
      drawTail(tbx,tby,dir,cat.tailT);
      drawSide(ox,oy,fr,blink,dir);
    }

    // Floating Z's when sleeping
    if(act==='sleep'){
      const za=0.3+0.4*Math.sin(cat.aT*.002);
      const zf=(cat.aT*.016)%26;
      ctx.save(); ctx.globalAlpha=za; ctx.fillStyle='#8888ff';
      ctx.font=`bold ${S*4}px monospace`; ctx.fillText('z',cx+12,cy-bh-zf);
      ctx.font=`bold ${S*3}px monospace`; ctx.fillText('z',cx+22,cy-bh-7-zf);
      ctx.restore();
    }

    // Heart when pounce lands
    if(act==='cursorPounce'&&Math.abs(cat.mx-cx)<22){
      ctx.save(); ctx.fillStyle='#ff4488'; ctx.globalAlpha=0.85;
      ctx.font=`${S*5}px sans-serif`; ctx.textAlign='center';
      ctx.fillText('♡', cx, oy-5);
      ctx.restore();
    }
  }

  // ── LOOP ────────────────────────────────────────────────────

  let last=0;
  function loop(ts){
    const dt=Math.min(ts-last,80);
    last=ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  getSize();
  cat.x=PLAY_LEFT+(PR-PLAY_LEFT)/2;
  cat.y=FLOOR;
  startAction();
  requestAnimationFrame(ts=>{ last=ts; loop(ts); });

})();
</script>
</body>
</html>
