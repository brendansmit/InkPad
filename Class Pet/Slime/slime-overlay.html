<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slime Overlay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d1117;font-family:system-ui,sans-serif;color:#fff;overflow:hidden;height:100vh;}

/* ── mock classroom UI ───────────────────────────── */
#lb{position:absolute;left:0;top:0;width:358px;bottom:0;background:#090d15;border-right:1px solid #1a2233;}
.lb-title{font-size:10px;letter-spacing:2px;color:#555;padding:10px 14px 6px;}
.lrow{display:flex;justify-content:space-between;padding:11px 16px;font-size:17px;font-weight:800;}
.sup{color:#4ade80;}
.sdn{color:#3a4455;}
#area{position:absolute;left:358px;right:0;top:0;bottom:0;padding:20px;}
.atitle{font-size:15px;font-weight:700;text-align:center;margin-bottom:14px;}
.gcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.gcard{border-radius:8px;padding:10px 12px;}
.gcard .gt{font-weight:700;font-size:12px;margin-bottom:6px;}
.gcard .gn{font-size:12px;}
.btns{display:flex;justify-content:center;gap:10px;}
.btn-pick{background:#1a1a2e;color:#aaa;border:1px solid #333;padding:7px 16px;border-radius:8px;cursor:pointer;font-size:12px;}
.btn-done{background:#4a4aff;color:#fff;border:none;padding:7px 16px;border-radius:8px;cursor:pointer;font-size:12px;}

/* ── slime canvas ────────────────────────────────── */
#slime-canvas{position:fixed;inset:0;pointer-events:none;z-index:9999;image-rendering:pixelated;image-rendering:crisp-edges;}
</style>
</head>
<body>

<!-- mock UI -->
<div id="lb">
  <div class="lb-title">🏆 LEADERBOARD</div>
  <div class="lrow"><span>🥇 Neymar</span><span class="sup">+2</span></div>
  <div class="lrow"><span>🥈 Jancy</span><span class="sup">+1</span></div>
  <div class="lrow"><span>🥉 Jojo</span><span class="sup">+1</span></div>

  <div class="lrow"><span>9&nbsp; William</span><span class="sdn">0</span></div>
</div>
<div id="area">
  <div class="atitle">EAP 2 — Groups</div>
  <div class="gcards">

    <div class="gcard" style="border:1.5px solid #1a7a4a;background:#041409"><div class="gt" style="color:#2aaa6a">Group 2</div><div class="gn">Sakana</div><div class="gn">Jancy</div></div>
    <div class="gcard" style="border:1.5px solid #8a5500;background:#120c00"><div class="gt" style="color:#cc8820">Group 3</div><div class="gn">William</div><div class="gn">Liam Lin</div></div>

  </div>
  <div class="btns">
    <button class="btn-pick">🎲 Pick again</button>
    <button class="btn-done">Done</button>
  </div>
</div>

<canvas id="slime-canvas"></canvas>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf//Z';

  // ── STATE ────────────────────────────────────────────────────
  const DW = Math.round(SLIME_W * SCALE);  // display width
  const DH = Math.round(SLIME_H * SCALE);  // display height

  let slime = {
    x: PLAY_LEFT + 100,
    y: 0,           // set after resize
    targetX: 0,
    state: 'walk',  // walk | sit
    frame: 0,
    fT: 0,
  };

  function pickTarget(){
    const margin = DW * 0.6;
    const minX = PLAY_LEFT + margin;
    const maxX = window.innerWidth - margin;
    slime.targetX = minX + Math.random() * (maxX - minX);
  }

  function startWalk(){
    slime.state = 'walk';
    slime.frame = 0;
    slime.fT    = 0;
    pickTarget();
  }

  function startSit(){
    slime.state = 'sit';
    slime.frame = 0;
    slime.fT    = 0;
    // sit for 3–7 seconds then walk again
    setTimeout(startWalk, 3000 + Math.random() * 4000);
  }

  // ── UPDATE ───────────────────────────────────────────────────
  function update(dt){
    // animate frames
    slime.fT += dt;
    const MS = 1000 / FPS;
    if(slime.fT >= MS){
      slime.fT = 0;
      slime.frame = (slime.frame + 1) % FRAMES;
    }

    if(slime.state === 'walk'){
      const dx = slime.targetX - slime.x;
      if(Math.abs(dx) < 2){
        slime.x = slime.targetX;
        startSit();
      } else {
        slime.x += Math.sign(dx) * WALK_SPEED * dt / 1000;
      }
    }
  }

  // ── DRAW ─────────────────────────────────────────────────────
  function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(!sheet.complete || !sheet.naturalWidth) return;

    const col = slime.frame % COLS;
    const row = Math.floor(slime.frame / COLS);
    const sx  = col * SLIME_W;
    const sy  = row * SLIME_H;

    const drawX = Math.round(slime.x - DW / 2);
    const drawY = Math.round(slime.y - DH);

    ctx.drawImage(sheet, sx, sy, SLIME_W, SLIME_H, drawX, drawY, DW, DH);
  }

  // ── LOOP ─────────────────────────────────────────────────────
  let last = 0;
  function loop(ts){
    const dt = Math.min(ts - last, 80);
    last = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  sheet.onload = () => {
    slime.y = window.innerHeight - 20;
    startWalk();
    requestAnimationFrame(ts => { last = ts; loop(ts); });
  };

  if(sheet.complete && sheet.naturalWidth) sheet.onload();

})();
