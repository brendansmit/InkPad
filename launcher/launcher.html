<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InkHeron Apps</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper:   #f2ede4;
    --ink:     #1a1410;
    --faint:   #e8e1d5;
    --muted:   #8a7f72;
    --c1: #3b82f6;
    --c2: #7c3aed;
    --c3: #059669;
    --c4: #d97706;
    --c5: #dc2626;
  }

  html, body {
    height: 100%;
    background: var(--paper);
    font-family: 'DM Sans', -apple-system, sans-serif;
    color: var(--ink);
    overflow: hidden;
  }

  /* ── layout ──────────────────────────────────────── */
  .shell {
    height: 100vh;
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: 1fr;
  }

  /* ── left sidebar ────────────────────────────────── */
  .sidebar {
    border-right: 1px solid var(--faint);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 36px 28px 28px;
    position: relative;
    overflow: hidden;
  }

  /* Ink wash background accent */
  .sidebar::before {
    content: "";
    position: absolute;
    bottom: -60px; left: -60px;
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(26,20,16,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }
  .logo-wrap img {
    width: 72px;
    height: 72px;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.12));
  }
  .brand h1 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 1.55rem;
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .brand h1 em {
    font-style: italic;
    color: var(--muted);
  }

  .sidebar-footer {
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.6;
  }
  .sidebar-footer strong {
    display: block;
    color: var(--ink);
    font-size: 0.78rem;
    margin-bottom: 2px;
  }

  /* ── right: bento grid ───────────────────────────── */
  .bento {
    padding: 28px 28px 28px 28px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 12px;
    height: 100vh;
  }

  /* Card placements */
  .card:nth-child(1) { grid-column: 1 / 4; grid-row: 1; }  /* Grade Importer — wide */
  .card:nth-child(2) { grid-column: 4 / 7; grid-row: 1; }  /* Writing Analyzer — wide */
  .card:nth-child(3) { grid-column: 1 / 3; grid-row: 2; }  /* Maestro */
  .card:nth-child(4) { grid-column: 3 / 5; grid-row: 2; }  /* BugSmash */
  .card:nth-child(5) { grid-column: 5 / 7; grid-row: 2; }  /* Speed Dating */

  /* ── card base ───────────────────────────────────── */
  .card {
    background: #fff;
    border: 1px solid var(--faint);
    border-radius: 16px;
    padding: 24px 26px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.18s cubic-bezier(.2,.8,.3,1),
                box-shadow 0.18s ease,
                border-color 0.18s ease;
  }

  .card::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.18s ease;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.08);
    border-color: var(--accent);
  }
  .card:hover::after { opacity: 1; }
  .card:active { transform: translateY(0px) scale(0.99); }
  .card.launching { border-color: var(--accent); }
  .card.launching::after { opacity: 1; animation: shimmer 1s ease-in-out infinite; }

  @keyframes shimmer {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  /* Card top: number tag + arrow */
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .card-num {
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    padding: 3px 9px;
    border-radius: 99px;
    letter-spacing: 0.04em;
  }
  .card-arrow {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid var(--faint);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 0.9rem;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .card:hover .card-arrow {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* Card bottom */
  .card-name {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 1.45rem;
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin-bottom: 4px;
  }
  /* Larger top cards get bigger names */
  .card:nth-child(1) .card-name,
  .card:nth-child(2) .card-name { font-size: 1.65rem; }

  .card-desc {
    font-size: 0.78rem;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  /* Per-card accent colours */
  .card:nth-child(1) { --accent: var(--c1); }
  .card:nth-child(2) { --accent: var(--c2); }
  .card:nth-child(3) { --accent: var(--c3); }
  .card:nth-child(4) { --accent: var(--c4); }
  .card:nth-child(5) { --accent: var(--c5); }

  /* ── status toast ────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: #f2ede4;
    font-size: 0.82rem;
    padding: 9px 20px;
    border-radius: 99px;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo-wrap">
      <img src="/logo" alt="InkHeron">
      <div class="brand">
        <h1>Ink<em>Heron</em><br>Apps</h1>
      </div>
    </div>
    <div class="sidebar-footer">
      <strong>5 tools</strong>
      Click any card to open.<br>
      Servers start automatically.
    </div>
  </aside>

  <!-- Bento grid -->
  <main class="bento" id="grid"></main>

</div>

<div class="toast" id="toast"></div>

<script>
const APPS = [
  { id: "grade-importer",   name: "Grade Importer",   desc: "Import & export grades",    num: "01" },
  { id: "writing-analyzer", name: "Writing Analyzer", desc: "Essay revision tracker",    num: "02" },
  { id: "maestro",          name: "Maestro",          desc: "Group & seating tool",      num: "03" },
  { id: "bugsmash",         name: "BugSmash",         desc: "Code debugging helper",     num: "04" },
  { id: "speed-dating",     name: "Speed Dating",     desc: "Venue layout builder",      num: "05" },
];

const grid  = document.getElementById("grid");
const toast = document.getElementById("toast");
let toastTimer;

APPS.forEach(app => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="card-top">
      <span class="card-num">${app.num}</span>
      <div class="card-arrow">↗</div>
    </div>
    <div>
      <div class="card-name">${app.name}</div>
      <div class="card-desc">${app.desc}</div>
    </div>
  `;
  card.addEventListener("click", () => launch(app, card));
  grid.appendChild(card);
});

async function launch(app, card) {
  card.classList.add("launching");
  showToast(`Launching ${app.name}…`);
  try {
    await fetch(`/launch/${app.id}`);
    showToast(`${app.name} is open`);
  } catch {
    showToast(`Could not launch ${app.name}`);
  }
  setTimeout(() => card.classList.remove("launching"), 1500);
}

function showToast(msg) {
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add("show");
  toastTimer = setTimeout(() => toast.classList.remove("show"), 3000);
}
</script>
</body>
</html>
