<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InkHeron Apps</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background: #0d0f18;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    user-select: none;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 48px;
  }
  .logo {
    width: 64px;
    height: 64px;
    object-fit: contain;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
  }
  .header-text h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #f1f5f9;
    letter-spacing: -0.02em;
  }
  .header-text p {
    font-size: 0.9rem;
    color: #475569;
    margin-top: 2px;
  }

  /* Grid */
  .grid {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 860px;
  }

  /* Card */
  .card {
    width: 150px;
    background: #141722;
    border: 1px solid #1e2235;
    border-radius: 18px;
    padding: 28px 16px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--color);
    border-radius: 18px 18px 0 0;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--color);
    background: #181c2a;
  }
  .card:active {
    transform: translateY(-1px) scale(0.98);
  }

  /* Icon circle */
  .icon-wrap {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid var(--color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--color);
    letter-spacing: -0.03em;
    background: #0d0f18;
    flex-shrink: 0;
  }

  .card-name {
    font-size: 0.95rem;
    font-weight: 700;
    color: #f1f5f9;
    text-align: center;
    line-height: 1.25;
  }
  .card-desc {
    font-size: 0.75rem;
    color: #475569;
    text-align: center;
    line-height: 1.4;
  }

  /* Launch state */
  .card.launching .icon-wrap {
    animation: pulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes pulse {
    from { box-shadow: 0 0 0 0 var(--color); }
    to   { box-shadow: 0 0 0 8px transparent; }
  }

  /* Status */
  .status {
    margin-top: 36px;
    font-size: 0.85rem;
    color: #334155;
    height: 20px;
    transition: color 0.2s;
  }
  .status.active { color: #64748b; }
</style>
</head>
<body>

<div class="header">
  <img class="logo" src="/logo" alt="InkHeron">
  <div class="header-text">
    <h1>InkHeron Apps</h1>
    <p>Click an app to launch</p>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="status" id="status"></div>

<script>
const APPS = [
  { id: "grade-importer",   name: "Grade\nImporter",   short: "GI", desc: "Import & export grades",    color: "#3b82f6" },
  { id: "writing-analyzer", name: "Writing\nAnalyzer", short: "WA", desc: "Essay revision tracker",    color: "#8b5cf6" },
  { id: "maestro",          name: "Maestro",           short: "M",  desc: "Group & seating tool",      color: "#10b981" },
  { id: "bugsmash",         name: "BugSmash",          short: "BS", desc: "Code debugging helper",     color: "#f59e0b" },
  { id: "speed-dating",     name: "Speed\nDating",     short: "SD", desc: "Venue layout builder",      color: "#ef4444" },
];

const grid   = document.getElementById("grid");
const status = document.getElementById("status");

APPS.forEach(app => {
  const card = document.createElement("div");
  card.className = "card";
  card.style.setProperty("--color", app.color);
  card.innerHTML = `
    <div class="icon-wrap">${app.short}</div>
    <div class="card-name">${app.name.replace("\n", "<br>")}</div>
    <div class="card-desc">${app.desc}</div>
  `;
  card.addEventListener("click", () => launch(app, card));
  grid.appendChild(card);
});

async function launch(app, card) {
  card.classList.add("launching");
  const name = app.name.replace("\n", " ");
  setStatus(`Launching ${name}…`);
  try {
    await fetch(`/launch/${app.id}`);
    setStatus(`${name} opened.`);
    setTimeout(() => setStatus(""), 3000);
  } catch(e) {
    setStatus(`Error launching ${name}`);
  }
  card.classList.remove("launching");
}

function setStatus(msg) {
  status.textContent = msg;
  status.className = "status" + (msg ? " active" : "");
}
</script>
</body>
</html>
