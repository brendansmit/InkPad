<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InkHeron - Writing portal</title>
  <link rel="icon" href="/assets/InkHeron%20Logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:420px;text-align:center}
    .glyph{width:52px;height:52px;border-radius:16px;background:var(--green-600);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:26px;font-weight:600;transform:rotate(-4deg);margin-bottom:14px}
    h1{font-family:var(--serif);font-size:28px;margin:0 0 6px;color:var(--ink)}
    .lead{color:var(--text-2);margin:0 0 26px}
    .choices{display:grid;gap:12px}
    .choice{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;box-shadow:var(--shadow-card);text-decoration:none;color:var(--text);transition:transform 160ms var(--ease),box-shadow 160ms var(--ease);text-align:left}
    .choice:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
    .tile{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:19px;background:var(--green-50);color:var(--green-700)}
    .tile.t{background:var(--blue-50);color:var(--blue-700)}
    .choice strong{display:block;font-size:15px}
    .choice span{color:var(--text-3);font-size:12.5px}
    .go{font-weight:800;color:var(--green-700)}
  </style>
  <meta name="theme-color" content="#246343">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InkHeron">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="glyph">i</div>
    <h1>InkHeron writing portal</h1>
    <p class="lead">Draft, submit and revise your writing. Sign in to continue.</p>
    <div class="choices">
      <a class="choice" href="/login">
        <span class="tile">S</span>
        <span><strong>Student sign in</strong><span>Open your assignments and write.</span></span>
        <span class="go">&rarr;</span>
      </a>
      <a class="choice" href="/teacher-login">
        <span class="tile t">T</span>
        <span><strong>Teacher sign in</strong><span>Review, mark and manage classes.</span></span>
        <span class="go">&rarr;</span>
      </a>
    </div>
  </main>
</body>
</html>
