<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your feedback · InkHeron</title>
<link rel="icon" href="/assets/InkHeron%20Logo.png">
<link rel="stylesheet" href="/assets/styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg)}
.appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 22px;background:rgba(247,246,242,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.glyph{width:30px;height:30px;border-radius:9px;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;transform:rotate(-4deg)}
.who{font-family:var(--serif);font-size:16px;font-weight:600}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border-radius:var(--r-sm);font-weight:800;font-size:13px;cursor:pointer;border:1.5px solid var(--border-2);background:var(--surface);color:var(--text);text-decoration:none}
.btn.primary{background:var(--green-600);color:#fff;border-color:var(--green-600)}
.wrap{max-width:1280px;margin:0 auto;padding:18px 22px 70px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}
.focusbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;box-shadow:var(--shadow-card);flex-wrap:wrap}
.focusbar .t{font-size:12.5px;font-weight:800;color:var(--text-2);margin-right:4px}
.fchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;border:1.5px solid var(--border-2);background:var(--bg);cursor:pointer;color:var(--text-2)}
.fchip .dot{width:8px;height:8px;border-radius:50%}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fchip .n{font-family:var(--mono);font-size:11px}
.paper{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:36px 42px}
.paper h2{font-family:var(--serif);font-size:20px;margin:0 0 2px}
.paper .meta{color:var(--text-3);font-size:12px;font-family:var(--mono);margin-bottom:16px}
.essay{font-family:var(--serif);font-size:17.5px;line-height:1.95;color:var(--ink);white-space:pre-wrap}
.mk{padding:0 1px;border-bottom:2px solid;cursor:help;position:relative}
.mk.surface{border-color:var(--amber-700)}
.mk.grammar{border-color:var(--maroon-500)}
.mk.format{border-color:var(--blue-700)}
.mk.dim{border-color:var(--surface-3)}
.tip{position:absolute;bottom:125%;left:0;background:var(--ink);color:#fff;font-family:var(--font);font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap;display:none;z-index:5}
.mk:hover .tip{display:block}
.rail{position:sticky;top:64px;display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card)}
.card>header{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--border)}
.card>header strong{font-size:13px}
.count{font-size:11px;font-weight:800;background:var(--surface-2);border-radius:999px;padding:2px 8px;color:var(--text-2)}
.body{padding:11px 13px;display:grid;gap:8px}
.fb{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 11px;background:var(--surface)}
.fb.s{border-left:4px solid var(--green-500)}
.fb.t{border-left:4px solid var(--blue-700)}
.fb .row{display:flex;align-items:flex-start;gap:9px}
.fb input[type=checkbox]{width:17px;height:17px;accent-color:var(--green-600);margin-top:1px;cursor:pointer}
.fb strong{font-size:12.5px;display:block}
.fb p{margin:3px 0 0;color:var(--text-2);font-size:12px}
.fb.done strong{text-decoration:line-through;color:var(--text-3)}
.trynow{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:800;color:var(--blue-700);background:var(--blue-50);border-radius:7px;padding:4px 9px}
.gauge{display:grid;gap:8px}
.grow{font-size:12.5px}
.grow .nm{display:flex;justify-content:space-between;margin-bottom:3px}
.grow .nm b{font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--green-500)}
.fill.ap{background:var(--blue-700)}
.gnote{font-size:11px;color:var(--text-3)}
.progress{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-2)}
.ring{font-weight:800;color:var(--green-700)}
.loading{padding:60px;text-align:center;color:var(--text-3)}
</style>
</head>
<body>
<div class="appbar">
  <div class="glyph">i</div>
  <span class="who" id="title">Your feedback</span>
  <span class="spacer"></span>
  <a class="btn primary" id="greenPen" href="#" style="display:none">Open green pen and fix</a>
</div>

<div class="wrap" id="wrap">
  <div class="focusbar" id="focusbar"></div>
  <div class="paper">
    <h2 id="essayTitle">…</h2>
    <div class="meta" id="essayMeta"></div>
    <div class="essay" id="essay"><div class="loading">Loading…</div></div>
  </div>
  <div class="rail" id="rail"></div>
</div>

<script>
const CAT_LABEL = { surface:'Spelling and words', grammar:'Grammar', format:'Punctuation' };
const CATS = ['surface','grammar','format'];
let csrf='', data=null, padId=null, activeFilter='all';

function esc(s){ return String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function api(path, opts={}){
  const o=Object.assign({headers:{}},opts);
  if(opts.method && opts.method!=='GET'){ o.headers['X-CSRF-Token']=csrf; if(opts.body && typeof opts.body!=='string'){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(opts.body);} }
  const r=await fetch(path,o); if(!r.ok && r.status!==204) throw new Error(path+' '+r.status);
  return r.status===204?null:r.json();
}
function fmt(n){ return Number.isInteger(n)?String(n):Number(n).toFixed(1); }

async function boot(){
  const assignmentId = location.pathname.split('/').filter(Boolean).at(-1);
  const me = await fetch('/api/me').then(r=>r.ok?r.json():null).catch(()=>null);
  if(!me || !me.user){ location.href='/login.html'; return; }
  csrf = me.user.csrf_token;
  data = await api('/api/native/assignments/'+encodeURIComponent(assignmentId)+'/feedback');
  padId = data.pad.id;
  render();
}

function litAnnotations(){ return data.annotations.filter(a=>a.type==='literacy_code'); }
function markCategory(a){ return (a.metadata && a.metadata.category) || 'grammar'; }

function render(){
  document.getElementById('title').textContent = 'Your feedback · ' + data.assignment.title;
  document.getElementById('essayTitle').textContent = data.assignment.title;
  const marked = (data.pad.submitted_at || data.pad.updated_at || '').slice(0,10);
  document.getElementById('essayMeta').textContent = 'marked '+marked+' · hover a mark to see WHAT KIND of error it is, then fix it yourself';
  const gp = document.getElementById('greenPen');
  if (data.assignment.green_pen && data.pad.state==='green_pen_open' && data.rewrite_url){ gp.style.display=''; gp.href=data.rewrite_url; }
  else gp.style.display='none';
  renderFocusBar();
  renderEssay();
  renderRail();
}

function renderFocusBar(){
  const lit = litAnnotations();
  const counts = { all: lit.length };
  for (const c of CATS) counts[c] = lit.filter(a=>markCategory(a)===c).length;
  const bar = document.getElementById('focusbar');
  bar.innerHTML = '<span class="t">Show me</span>';
  const chips = [['all','All marks', null, counts.all]].concat(CATS.map(c=>[c, CAT_LABEL[c], c, counts[c]]));
  for (const [key,label,cat,n] of chips){
    if (key!=='all' && n===0) continue;
    const chip = document.createElement('span');
    chip.className = 'fchip'+(activeFilter===key?' on':'');
    const dot = cat ? '<span class="dot" style="background:var(--'+(cat==='surface'?'amber-700':cat==='grammar'?'maroon-500':'blue-700')+')"></span>' : '';
    chip.innerHTML = dot + esc(label) + ' <span class="n">'+n+'</span>';
    chip.onclick = ()=>{ activeFilter=key; renderFocusBar(); applyFilter(); };
    bar.appendChild(chip);
  }
  const sp = document.createElement('span'); sp.className='spacer'; bar.appendChild(sp);
  const targets = data.feedback.targets;
  const done = targets.filter(t=>t.student_checked).length;
  const prog = document.createElement('span'); prog.className='progress';
  prog.innerHTML = '<span class="ring">'+done+' / '+targets.length+' targets done</span> in green pen';
  bar.appendChild(prog);
}

function renderEssay(){
  const text = data.pad.plain_text || '';
  const spans = litAnnotations()
    .filter(a=>a.start_offset!=null && a.end_offset!=null)
    .map(a=>({s:a.start_offset,e:a.end_offset,cat:markCategory(a)}))
    .sort((a,b)=>a.s-b.s||a.e-b.e);
  const kept=[]; let last=-1;
  for(const sp of spans){ if(sp.s>=last){ kept.push(sp); last=sp.e; } }
  let html=''; let cur=0;
  for(const sp of kept){
    if(sp.s>cur) html+=esc(text.slice(cur,sp.s));
    html+='<span class="mk '+sp.cat+'" data-cat="'+sp.cat+'">'+esc(text.slice(sp.s,sp.e))+'<span class="tip">'+esc(CAT_LABEL[sp.cat])+' — find and fix it</span></span>';
    cur=sp.e;
  }
  if(cur<text.length) html+=esc(text.slice(cur));
  document.getElementById('essay').innerHTML = html;
  applyFilter();
}

function applyFilter(){
  document.querySelectorAll('#essay .mk').forEach(m=>{
    const on = activeFilter==='all' || m.dataset.cat===activeFilter;
    m.classList.toggle('dim', !on);
  });
}

function renderRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML='';
  rail.appendChild(cardTargets());
  rail.appendChild(cardStrengths());
  rail.appendChild(cardScores());
}

function cardTargets(){
  const targets = data.feedback.targets;
  const done = targets.filter(t=>t.student_checked).length;
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = '<header><strong>Your targets</strong><span class="count">'+done+' of '+targets.length+' done</span></header>';
  const body = document.createElement('div'); body.className='body';
  const editable = data.assignment.green_pen && data.pad.state==='green_pen_open';
  for (const t of targets){
    const div = document.createElement('div'); div.className='fb t'+(t.student_checked?' done':'');
    const cb = '<input type="checkbox"'+(t.student_checked?' checked':'')+(editable?'':' disabled')+'>';
    const tryNow = t.try_now_prompt ? '<span class="trynow">Try now: '+esc(t.try_now_prompt)+'</span>' : '';
    div.innerHTML = '<div class="row">'+cb+'<div><strong>'+esc(t.title)+'</strong><p>'+esc(t.explanation||'')+'</p>'+tryNow+'</div></div>';
    const box = div.querySelector('input');
    if (editable) box.onchange = ()=>toggleCheck(t, div, box);
    body.appendChild(div);
  }
  if(!targets.length){ body.innerHTML='<p class="gnote">No targets yet.</p>'; }
  card.appendChild(body);
  return card;
}

async function toggleCheck(t, div, box){
  try{
    await api('/api/native/pads/'+padId+'/feedback-items/'+t.id+'/toggle-check', { method:'POST' });
    t.student_checked = box.checked;
    div.classList.toggle('done', box.checked);
    // refresh the counts in header + focus bar
    renderFocusBar(); const targets=data.feedback.targets; const done=targets.filter(x=>x.student_checked).length;
    div.closest('.card').querySelector('.count').textContent = done+' of '+targets.length+' done';
  }catch(e){ box.checked=!box.checked; }
}

function cardStrengths(){
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = '<header><strong>What you did well</strong></header>';
  const body = document.createElement('div'); body.className='body';
  for (const s of data.feedback.strengths){
    const div = document.createElement('div'); div.className='fb s';
    div.innerHTML = '<strong>'+esc(s.title)+'</strong>'+(s.explanation?'<p>'+esc(s.explanation)+'</p>':'');
    body.appendChild(div);
  }
  if(!data.feedback.strengths.length){ body.innerHTML='<p class="gnote">No strengths recorded yet.</p>'; }
  card.appendChild(body);
  return card;
}

function cardScores(){
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = '<header><strong>Your scores</strong></header>';
  const body = document.createElement('div'); body.className='body gauge';
  const rub = data.rubric; const scores = new Map((rub.scores||[]).map(s=>[s.criterion_id, s.selected_score]));
  for (const crit of rub.criteria){
    const max = Math.max.apply(null, crit.bands.map(b=>b.score_value).concat([5]));
    const v = scores.get(crit.id);
    body.appendChild(gaugeRow(crit.label, v, max, false));
  }
  if (data.exam_rubric.visible && data.exam_rubric.criteria.length){
    const note = document.createElement('div'); note.className='gnote'; note.style.marginTop='4px'; note.textContent='If this were the AP exam:';
    body.appendChild(note);
    const ex = data.exam_rubric; const exScores = new Map((ex.scores||[]).map(s=>[s.criterion_id, s.selected_score]));
    for (const crit of ex.criteria){
      const max = Math.max.apply(null, crit.bands.map(b=>b.score_value).concat([6]));
      body.appendChild(gaugeRow(crit.label, exScores.get(crit.id), max, true));
    }
  }
  const foot = document.createElement('div'); foot.className='gnote';
  foot.textContent = 'Grammar marks are practice, not your grade. Your grade comes from ideas, organisation and meeting the task.';
  body.appendChild(foot);
  card.appendChild(body);
  return card;
}

function gaugeRow(label, value, max, ap){
  const row = document.createElement('div'); row.className='grow';
  const pct = value!=null ? Math.round(value/max*100) : 0;
  row.innerHTML = '<div class="nm"><span>'+esc(label)+'</span><b>'+(value!=null?fmt(value)+' / '+max:'—')+'</b></div>'+
    '<div class="track"><div class="fill'+(ap?' ap':'')+'" style="width:'+pct+'%"></div></div>';
  return row;
}

boot().catch(err=>{ console.error(err); document.getElementById('essay').innerHTML='<div class="loading">'+esc(err.message)+'</div>'; });
</script>
</body>
</html>
