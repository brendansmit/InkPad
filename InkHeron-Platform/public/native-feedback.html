<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InkHeron - Feedback</title>
  <link rel="icon" href="/assets/InkHeron%20Logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);font-size:14px;line-height:1.55;color:var(--text);background:var(--bg);min-height:100vh}
    .appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:14px 26px;background:rgba(247,246,242,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
    .glyph{width:32px;height:32px;border-radius:10px;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;font-weight:600;transform:rotate(-4deg)}
    .brand{font-family:var(--serif);font-size:17px;font-weight:600}
    .spacer{flex:1}
    .container{max-width:1180px;margin:0 auto;padding:26px 24px 70px}
    .topline{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px}
    h1{font-family:var(--serif);font-size:30px;line-height:1.1;margin:0 0 4px;color:var(--ink)}
    .lead{margin:0;color:var(--text-2)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card)}
    .paper{padding:34px;min-height:58vh}
    .essay{white-space:pre-wrap;font-family:var(--serif);font-size:18px;line-height:1.78;color:var(--ink)}
    .mark{border-bottom:2px solid var(--green-600);background:var(--green-50);padding:0 1px}
    .mark.comment{border-color:var(--blue-700);background:var(--blue-50)}
    .mark.code{border-color:var(--maroon-500);background:var(--maroon-50)}
    .mark.highlight{border-color:var(--amber-700);background:var(--amber-50)}
    .side{position:sticky;top:82px;display:grid;gap:12px}
    .box{padding:16px}
    .label{display:block;color:var(--text-2);font-size:12px;font-weight:800;text-transform:uppercase;margin:0 0 7px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 13px;border-radius:var(--r-sm);font-weight:800;text-decoration:none;cursor:pointer;border:1.5px solid var(--border-2);background:var(--surface);color:var(--text)}
    .btn.primary{background:var(--green-600);color:#fff;border-color:var(--green-600)}
    .stack{display:grid;gap:9px}
    .item{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;background:var(--surface)}
    .item strong{display:block;font-size:13px;margin-bottom:3px}
    .item p{margin:0;color:var(--text-2)}
    .meta{font-family:var(--mono);font-size:12px;color:var(--text-3)}
    .pill{display:inline-flex;align-items:center;min-height:25px;border-radius:999px;padding:0 9px;font-size:12px;font-weight:800;background:var(--blue-50);color:var(--blue-700)}
    .empty{padding:24px;text-align:center;color:var(--text-3)}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.topline{display:block}.paper{min-height:40vh}}
  </style>
</head>
<body>
  <div class="appbar">
    <div class="glyph">i</div><div class="brand">InkHeron</div>
    <span class="spacer"></span>
    <a class="btn" href="/student">Dashboard</a>
  </div>
  <main class="container">
    <div class="topline">
      <div>
        <h1 id="title">Feedback</h1>
        <p class="lead" id="subtitle"></p>
      </div>
    </div>
    <div id="root" class="panel empty">Loading feedback...</div>
  </main>
  <script>
    let feedback=null;

    async function init(){
      const assignmentId=location.pathname.split('/').filter(Boolean).at(-1);
      const response=await fetch('/api/native/assignments/'+encodeURIComponent(assignmentId)+'/feedback');
      if(!response.ok){ renderError('Feedback is not available yet.'); return; }
      feedback=await response.json();
      document.getElementById('title').textContent=feedback.assignment.title;
      document.getElementById('subtitle').textContent=`${feedback.student.display_name} · ${statusLabel(feedback.pad.state)}`;
      render();
    }

    function render(){
      const general=feedback.annotations.filter(item=>item.type==='general_comment').at(-1);
      document.getElementById('root').className='layout';
      document.getElementById('root').innerHTML=`
        <article class="panel paper">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
            <span class="pill">Version ${feedback.pad.version} · ${feedback.pad.word_count} words</span>
          </div>
          <div class="essay">${renderMarkedText(feedback.pad.plain_text, feedback.annotations)}</div>
        </article>
        <aside class="side">
          <section class="panel box">
            <span class="label">General comment</span>
            ${general?`<div class="item"><p>${escapeHtml(general.body)}</p></div>`:'<div class="empty">No general comment yet.</div>'}
          </section>
          ${feedback.feedback?.strengths?.length ? `<section class="panel box">
            <span class="label">Strengths</span>
            ${feedbackItemsList(feedback.feedback.strengths, false)}
          </section>` : ''}
          ${feedback.feedback?.targets?.length ? `<section class="panel box">
            <span class="label">Targets</span>
            ${feedbackItemsList(feedback.feedback.targets, true)}
          </section>` : ''}
          ${feedback.rubric?.criteria?.length ? `<section class="panel box">
            <span class="label">${escapeHtml(feedback.rubric?.name || 'Rubric 1')}</span>
            ${rubricList(feedback.rubric)}
          </section>` : ''}
          ${feedback.secondary_rubric?.criteria?.length ? `<section class="panel box">
            <span class="label">${escapeHtml(feedback.secondary_rubric?.name || 'Rubric 2')}</span>
            ${rubricList(feedback.secondary_rubric)}
          </section>` : ''}
          ${feedback.exam_rubric?.visible && feedback.exam_rubric?.criteria?.length ? `<section class="panel box">
            <span class="label">AP Lang exam estimate</span>
            ${rubricList(feedback.exam_rubric)}
          </section>` : ''}
          <section class="panel box">
            <span class="label">Comments and codes</span>
            ${annotationList()}
          </section>
          <section class="panel box">
            <span class="label">Next step</span>
            ${feedback.assignment.green_pen && feedback.pad.state==='green_pen_open'
              ? `<a class="btn primary" href="${escapeHtml(feedback.rewrite_url)}">Open rewrite</a>`
              : '<span class="meta">No rewrite is open right now.</span>'}
          </section>
        </aside>
      `;
    }

    function rubricList(rubric){
      const criteria=rubric?.criteria || [];
      if(!criteria.length) return '<div class="empty">No rubric was attached.</div>';
      return `<div class="stack">${criteria.map(criterion=>{
        const score=(rubric?.scores || []).find(item=>Number(item.criterion_id)===Number(criterion.id));
        return `<div class="item"><strong>${escapeHtml(criterion.label)} ${score?`· ${score.selected_score}`:''}</strong><p>${escapeHtml(score?.note || criterion.description || '')}</p></div>`;
      }).join('')}</div>`;
    }

    function feedbackItemsList(items, withTryNow){
      return `<div class="stack">${(items||[]).map(item=>`
        <details class="item" style="cursor:pointer">
          <summary><strong>${escapeHtml(item.title)}</strong></summary>
          ${item.explanation?`<p>${escapeHtml(item.explanation)}</p>`:''}
          ${withTryNow && item.try_now_prompt?`<p class="meta"><strong>Try now:</strong> ${escapeHtml(item.try_now_prompt)}</p>`:''}
        </details>
      `).join('')}</div>`;
    }

    function annotationList(){
      const annotations=feedback.annotations.filter(item=>item.type!=='general_comment');
      if(!annotations.length) return '<div class="empty">No inline feedback yet.</div>';
      return `<div class="stack">${annotations.map(item=>`
        <div class="item">
          <strong>${escapeHtml(labelForType(item.type))}${item.metadata?.label?` · ${escapeHtml(item.metadata.label)}`:''}</strong>
          ${item.selected_text?`<p><mark>${escapeHtml(item.selected_text)}</mark></p>`:''}
          <p>${escapeHtml(item.body || '')}</p>
        </div>
      `).join('')}</div>`;
    }

    function renderMarkedText(text, annotations){
      const ranged=annotations
        .filter(item=>item.type!=='general_comment' && Number.isInteger(item.start_offset) && Number.isInteger(item.end_offset))
        .map(item=>({...item,start_offset:Math.max(0,Math.min(text.length,item.start_offset)),end_offset:Math.max(0,Math.min(text.length,item.end_offset))}))
        .filter(item=>item.end_offset>item.start_offset)
        .sort((a,b)=>a.start_offset-b.start_offset || a.end_offset-b.end_offset);
      let cursor=0;
      let html='';
      ranged.forEach(item=>{
        if(item.start_offset<cursor) return;
        html+=escapeHtml(text.slice(cursor,item.start_offset));
        html+=`<span class="mark ${escapeHtml(markClass(item.type))}" title="${escapeHtml(item.body || item.metadata?.label || item.type)}">${escapeHtml(text.slice(item.start_offset,item.end_offset))}</span>`;
        cursor=item.end_offset;
      });
      html+=escapeHtml(text.slice(cursor));
      return html || '<span class="meta">No text saved.</span>';
    }

    function labelForType(type){
      return {inline_comment:'Comment',literacy_code:'Code',highlight:'Highlight'}[type] || type;
    }
    function markClass(type){
      return {inline_comment:'comment',literacy_code:'code',highlight:'highlight'}[type] || '';
    }
    function statusLabel(status){
      return {green_pen_open:'Feedback returned',marked:'Marked',submitted:'Submitted',resubmitted:'Resubmitted',writing:'Writing'}[status] || status;
    }
    function renderError(message){
      document.getElementById('root').className='panel empty';
      document.getElementById('root').textContent=message;
    }
    function escapeHtml(value){
      const div=document.createElement('div');
      div.textContent=value ?? '';
      return div.innerHTML;
    }
    init();
  </script>
</body>
</html>
