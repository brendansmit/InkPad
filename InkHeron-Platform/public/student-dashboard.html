<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InkHeron</title>
  <link rel="icon" href="/assets/InkHeron%20Logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    body{margin:0;font-family:var(--font);font-size:14px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;}
    *{box-sizing:border-box;}
    .appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:14px 26px;background:rgba(247,246,242,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
    .glyph{width:34px;height:34px;border-radius:10px;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;font-weight:600;transform:rotate(-4deg);}
    .brand{font-family:var(--serif);font-size:18px;font-weight:600;}
    .sp{flex:1;}
    .who{color:var(--text-2);font-size:13px;}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border-radius:var(--r-sm);font-weight:700;text-decoration:none;transition:transform 160ms var(--ease),box-shadow 160ms var(--ease);cursor:pointer;border:1.5px solid var(--border-2);background:var(--surface);color:var(--text);}
    .btn:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);}
    .btn.p{background:var(--green-600);color:#fff;border:none;}
    .btn.coral{background:var(--coral-500);color:#fff;border:none;box-shadow:0 4px 14px rgba(201,106,78,0.22);}
    .container{max-width:980px;margin:0 auto;padding:32px 26px 82px;}
    h1{font-family:var(--serif);font-size:34px;line-height:1.08;margin:0 0 8px;color:var(--ink);}
    .lead{color:var(--text-2);font-size:16px;margin:0 0 26px;}
    .signin{max-width:560px;margin:60px auto;padding:34px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-card);text-align:center;}
    .signin h1{font-size:30px;}
    .cards{display:grid;gap:12px;}
    .acard{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;box-shadow:var(--shadow-card);text-decoration:none;color:var(--text);transition:transform 160ms var(--ease),box-shadow 160ms var(--ease);}
    .acard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);}
    .tile{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:20px;background:var(--green-50);color:var(--green-700);}
    .tile.test{background:var(--blue-50);color:var(--blue-700);}
    .title{font-weight:800;margin-bottom:2px;display:block;}
    .meta{color:var(--text-3);font-size:13px;display:block;}
    .pill{display:inline-flex;align-items:center;min-height:26px;border-radius:999px;padding:0 10px;font-size:12.5px;font-weight:800;background:var(--surface-2);color:var(--text-2);}
    .pill.prog{background:var(--blue-50);color:var(--blue-700);}
    .pill.done{background:var(--green-50);color:var(--green-700);}
    .pill.fix{background:var(--coral-50);color:var(--coral-600);border:1px solid var(--coral-100);}
    .pill.soon{background:var(--amber-50);color:var(--amber-700);}
    .returned{position:relative;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--coral-50);border:1px solid var(--coral-100);border-radius:var(--r-lg);padding:18px 20px;margin:0 0 22px;box-shadow:var(--shadow-card);}
    .returned strong{display:block;color:var(--coral-600);font-size:15px;margin-bottom:4px;}
    .returned span{color:var(--text-2);}
    .section{margin-top:26px;}
    .section h2{font-size:15px;margin:0 0 10px;}
    .timeline{display:grid;gap:8px;}
    .trow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;}
    .trow .name{font-weight:700;}
    .trow .date{margin-left:auto;color:var(--text-3);font-size:12.5px;}
    .empty{padding:26px;text-align:center;color:var(--text-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);}
    @media(max-width:680px){.container{padding:24px 18px 70px;}h1{font-size:30px;}.acard{grid-template-columns:42px 1fr;}.acard .pill{grid-column:2;justify-self:start;}.returned{grid-template-columns:1fr;}.trow{align-items:flex-start;flex-direction:column;}.trow .date{margin-left:0;}}
  </style>
</head>
<body>
  <div class="appbar">
    <div class="glyph">i</div><div class="brand">InkHeron</div>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <button class="btn" id="logoutBtn" type="button" hidden>Sign out</button>
  </div>

  <main class="container" id="root">
    <section class="signin">
      <h1>Writing portal</h1>
      <p class="lead">Sign in to see what is waiting for you.</p>
      <a class="btn p" href="/login">Student sign in</a>
      <a class="btn" href="/teacher-login">Teacher sign in</a>
    </section>
  </main>

  <script>
    let csrfToken='';

    async function init(){
      const me=await fetch('/api/me');
      if(!me.ok) return;
      const data=await me.json();
      if(data.user.type==='teacher'){ window.location.href='/teacher'; return; }
      if(data.user.must_change_password){ window.location.href='/student/change-password'; return; }
      csrfToken=data.user.csrf_token;
      document.getElementById('who').textContent=data.user.display_name;
      document.getElementById('logoutBtn').hidden=false;
      await loadAssignments(data.user.display_name);
    }

    async function loadAssignments(name){
      const r=await fetch('/api/student/assignments');
      if(!r.ok) return;
      const data=await r.json();
      const assignments=data.assignments || [];
      const returned=assignments.filter(a=>a.status==='needs_rewrite');
      const actionable=assignments.filter(a=>['not_started','in_progress','needs_rewrite','resubmitted'].includes(a.status));
      document.getElementById('root').innerHTML=`
        <h1>Hi ${escapeHtml(name)}</h1>
        <p class="lead">${summaryCopy(actionable.length, returned.length)}</p>
        ${returned.map(returnedCard).join('')}
        <section class="section">
          <h2>What to do</h2>
          <div class="cards">${actionable.length?actionable.map(assignmentCard).join(''):'<div class="empty">Nothing needs your attention right now.</div>'}</div>
        </section>
        <section class="section">
          <h2>By due date</h2>
          <div class="timeline">${assignments.length?assignments.map(timelineRow).join(''):'<div class="empty">No assignments yet.</div>'}</div>
        </section>
      `;
    }

    function summaryCopy(count, returnedCount){
      if(returnedCount) return `You've got returned work to improve. Start there.`;
      if(count===0) return `You're all caught up.`;
      if(count===1) return `You've got one thing to look at today.`;
      return `You've got ${count} things to look at today.`;
    }

    function returnedCard(a){
      return `<section class="returned"><div><strong>Feedback ready</strong><span>${escapeHtml(a.title)} is ready for green-pen rewriting.</span></div><a class="btn coral" href="${escapeHtml(a.write_url || `/write/${a.id}`)}">Open feedback</a></section>`;
    }

    function assignmentCard(a){
      return `<a class="acard" href="${escapeHtml(a.write_url || `/write/${a.id}`)}"><span class="tile ${a.type==='test'?'test':''}">${a.type==='test'?'T':'E'}</span><span><span class="title">${escapeHtml(a.title)}</span><span class="meta">${dateLabel(a.due_at)}</span></span><span class="pill ${pillClass(a.status)}">${statusLabel(a.status)}</span></a>`;
    }

    function timelineRow(a){
      return `<div class="trow"><span class="name">${escapeHtml(a.title)}</span><span class="pill ${pillClass(a.status)}">${statusLabel(a.status)}</span><span class="date">${dateLabel(a.due_at)}</span></div>`;
    }

    function statusLabel(status){
      const labels={not_started:'To do',in_progress:'In progress',submitted:'Submitted',marked:'Marked',released:'Released',needs_rewrite:'Needs rewrite',resubmitted:'Resubmitted',upcoming:'Upcoming',closed:'Closed'};
      return labels[status] || status;
    }

    function pillClass(status){
      if(status==='needs_rewrite') return 'fix';
      if(status==='submitted'||status==='released'||status==='resubmitted') return 'done';
      if(status==='in_progress') return 'prog';
      if(status==='upcoming'||status==='closed') return 'soon';
      return '';
    }

    function dateLabel(value){
      if(!value) return 'No due date';
      const date=new Date(value);
      if(Number.isNaN(date.getTime())) return value;
      return `Due ${date.toLocaleString([], { dateStyle:'medium', timeStyle:'short' })}`;
    }

    function escapeHtml(str){const div=document.createElement('div');div.textContent=str;return div.innerHTML;}

    document.getElementById('logoutBtn').addEventListener('click',async ()=>{
      await fetch('/api/logout',{method:'POST',headers:{'X-CSRF-Token':csrfToken}});
      window.location.href='/login';
    });

    init();
  </script>
</body>
</html>
