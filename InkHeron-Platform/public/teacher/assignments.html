<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InkHeron - Assignments</title>
  <link rel="icon" href="/assets/InkHeron%20Logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    :root{--bg:#F7F6F2;--surface:#FFFFFF;--surface-2:#F1EFE9;--border:rgba(20,20,18,0.12);--border-2:rgba(20,20,18,0.22);--ink:#141412;--text:#1C1C1A;--text-2:#5C5B55;--text-3:#8C8B83;--green-50:#EAF3EC;--green-600:#246343;--green-700:#1B4A32;--maroon-50:#F6E9EB;--maroon-500:#8C2F3B;--blue-50:#E8F0F7;--blue-700:#1F5076;--amber-50:#FBF0DC;--amber-700:#8A5A12;--r-sm:10px;--r-md:14px;--font:'Inter',-apple-system,system-ui,sans-serif;--serif:'Source Serif 4',Georgia,serif;--mono:ui-monospace,'SF Mono',Menlo,monospace;--shadow-card:0 2px 14px rgba(20,20,18,0.05);--shadow-lift:0 10px 30px rgba(20,20,18,0.10);}
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--font);font-size:14px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;}
    .appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:14px 26px;background:rgba(247,246,242,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
    .appbar .glyph{width:32px;height:32px;border-radius:10px;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;font-weight:600;transform:rotate(-4deg);}
    .appbar .nm{font-family:var(--serif);font-size:17px;font-weight:600;}
    .appbar .sp{flex:1;}
    .container{max-width:1120px;margin:0 auto;padding:30px 26px 80px;}
    h1{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:0;margin:0 0 8px;}
    .lead{color:var(--text-2);font-size:15px;margin:0 0 22px;}
    .back{color:var(--text-2);font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;}
    .back:hover{color:var(--text);}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:var(--r-sm);font-weight:700;text-decoration:none;transition:transform 160ms,box-shadow 160ms;cursor:pointer;border:1.5px solid var(--border-2);background:var(--surface);color:var(--text);}
    .btn:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);}
    .controls{display:grid;grid-template-columns:minmax(220px,1fr) minmax(160px,220px) minmax(150px,190px) minmax(150px,190px);gap:12px;align-items:end;margin-bottom:18px;}
    label{display:block;color:var(--text-2);font-size:12px;font-weight:700;margin:0 0 6px;text-transform:uppercase;}
    select{width:100%;border:1.5px solid var(--border-2);border-radius:var(--r-sm);padding:10px 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--text);}
    .summary{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin:0 0 18px;}
    .metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow-card);}
    .metric .n{font-size:24px;font-weight:700;line-height:1;}
    .metric .k{color:var(--text-2);font-size:12px;margin-top:6px;}
    .table-wrap{overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card);}
    table{width:100%;border-collapse:collapse;min-width:840px;}
    th,td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;}
    th{font-size:12px;text-transform:uppercase;color:var(--text-2);background:var(--surface-2);position:sticky;top:0;z-index:1;}
    tr:last-child td{border-bottom:none;}
    .student{font-weight:700;}
    .user{display:block;color:var(--text-3);font-size:12.5px;font-weight:400;margin-top:2px;}
    .pill{display:inline-flex;align-items:center;min-height:26px;border-radius:999px;padding:0 10px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--text-2);}
    .pill.writing{background:var(--blue-50);color:var(--blue-700);}
    .pill.submitted{background:var(--amber-50);color:var(--amber-700);}
    .pill.marked,.pill.released{background:var(--green-50);color:var(--green-700);}
    .pill.flag{background:var(--maroon-50);color:var(--maroon-500);}
    .mono{font-family:var(--mono);font-size:12.5px;color:var(--text-2);}
    .empty{color:var(--text-3);font-size:13.5px;text-align:center;padding:28px;}
    @media(max-width:760px){.container{padding:24px 18px 64px;}.controls{grid-template-columns:1fr;}.summary{grid-template-columns:repeat(2,minmax(120px,1fr));}}
  </style>
</head>
<body>
  <div class="appbar">
    <div class="glyph">i</div><div class="nm">InkHeron</div>
    <span class="sp"></span>
    <button class="btn" id="logoutBtn" type="button">Sign out</button>
  </div>

  <main class="container">
    <a class="back" href="/teacher">← Back to dashboard</a>
    <h1>Assignments</h1>
    <p class="lead" id="assignmentLead">Choose an assignment to review class progress.</p>

    <div class="controls">
      <div>
        <label for="assignmentSelect">Assignment</label>
        <select id="assignmentSelect"></select>
      </div>
      <div>
        <label for="statusFilter">Status</label>
        <select id="statusFilter">
          <option value="all">All statuses</option>
          <option value="not_started">Not started</option>
          <option value="writing">Writing</option>
          <option value="submitted">Submitted</option>
          <option value="marked">Marked</option>
          <option value="released">Released</option>
        </select>
      </div>
      <div>
        <label for="pasteFilter">Paste</label>
        <select id="pasteFilter">
          <option value="all">All</option>
          <option value="flagged">Flagged</option>
          <option value="clear">Clear</option>
        </select>
      </div>
      <div>
        <label for="sortSelect">Sort</label>
        <select id="sortSelect">
          <option value="student">Student</option>
          <option value="status">Status</option>
          <option value="submitted_at">Submission time</option>
          <option value="paste">Paste flags</option>
        </select>
      </div>
    </div>

    <div class="summary" id="summary"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Student</th>
            <th>Status</th>
            <th>Submitted</th>
            <th>Paste</th>
            <th>Score</th>
            <th>Review</th>
          </tr>
        </thead>
        <tbody id="studentsBody"></tbody>
      </table>
    </div>
  </main>

  <script>
    let csrfToken='';
    let assignments=[];

    async function init(){
      const me=await fetch('/api/me');
      if(!me.ok){ window.location.href='/teacher-login'; return; }
      const user=await me.json();
      if(user.user.type!=='teacher'){ window.location.href='/'; return; }
      csrfToken=user.user.csrf_token;
      await loadAssignments();
      bindControls();
      await loadDashboard();
    }

    async function loadAssignments(){
      const r=await fetch('/api/assignments');
      const data=await r.json();
      assignments=data.assignments || [];
      const select=document.getElementById('assignmentSelect');
      select.innerHTML='';
      if(!assignments.length){
        select.innerHTML='<option value="">No assignments</option>';
        renderEmpty('No assignments found.');
        return;
      }
      assignments.forEach(a=>{
        const option=document.createElement('option');
        option.value=a.id;
        option.textContent=a.title;
        select.appendChild(option);
      });
      const params=new URLSearchParams(window.location.search);
      if(params.get('id')) select.value=params.get('id');
    }

    function bindControls(){
      ['assignmentSelect','statusFilter','pasteFilter','sortSelect'].forEach(id=>{
        document.getElementById(id).addEventListener('change',loadDashboard);
      });
      document.getElementById('logoutBtn').addEventListener('click',async ()=>{
        await fetch('/api/logout',{method:'POST',headers:{'X-CSRF-Token':csrfToken}});
        window.location.href='/teacher-login';
      });
    }

    async function loadDashboard(){
      const id=document.getElementById('assignmentSelect').value;
      if(!id) return;
      const qs=new URLSearchParams({
        status:document.getElementById('statusFilter').value,
        paste:document.getElementById('pasteFilter').value,
        sort:document.getElementById('sortSelect').value,
      });
      const r=await fetch(`/api/assignments/${id}/dashboard?${qs.toString()}`);
      if(!r.ok){ renderEmpty('Could not load this assignment.'); return; }
      const data=await r.json();
      document.getElementById('assignmentLead').textContent=`${data.class.name} · ${data.assignment.title}`;
      renderSummary(data.students);
      renderRows(data.students);
      const url=new URL(window.location.href);
      url.searchParams.set('id',id);
      history.replaceState(null,'',url.toString());
    }

    function renderSummary(rows){
      const counts={total:rows.length,not_started:0,writing:0,submitted:0,marked:0,released:0,paste:0};
      rows.forEach(row=>{
        if(counts[row.status]!==undefined) counts[row.status]+=1;
        if(row.paste_flag) counts.paste+=1;
      });
      const items=[
        ['Total',counts.total],
        ['Not started',counts.not_started],
        ['Writing',counts.writing],
        ['Submitted',counts.submitted],
        ['Paste flags',counts.paste],
      ];
      document.getElementById('summary').innerHTML=items.map(([label,value])=>`<div class="metric"><div class="n">${value}</div><div class="k">${label}</div></div>`).join('');
    }

    function renderRows(rows){
      const body=document.getElementById('studentsBody');
      if(!rows.length){ renderEmpty('No students match these filters.'); return; }
      body.innerHTML=rows.map(row=>`
        <tr>
          <td><span class="student">${escapeHtml(row.display_name)}</span><span class="user">${escapeHtml(row.username)}</span></td>
          <td><span class="pill ${escapeHtml(row.status)}">${statusLabel(row.status)}</span></td>
          <td>${row.submitted_at?`<span class="mono">${formatDate(row.submitted_at)}</span>`:'-'}</td>
          <td>${row.paste_flag?`<span class="pill flag">${row.paste_count} event${row.paste_count===1?'':'s'}</span>`:'-'}</td>
          <td>${row.score===null?'-':escapeHtml(String(row.score))}</td>
          <td>${row.pad_id?`<a class="btn" href="/teacher/review?pad_id=${row.pad_id}">Review</a>`:'-'}</td>
        </tr>
      `).join('');
    }

    function renderEmpty(message){
      document.getElementById('summary').innerHTML='';
      document.getElementById('studentsBody').innerHTML=`<tr><td class="empty" colspan="6">${escapeHtml(message)}</td></tr>`;
    }

    function statusLabel(status){
      const labels={not_started:'Not started',writing:'Writing',submitted:'Submitted',marked:'Marked',released:'Released',green_pen_open:'Green pen',resubmitted:'Resubmitted'};
      return labels[status] || status;
    }

    function formatDate(value){
      const date=new Date(value);
      if(Number.isNaN(date.getTime())) return value;
      return date.toLocaleString([], { dateStyle:'medium', timeStyle:'short' });
    }

    function escapeHtml(str){const div=document.createElement('div');div.textContent=str;return div.innerHTML;}

    init();
  </script>
</body>
</html>
