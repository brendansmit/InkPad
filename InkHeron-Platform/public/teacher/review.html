<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InkHeron - Review</title>
  <link rel="icon" href="/assets/InkHeron%20Logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    :root{--bg:#F7F6F2;--surface:#FFFFFF;--surface-2:#F1EFE9;--border:rgba(20,20,18,0.12);--border-2:rgba(20,20,18,0.22);--ink:#141412;--text:#1C1C1A;--text-2:#5C5B55;--text-3:#8C8B83;--green-50:#EAF3EC;--green-600:#246343;--green-700:#1B4A32;--maroon-50:#F6E9EB;--maroon-500:#8C2F3B;--blue-50:#E8F0F7;--blue-700:#1F5076;--r-sm:10px;--r-md:14px;--font:'Inter',-apple-system,system-ui,sans-serif;--serif:'Source Serif 4',Georgia,serif;--mono:ui-monospace,'SF Mono',Menlo,monospace;--shadow-card:0 2px 14px rgba(20,20,18,0.05);--shadow-lift:0 10px 30px rgba(20,20,18,0.10);}
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--font);font-size:14px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;}
    .appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:14px 26px;background:rgba(247,246,242,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
    .appbar .glyph{width:32px;height:32px;border-radius:10px;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;font-weight:600;transform:rotate(-4deg);}
    .appbar .nm{font-family:var(--serif);font-size:17px;font-weight:600;}
    .appbar .sp{flex:1;}
    .container{max-width:1180px;margin:0 auto;padding:30px 26px 80px;}
    .back{color:var(--text-2);font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;}
    .back:hover{color:var(--text);}
    h1{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:0;margin:0 0 6px;}
    .lead{color:var(--text-2);font-size:15px;margin:0 0 22px;}
    .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start;}
    .rail,.paper,.marking{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card);}
    .rail{padding:18px;position:sticky;top:82px;}
    .section{border-top:1px solid var(--border);padding-top:16px;margin-top:16px;}
    .section:first-child{border-top:none;padding-top:0;margin-top:0;}
    .label{display:block;color:var(--text-2);font-size:12px;font-weight:700;text-transform:uppercase;margin:0 0 6px;}
    .value{font-weight:700;}
    .sub{display:block;color:var(--text-3);font-size:12.5px;margin-top:2px;}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:var(--r-sm);font-weight:700;text-decoration:none;transition:transform 160ms,box-shadow 160ms;cursor:pointer;border:1.5px solid var(--border-2);background:var(--surface);color:var(--text);}
    .btn:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px);}
    .btn.primary{background:var(--green-600);color:#fff;border:none;}
    .stack{display:grid;gap:10px;}
    .pill{display:inline-flex;align-items:center;min-height:26px;border-radius:999px;padding:0 10px;font-size:12.5px;font-weight:700;background:var(--blue-50);color:var(--blue-700);}
    .pill.flag{background:var(--maroon-50);color:var(--maroon-500);}
    .paper{padding:28px 34px;min-height:460px;}
    .paper-text{white-space:pre-wrap;font-family:var(--serif);font-size:18px;line-height:1.72;color:var(--ink);}
    .code-mark{border-bottom:2px solid var(--maroon-500);background:var(--maroon-50);padding:0 1px;cursor:help;}
    .code-mark sup{font-family:var(--font);font-size:10px;font-weight:700;color:var(--maroon-500);margin-left:2px;}
    .legend{display:grid;gap:8px;margin-top:10px;}
    .legend-item{font-size:12.5px;color:var(--text-2);background:var(--surface-2);border-radius:8px;padding:8px;}
    .legend-item strong{color:var(--maroon-500);}
    .target-carry{display:grid;gap:8px;margin-bottom:14px;}
    .target-carry .item{background:var(--blue-50);color:var(--blue-700);border-radius:8px;padding:10px 12px;font-size:13px;}
    .target-carry strong{display:block;color:var(--text);margin-bottom:2px;}
    .marking{margin-top:18px;padding:18px;}
    .marking-grid{display:grid;grid-template-columns:1fr 1fr 140px;gap:12px;}
    select,input{width:100%;border:1.5px solid var(--border-2);border-radius:var(--r-sm);padding:10px 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--text);}
    select[multiple]{min-height:108px;}
    .muted{color:var(--text-3);font-size:13px;}
    .paste-list{display:grid;gap:8px;margin-top:10px;}
    .paste-item{font-family:var(--mono);font-size:12px;color:var(--text-2);background:var(--surface-2);border-radius:8px;padding:8px;}
    .empty{color:var(--text-3);padding:32px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);}
    @media(max-width:860px){.container{padding:24px 18px 64px;}.layout{grid-template-columns:1fr;}.rail{position:static;}.marking-grid{grid-template-columns:1fr;}.paper{padding:22px;}}
  </style>
</head>
<body>
  <div class="appbar">
    <div class="glyph">i</div><div class="nm">InkHeron</div>
    <span class="sp"></span>
    <button class="btn" id="logoutBtn" type="button">Sign out</button>
  </div>

  <main class="container">
    <a class="back" id="backLink" href="/teacher/assignments">← Back to assignment</a>
    <h1 id="title">Review</h1>
    <p class="lead" id="subtitle"></p>

    <div id="reviewRoot" class="empty">Loading review...</div>
  </main>

  <script>
    let csrfToken='';

    async function init(){
      const me=await fetch('/api/me');
      if(!me.ok){ window.location.href='/teacher-login'; return; }
      const user=await me.json();
      if(user.user.type!=='teacher'){ window.location.href='/'; return; }
      csrfToken=user.user.csrf_token;
      document.getElementById('logoutBtn').addEventListener('click',async ()=>{
        await fetch('/api/logout',{method:'POST',headers:{'X-CSRF-Token':csrfToken}});
        window.location.href='/teacher-login';
      });
      await loadReview();
    }

    async function loadReview(){
      const params=new URLSearchParams(window.location.search);
      const padId=params.get('pad_id');
      if(!padId){ renderError('No pad selected.'); return; }
      const r=await fetch(`/api/pads/${padId}/review`);
      if(!r.ok){ renderError('Could not load this submission.'); return; }
      const data=await r.json();
      document.getElementById('title').textContent=data.student.display_name;
      document.getElementById('subtitle').textContent=`${data.assignment.title} · ${data.class.name}`;
      document.getElementById('backLink').href=`/teacher/assignments?id=${data.assignment.id}`;
      renderReview(data);
    }

    function renderReview(data){
      const submitted=data.submission?.submitted_at ? formatDate(data.submission.submitted_at) : 'Not submitted';
      const pasteCount=data.paste_events.length;
      document.getElementById('reviewRoot').className='layout';
      const selectedStrengths=data.feedback.filter(item=>item.kind==='strength').map(item=>item.key);
      const selectedTargets=data.feedback.filter(item=>item.kind==='target').map(item=>item.key);
      document.getElementById('reviewRoot').innerHTML=`
        <aside class="rail">
          <div class="section">
            <span class="label">Student</span>
            <span class="value">${escapeHtml(data.student.display_name)}</span>
            <span class="sub">${escapeHtml(data.student.username)}</span>
          </div>
          <div class="section">
            <span class="label">Submission</span>
            <span class="pill">${escapeHtml(data.pad.state)}</span>
            <span class="sub">${escapeHtml(submitted)}</span>
          </div>
          <div class="section">
            <span class="label">Codes</span>
            ${data.codes.length?`<div class="legend">${codeLegend(data.codes)}</div>`:'<span class="sub">No literacy codes attached</span>'}
            ${data.submission?`<button class="btn sm" type="button" id="analyseBtn" style="margin-top:6px;">Run analysis</button><span class="sub" id="analyseMsg"></span>`:''}
          </div>
          <div class="section">
            <span class="label">Evidence</span>
            ${pasteCount?`<span class="pill flag">${pasteCount} paste event${pasteCount===1?'':'s'}</span>`:'<span class="sub">No paste events</span>'}
            <div class="paste-list">${data.paste_events.map(event=>`<div class="paste-item">${escapeHtml(formatDate(event.at))}<br>${event.length} chars</div>`).join('')}</div>
          </div>
          <div class="section stack">
            <button class="btn primary" type="button" id="replayBtn">Timeslider replay</button>
            <button class="btn" type="button" id="previewPadBtn">Preview pad</button>
            <button class="btn" type="button" id="codesBtn">Literacy codes</button>
          </div>
        </aside>
        <section>
          <article class="paper">
            <div class="paper-text" id="paperText">${escapeHtml(data.text || 'No text found for this pad.')}</div>
          </article>
          <div class="marking">
            <div class="target-carry">
              ${previousTargets(data.previous_targets)}
            </div>
            <div class="marking-grid">
              <div>
                <label class="label" for="strengthSelect">Strength</label>
                <select id="strengthSelect" multiple ${data.submission?'':'disabled'}>${feedbackOptions(data.feedback_options.strengths, selectedStrengths)}</select>
              </div>
              <div>
                <label class="label" for="targetSelect">Target</label>
                <select id="targetSelect" multiple ${data.submission?'':'disabled'}>${feedbackOptions(data.feedback_options.targets, selectedTargets)}</select>
              </div>
              <div>
                <label class="label" for="gradeInput">Grade</label>
                <input id="gradeInput" type="number" min="0" step="0.5" value="${data.grade?.score ?? ''}">
              </div>
            </div>
            <div class="stack" style="margin-top:12px;max-width:180px;">
              <button class="btn primary" type="button" id="saveFeedbackBtn" ${data.submission?'':'disabled'}>Save feedback</button>
              <button class="btn" type="button" id="saveGradeBtn" ${data.submission?'':'disabled'}>Save grade</button>
            </div>
            <p class="muted" id="feedbackMsg">${data.submission?'Feedback and grades are held until release.':'Submit the pad before saving feedback.'}</p>
          </div>
        </section>
      `;
      document.getElementById('replayBtn').addEventListener('click',()=>{
        window.location.href=`/teacher/timeslider?pad_id=${data.pad.id}&title=${encodeURIComponent(data.assignment?.title||'')}`;
      });
      document.getElementById('previewPadBtn').addEventListener('click',()=>{
        window.open(`/teacher/preview-pad/${data.pad.id}`,'_blank');
      });
      let coded=false;
      document.getElementById('codesBtn').addEventListener('click',()=>{
        coded=!coded;
        document.getElementById('paperText').innerHTML=coded
          ? renderCodedText(data.text || 'No text found for this pad.', data.codes)
          : escapeHtml(data.text || 'No text found for this pad.');
        document.getElementById('codesBtn').textContent=coded?'Plain text':'Literacy codes';
      });
      document.getElementById('saveFeedbackBtn').addEventListener('click',()=>saveFeedback(data.submission?.id));
      document.getElementById('saveGradeBtn').addEventListener('click',()=>saveGrade(data.submission?.id));
      const analyseBtn=document.getElementById('analyseBtn');
      if(analyseBtn){
        analyseBtn.addEventListener('click',async()=>{
          analyseBtn.disabled=true;
          analyseBtn.textContent='Analysing...';
          document.getElementById('analyseMsg').textContent='';
          try{
            const r=await fetch(`/api/submissions/${data.submission.id}/analyse`,{
              method:'POST',
              headers:{'X-CSRF-Token':csrfToken},
              credentials:'same-origin',
            });
            if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||r.status);}
            const result=await r.json();
            document.getElementById('analyseMsg').textContent=`Done — ${result.codes.length} code${result.codes.length===1?'':'s'} found.`;
            analyseBtn.textContent='Run analysis';
            analyseBtn.disabled=false;
            setTimeout(()=>location.reload(),1000);
          }catch(e){
            document.getElementById('analyseMsg').textContent='Error: '+e.message;
            analyseBtn.textContent='Run analysis';
            analyseBtn.disabled=false;
          }
        });
      }
    }

    async function saveFeedback(submissionId){
      if(!submissionId) return;
      const body={
        strengths:selectedValues(document.getElementById('strengthSelect')),
        targets:selectedValues(document.getElementById('targetSelect')),
      };
      const r=await fetch(`/api/submissions/${submissionId}/feedback`,{
        method:'POST',
        headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},
        body:JSON.stringify(body),
      });
      const msg=document.getElementById('feedbackMsg');
      if(!r.ok){msg.textContent='Could not save feedback.';return;}
      msg.textContent='Feedback saved.';
    }

    async function saveGrade(submissionId){
      if(!submissionId) return;
      const score=Number(document.getElementById('gradeInput').value);
      const r=await fetch(`/api/submissions/${submissionId}/grade`,{
        method:'POST',
        headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},
        body:JSON.stringify({score}),
      });
      const msg=document.getElementById('feedbackMsg');
      if(!r.ok){msg.textContent='Could not save grade.';return;}
      msg.textContent='Grade saved and held until release.';
    }

    function selectedValues(select){
      return [...select.selectedOptions].map(option=>option.value);
    }

    function feedbackOptions(options, selected){
      const chosen=new Set(selected);
      return options.map(option=>`<option value="${escapeHtml(option.id)}" ${chosen.has(option.id)?'selected':''}>${escapeHtml(option.title)}</option>`).join('');
    }

    function previousTargets(targets){
      if(!targets.length) return '<p class="muted">No previous targets for this student.</p>';
      return targets.map(target=>`<div class="item"><strong>${escapeHtml(target.assignment_title)}: ${escapeHtml(target.title)}</strong>${escapeHtml(target.explanation)}</div>`).join('');
    }

    function codeLegend(codes){
      const unique=new Map();
      codes.forEach(item=>{
        const key=`${item.code}|${item.category}`;
        if(!unique.has(key)) unique.set(key,item);
      });
      return [...unique.values()].map(item=>`<div class="legend-item"><strong>${escapeHtml(item.code)}</strong> ${escapeHtml(item.category)}</div>`).join('');
    }

    function renderCodedText(text,codes){
      const cleanCodes=(codes || [])
        .map(code=>({
          ...code,
          start_offset:Math.max(0,Math.min(text.length,Number(code.start_offset))),
          end_offset:Math.max(0,Math.min(text.length,Number(code.end_offset))),
        }))
        .filter(code=>Number.isFinite(code.start_offset) && Number.isFinite(code.end_offset) && code.end_offset > code.start_offset)
        .sort((a,b)=>a.start_offset-b.start_offset || a.end_offset-b.end_offset);
      let cursor=0;
      let html='';
      cleanCodes.forEach(code=>{
        if(code.start_offset < cursor) return;
        html+=escapeHtml(text.slice(cursor,code.start_offset));
        const marked=escapeHtml(text.slice(code.start_offset,code.end_offset));
        const title=escapeHtml(code.category);
        html+=`<span class="code-mark" title="${title}">${marked}<sup>${escapeHtml(code.code)}</sup></span>`;
        cursor=code.end_offset;
      });
      html+=escapeHtml(text.slice(cursor));
      return html || escapeHtml(text);
    }

    function renderError(message){
      document.getElementById('reviewRoot').className='empty';
      document.getElementById('reviewRoot').textContent=message;
    }

    function formatDate(value){
      const date=new Date(value);
      if(Number.isNaN(date.getTime())) return value;
      return date.toLocaleString([], { dateStyle:'medium', timeStyle:'short' });
    }

    function escapeHtml(str){const div=document.createElement('div');div.textContent=str;return div.innerHTML;}

    init();
  </script>
</body>
</html>
