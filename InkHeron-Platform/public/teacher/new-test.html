<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New test - InkHeron</title>
  <link rel="icon" href="/assets/InkHeron%20Logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    body{margin:0;font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text);background:var(--bg)}*{box-sizing:border-box}
    .appbar{position:sticky;top:0;z-index:30;display:flex;gap:14px;align-items:center;padding:14px 26px;background:rgba(247,246,242,.92);border-bottom:1px solid var(--border)}.glyph{width:34px;height:34px;border-radius:10px;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700}.nm{font-family:var(--serif);font-size:18px;font-weight:700}.sp{flex:1}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 12px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface);color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}.btn.p{background:var(--green-600);color:#fff;border-color:var(--green-600)}
    .wrap{max-width:1040px;margin:0 auto;padding:28px 24px 80px}h1{font-family:var(--serif);font-size:32px;margin:0 0 16px;color:var(--ink)}
    .grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px;box-shadow:var(--shadow-card)}
    label{display:block;font-size:12px;font-weight:800;color:var(--text-2);margin:10px 0 5px}input,select{width:100%;border:1.5px solid var(--border-2);border-radius:var(--r-sm);padding:9px 10px;font:inherit;background:var(--surface);color:var(--text)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section{margin-bottom:16px}.section h2{font-size:15px;margin:0 0 8px}.choice{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:10px;border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:8px;background:#fff}.choice input{width:16px;margin-top:3px}.meta{color:var(--text-3);font-size:12px}.empty{padding:18px;text-align:center;color:var(--text-3);border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface)}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.wrap{padding:22px 16px 70px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="appbar"><div class="glyph">i</div><div class="nm">InkHeron</div><span class="sp"></span><a class="btn" href="/teacher/question-bank">Question bank</a><a class="btn" href="/teacher/assignments">Assignments</a></div>
  <main class="wrap">
    <h1>New test</h1>
    <div class="grid">
      <section class="panel">
        <label>Title</label><input id="title" type="text">
        <label>Class</label><select id="classId"></select>
        <div class="row"><div><label>Timer minutes</label><input id="timer" type="number" min="1" step="1"></div><div><label>Due at</label><input id="due" type="datetime-local"></div></div>
        <label><input id="shuffle" type="checkbox" checked style="width:auto"> Shuffle MCQ options</label>
        <label><input id="focus" type="checkbox" checked style="width:auto"> Record focus changes</label>
        <button class="btn p" id="createBtn" type="button" style="margin-top:12px;width:100%">Create test</button>
        <p class="meta" id="msg"></p>
      </section>
      <section class="panel">
        <div class="section"><h2>MCQ section</h2><div id="mcqList"></div></div>
        <div class="section"><h2>SRQ section</h2><div id="srqList"></div></div>
        <div class="section"><h2>FRQ section</h2><div id="frqList"></div></div>
      </section>
    </div>
  </main>
  <script>
    let csrfToken='',questions=[];
    async function boot(){
      const me=await fetch('/api/me'); if(!me.ok){location.href='/teacher-login';return;}
      const u=await me.json(); if(u.user.type!=='teacher'){location.href='/';return;} csrfToken=u.user.csrf_token;
      const cls=await fetch('/api/classes').then(r=>r.json()); classId.innerHTML=(cls.classes||[]).map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
      const q=await fetch('/api/tests/questions').then(r=>r.json()); questions=q.questions||[]; renderQuestions(); createBtn.onclick=create;
    }
    function renderQuestions(){
      renderKind('mcq',mcqList,'checkbox'); renderKind('srq',srqList,'checkbox'); renderKind('frq',frqList,'radio');
    }
    function renderKind(kind,el,type){
      const rows=questions.filter(q=>q.kind===kind);
      el.innerHTML=rows.length?rows.map(q=>`<label class="choice"><input type="${type}" name="${kind}" value="${q.id}"><span>${escapeHtml(q.prompt_text)}<br><span class="meta">${q.points} point${q.points===1?'':'s'}${q.tag?' · '+escapeHtml(q.tag):''}</span></span></label>`).join(''):'<div class="empty">No questions yet.</div>';
    }
    async function create(){
      const sections=['mcq','srq','frq'].map(kind=>({kind,title:kind.toUpperCase(),question_ids:[...document.querySelectorAll(`input[name="${kind}"]:checked`)].map(x=>Number(x.value))})).filter(s=>s.question_ids.length);
      const payload={title:title.value,class_id:Number(classId.value),timer_minutes:timer.value?Number(timer.value):null,due_at:due.value?new Date(due.value).toISOString():null,shuffle:shuffle.checked,focus_warning:focus.checked,sections};
      const r=await fetch('/api/tests/assignments',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify(payload)});
      if(r.ok){const d=await r.json();location.href=`/teacher/test-review?assignment_id=${d.assignment.id}`;return;}
      const d=await r.json().catch(()=>({}));msg.textContent=d.error||'Could not create this test.';
    }
    function escapeHtml(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
    boot();
  </script>
</body>
</html>
