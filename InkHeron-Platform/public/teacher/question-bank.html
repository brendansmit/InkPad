<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question bank - InkHeron</title>
  <link rel="icon" href="/assets/InkHeron%20Logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    body{margin:0;font-family:var(--font);font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);}
    *{box-sizing:border-box;}
    .appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:14px 26px;background:rgba(247,246,242,.92);border-bottom:1px solid var(--border);}
    .glyph{width:34px;height:34px;border-radius:10px;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;}
    .nm{font-family:var(--serif);font-size:18px;font-weight:700}.sp{flex:1}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 12px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface);color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}
    .btn.p{background:var(--green-600);color:#fff;border-color:var(--green-600)}.btn:disabled{opacity:.55;cursor:default}
    .wrap{max-width:1240px;margin:0 auto;padding:28px 24px 80px}
    h1{font-family:var(--serif);font-size:32px;margin:0 0 16px;color:var(--ink)}h2{font-size:18px;margin:0 0 8px}
    .layout{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}.stack{display:grid;gap:14px}
    .panel,.qrow{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card)}
    .panel{padding:18px}.qrow{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 16px;margin-bottom:10px}
    label{display:block;font-size:12px;font-weight:800;color:var(--text-2);margin:10px 0 5px}
    input,select,textarea{width:100%;border:1.5px solid var(--border-2);border-radius:var(--r-sm);padding:9px 10px;font:inherit;background:var(--surface);color:var(--text)}
    textarea{min-height:84px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .filters{display:grid;grid-template-columns:120px 160px 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:12px}
    .bulkbar{display:none;align-items:end;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--green-50)}
    .bulkbar.on{display:flex}.bulkbar label{margin:0 0 4px}.bulkbar select{min-width:180px}
    .kind{display:inline-flex;border-radius:999px;padding:2px 8px;background:var(--blue-50);color:var(--blue-700);font-size:12px;font-weight:800;text-transform:uppercase}
    .chip{display:inline-flex;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--text-2);font-size:12px;font-weight:800;margin-right:4px}
    .meta{color:var(--text-3);font-size:12px}.empty{padding:22px;text-align:center;color:var(--text-3);border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface)}
    .prompt{font-weight:800;margin:0 0 6px}.option{display:inline-flex;gap:5px;align-items:center;margin:3px 8px 0 0;color:var(--text-2);font-size:12.5px}.option.correct{color:var(--green-700);font-weight:800}
    .switch{position:relative;display:inline-flex;width:42px;height:24px;margin-top:2px}.switch input{position:absolute;opacity:0;inset:0}.slider{position:absolute;inset:0;border-radius:999px;background:var(--surface-3);border:1.5px solid var(--border-2);transition:.15s}.slider::after{content:'';position:absolute;width:16px;height:16px;left:3px;top:2.5px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.15s}.switch input:checked+.slider{background:var(--green-600);border-color:var(--green-600)}.switch input:checked+.slider::after{left:20px}
    .import-note{font-size:12px;color:var(--text-3);margin:6px 0 0}.status{font-size:13px;color:var(--text-2);margin:8px 0 0}.status.err{color:var(--maroon-500)}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.wrap{padding:22px 16px 70px}.bulkbar{align-items:stretch;flex-direction:column}.bulkbar select,.bulkbar .btn{width:100%}}
  </style>
  <meta name="theme-color" content="#246343">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InkHeron">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
  <div class="appbar"><div class="glyph">i</div><div class="nm">InkHeron</div><span class="sp"></span><a class="btn" href="/teacher">Dashboard</a><a class="btn p" href="/teacher/new-test">New test</a></div>
  <main class="wrap">
    <h1>Question bank</h1>
    <div class="layout">
      <div class="stack">
        <section class="panel">
          <h2>Import MCQs</h2>
          <label>Teacher description</label>
          <textarea id="importDescription" placeholder="Optional topic, unit or source notes"></textarea>
          <label>Paste questions</label>
          <textarea id="importRaw" placeholder="Paste loose MCQs here"></textarea>
          <label>CSV or docx file</label>
          <input id="importFile" type="file" accept=".csv,.docx,text/csv,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
          <p class="import-note">CSV header: prompt, optionA, optionB, optionC, optionD, answer, points, topic, tags.</p>
          <div class="row">
            <div><label>Kind</label><select id="importKind"><option value="mcq">MCQ</option></select></div>
            <div><label>Target quiz</label><select id="importQuiz"><option value="">Bank only</option></select></div>
          </div>
          <label>Target section</label><select id="importSection"><option value="">Auto MCQ section</option></select>
          <div class="actions"><button class="btn p" id="importBtn" type="button">Import</button></div>
          <p class="status" id="importMsg"></p>
        </section>

        <section class="panel">
          <h2 id="formTitle">New question</h2>
          <label>Kind</label>
          <select id="kind"><option value="mcq">MCQ</option><option value="srq">SRQ</option><option value="frq">FRQ</option></select>
          <label>Prompt</label>
          <textarea id="prompt"></textarea>
          <div id="mcqFields">
            <label>Options, one per line</label>
            <textarea id="options"></textarea>
            <label>Correct option number</label>
            <input id="answer" type="number" min="1" step="1">
          </div>
          <div id="srqFields" style="display:none">
            <label>Teacher guidance</label>
            <textarea id="model"></textarea>
          </div>
          <div class="row">
            <div><label>Points</label><input id="points" type="number" min="0" step="0.5" value="1"></div>
            <div><label>Topic</label><input id="topic" type="text"></div>
          </div>
          <label>Tags</label><input id="tags" type="text" placeholder="Comma separated">
          <div class="actions"><button class="btn p" id="saveBtn" type="button">Save</button><button class="btn" id="resetBtn" type="button">Clear</button></div>
          <p class="status" id="msg"></p>
        </section>
      </div>

      <section>
        <div class="filters">
          <div><label>Kind</label><select id="filterKind"><option value="">All</option><option value="mcq">MCQ</option><option value="srq">SRQ</option><option value="frq">FRQ</option></select></div>
          <div><label>Topic</label><select id="filterTopic"><option value="">All topics</option></select></div>
          <div><label>Quiz</label><select id="filterQuiz"><option value="">All bank questions</option></select></div>
          <div><label>Search</label><input id="filterQ" type="search" placeholder="Prompt text"></div>
          <button class="btn" id="refreshBtn" type="button">Refresh</button>
        </div>
        <div class="bulkbar" id="bulkbar">
          <strong id="selectionCount">0 selected</strong>
          <button class="btn" id="selectAllBtn" type="button">Select all</button>
          <button class="btn" id="selectNoneBtn" type="button">None</button>
          <div><label>Quiz</label><select id="bulkQuiz"></select></div>
          <div><label>Section</label><select id="bulkSection"></select></div>
          <button class="btn p" id="addSelectedBtn" type="button">Add selected to quiz</button>
          <button class="btn" id="archiveSelectedBtn" type="button">Archive selected</button>
        </div>
        <div id="list"></div>
      </section>
    </div>
  </main>
  <script>
    let csrfToken='',editing=null,questions=[],quizzes=[],selected=new Set(),lastIndex=null;

    async function boot(){
      const me=await fetch('/api/me'); if(!me.ok){location.href='/teacher-login';return;}
      const u=await me.json(); if(u.user.type!=='teacher'){location.href='/';return;} csrfToken=u.user.csrf_token;
      bind();
      await loadQuizzes();
      await loadTopics();
      await load();
    }

    function bind(){
      kind.onchange=syncKind; saveBtn.onclick=save; resetBtn.onclick=resetForm; refreshBtn.onclick=load; importBtn.onclick=importQuestions;
      filterKind.onchange=load; filterTopic.onchange=load; filterQuiz.onchange=load; filterQ.addEventListener('input',debouncedLoad);
      selectAllBtn.onclick=selectVisible; selectNoneBtn.onclick=clearSelection; addSelectedBtn.onclick=addSelected; archiveSelectedBtn.onclick=archiveSelected;
      bulkQuiz.onchange=()=>populateSectionSelect(bulkQuiz,bulkSection,true); importQuiz.onchange=()=>populateSectionSelect(importQuiz,importSection,false);
    }

    const debouncedLoad=(()=>{let t;return()=>{clearTimeout(t);t=setTimeout(load,250);};})();

    async function loadQuizzes(){
      const r=await fetch('/api/assignments'); const d=await r.json();
      quizzes=(d.assignments||[]).filter(a=>a.type==='test'&&!a.is_archived).map(a=>({...a,settings:parseJson(a.settings_json,{})}));
      const opts='<option value="">All bank questions</option>'+quizzes.map(q=>`<option value="${q.id}">${escapeHtml(q.title)}</option>`).join('');
      filterQuiz.innerHTML=opts;
      importQuiz.innerHTML='<option value="">Bank only</option>'+quizzes.map(q=>`<option value="${q.id}">${escapeHtml(q.title)}</option>`).join('');
      bulkQuiz.innerHTML=quizzes.map(q=>`<option value="${q.id}">${escapeHtml(q.title)}</option>`).join('');
      populateSectionSelect(importQuiz,importSection,false);
      populateSectionSelect(bulkQuiz,bulkSection,true);
    }

    async function loadTopics(){
      const r=await fetch('/api/tests/topics'); const d=await r.json();
      filterTopic.innerHTML='<option value="">All topics</option>'+(d.topics||[]).map(t=>`<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join('');
    }

    async function load(){
      const qs=new URLSearchParams();
      if(filterKind.value)qs.set('kind',filterKind.value);
      if(filterTopic.value)qs.set('topic',filterTopic.value);
      if(filterQuiz.value)qs.set('in_assignment',filterQuiz.value);
      if(filterQ.value.trim())qs.set('q',filterQ.value.trim());
      const r=await fetch('/api/tests/questions?'+qs);
      const d=await r.json();
      questions=d.questions||[];
      selected=new Set([...selected].filter(id=>questions.some(q=>q.id===id)));
      render();
    }

    function render(){
      updateBulkbar();
      if(!questions.length){list.innerHTML='<div class="empty">No questions match these filters.</div>';return;}
      list.innerHTML=questions.map((q,i)=>`
        <article class="qrow">
          <label class="switch" title="Select question"><input type="checkbox" data-pick="${q.id}" data-index="${i}" ${selected.has(q.id)?'checked':''}><span class="slider"></span></label>
          <div>
            <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap">
              <p class="prompt"><span class="kind">${q.kind}</span> ${escapeHtml(q.prompt_text)}</p>
              <div class="actions" style="margin:0"><button class="btn" data-edit="${q.id}" type="button">Edit</button><button class="btn" data-archive="${q.id}" type="button">${q.is_archived?'Unarchive':'Archive'}</button></div>
            </div>
            <div class="meta">${q.points} point${q.points===1?'':'s'}${q.topic?' · '+escapeHtml(q.topic):''} ${(q.tags||[]).map(tag=>`<span class="chip">${escapeHtml(tag)}</span>`).join('')}</div>
            ${renderOptions(q)}
          </div>
        </article>`).join('');
      list.querySelectorAll('[data-pick]').forEach(input=>input.onchange=(event)=>togglePick(event,input));
      list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(Number(b.dataset.edit)));
      list.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>archiveQuestion(Number(b.dataset.archive)));
    }

    function renderOptions(q){
      if(q.kind!=='mcq')return '';
      return `<div>${(q.options||[]).map((opt,i)=>`<span class="option ${i===q.answer_index?'correct':''}">${i===q.answer_index?'✓':''}${i+1}. ${escapeHtml(opt)}</span>`).join('')}</div>`;
    }

    function togglePick(event,input){
      const id=Number(input.dataset.pick), index=Number(input.dataset.index);
      if(event.shiftKey&&lastIndex!==null){
        const [a,b]=[lastIndex,index].sort((x,y)=>x-y);
        for(let i=a;i<=b;i++) selected.add(questions[i].id);
      }else{
        if(input.checked) selected.add(id); else selected.delete(id);
        lastIndex=index;
      }
      render();
    }

    function selectVisible(){questions.forEach(q=>selected.add(q.id));render();}
    function clearSelection(){selected.clear();lastIndex=null;render();}
    function updateBulkbar(){
      const n=selected.size;
      selectionCount.textContent=`${n} selected`;
      bulkbar.classList.toggle('on',n>0);
    }

    function syncKind(){
      mcqFields.style.display=kind.value==='mcq'?'':'none';
      srqFields.style.display=kind.value==='srq'?'':'none';
    }

    function edit(id){
      const q=questions.find(x=>x.id===id); if(!q)return;
      editing=q; formTitle.textContent='Edit question'; kind.value=q.kind; prompt.value=q.prompt_text;
      options.value=(q.options||[]).join('\n'); answer.value=q.answer_index===null?'':Number(q.answer_index)+1;
      model.value=q.model_answer||''; points.value=q.points; topic.value=q.topic||''; tags.value=(q.tags||[]).join(', '); syncKind();
    }

    function resetForm(){
      editing=null;formTitle.textContent='New question';kind.value='mcq';prompt.value='';options.value='';answer.value='';model.value='';points.value='1';topic.value='';tags.value='';msg.textContent='';msg.classList.remove('err');syncKind();
    }

    async function save(){
      const payload={kind:kind.value,prompt_text:prompt.value,points:Number(points.value),topic:topic.value,tags:splitTags(tags.value)};
      if(kind.value==='mcq'){payload.options=options.value.split('\n').map(x=>x.trim()).filter(Boolean);payload.answer_index=Number(answer.value)-1;}
      if(kind.value==='srq') payload.model_answer=model.value;
      const r=await fetch(editing?`/api/tests/questions/${editing.id}`:'/api/tests/questions',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify(payload)});
      msg.textContent=r.ok?'Saved.':'Could not save.'; msg.classList.toggle('err',!r.ok);
      if(r.ok){resetForm();await loadTopics();await load();}
    }

    async function archiveQuestion(id){
      await fetch(`/api/tests/questions/${id}/archive`,{method:'POST',headers:{'X-CSRF-Token':csrfToken}});
      selected.delete(id); await loadTopics(); await load();
    }

    async function archiveSelected(){
      const ids=[...selected]; if(!ids.length)return;
      await Promise.all(ids.map(id=>fetch(`/api/tests/questions/${id}/archive`,{method:'POST',headers:{'X-CSRF-Token':csrfToken}})));
      clearSelection(); await loadTopics(); await load();
    }

    async function addSelected(){
      const ids=[...selected]; if(!ids.length||!bulkQuiz.value)return;
      const payload={question_ids:ids,section_index:bulkSection.value===''?null:Number(bulkSection.value)};
      const r=await fetch(`/api/tests/assignments/${bulkQuiz.value}/append-questions`,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify(payload)});
      importMsg.textContent=r.ok?'Selected questions added.':'Could not add selected questions.';
      importMsg.classList.toggle('err',!r.ok);
      if(r.ok){clearSelection();await loadQuizzes();await load();}
    }

    async function importQuestions(){
      importBtn.disabled=true; importMsg.textContent='Importing...'; importMsg.classList.remove('err');
      const fields={description:importDescription.value,kind:importKind.value,assignment_id:importQuiz.value,section_index:importSection.value};
      let body,headers={'X-CSRF-Token':csrfToken};
      if(importFile.files[0]){
        body=new FormData();
        Object.entries(fields).forEach(([k,v])=>{if(v!==''&&v!==null)body.append(k,v);});
        body.append('file',importFile.files[0]);
      }else{
        headers['Content-Type']='application/json';
        body=JSON.stringify({...fields,raw_text:importRaw.value});
      }
      const r=await fetch('/api/tests/questions/bulk-import',{method:'POST',headers,body});
      const d=await r.json().catch(()=>({}));
      importBtn.disabled=false;
      if(!r.ok){importMsg.textContent=d.error||'Import failed.';importMsg.classList.add('err');return;}
      const needs=(d.needs_answer||[]).length;
      importMsg.textContent=`Imported ${d.created.length}. Added ${d.added_to_quiz||0} to quiz.${needs?` ${needs} need an answer set.`:''}`;
      importRaw.value=''; importFile.value='';
      await loadQuizzes(); await loadTopics(); await load();
    }

    function populateSectionSelect(quizSelect,sectionSelect,requireQuiz){
      const quiz=quizzes.find(q=>q.id===Number(quizSelect.value));
      if(!quiz){sectionSelect.innerHTML=requireQuiz?'<option value="">Choose a quiz</option>':'<option value="">Auto MCQ section</option>';return;}
      const sections=(((quiz.settings||{}).test||{}).sections)||[];
      sectionSelect.innerHTML='<option value="">Auto matching section</option>'+sections.map((s,i)=>`<option value="${i}">${escapeHtml(s.title||s.kind.toUpperCase())} (${escapeHtml(s.kind)})</option>`).join('');
    }

    function splitTags(value){return String(value||'').split(',').map(x=>x.trim()).filter(Boolean);}
    function parseJson(value,fallback){try{return JSON.parse(value||'');}catch(_){return fallback;}}
    function escapeHtml(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
    function escapeAttr(s){return escapeHtml(s).replace(/"/g,'&quot;');}
    boot();
  </script>
</body>
</html>
