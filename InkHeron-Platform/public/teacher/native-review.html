<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkHeron - Review</title>
<link rel="icon" href="/assets/InkHeron%20Logo.png">
<link rel="stylesheet" href="/assets/styles.css">
<style>
/* Direction D: calm desk. Component styles layered on the shared tokens. */
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);overflow-x:hidden}
.appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;padding:10px 22px;background:rgba(247,246,242,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.glyph{width:30px;height:30px;border-radius:9px;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;transform:rotate(-4deg)}
.who{font-family:var(--serif);font-size:16px;font-weight:600}
.crumb{color:var(--text-3);font-size:13px}
.spacer{flex:1}
.nextprev{display:flex;gap:4px;align-items:center;color:var(--text-3);font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border-radius:var(--r-sm);font-weight:800;font-size:13px;cursor:pointer;border:1.5px solid var(--border-2);background:var(--surface);color:var(--text);text-decoration:none}
.btn.primary{background:var(--green-600);color:#fff;border-color:var(--green-600)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1400px;margin:0 auto;padding:16px 22px 60px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.paper{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:38px 44px;min-height:78vh}
.paper h2{font-family:var(--serif);font-size:21px;margin:0 0 2px}
.paper .meta{color:var(--text-3);font-size:12px;font-family:var(--mono);margin-bottom:18px}
.essay{font-family:var(--serif);font-size:17.5px;line-height:1.95;color:var(--ink);white-space:pre-wrap}
.mk{padding:0 1px;border-bottom:2px solid;cursor:help;position:relative;text-decoration:none}
.mk.surface{border-color:var(--amber-700)}
.mk.grammar{border-color:var(--maroon-500)}
.mk.format{border-color:var(--blue-700)}
/* Needs-you marks use a neon highlighter wash no literacy code comes close
   to, so they jump out of the code colour noise. */
.mk.contested{border-bottom:2.5px dotted var(--ink);background:#ccff00;border-radius:2px}
.mk.comment{border-color:var(--green-500);background:var(--green-50)}
.mk.flash{background:var(--amber-50);outline:2px solid var(--amber-700);border-radius:3px}
.tip{position:absolute;bottom:125%;left:0;background:var(--ink);color:#fff;font-family:var(--font);font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:5;pointer-events:none;display:none}
.mk[data-kind="lit"]{cursor:pointer}
/* Layered marks: an outer clause-level mark keeps a plain underline, an inner
   word-level mark (2+ marks covering the same text) drops its underline lower
   and wins a faint background wash so both stay visible. */
.mk.stack-outer{padding-bottom:3px}
.mk.wash.surface{background:var(--amber-50)}
.mk.wash.grammar{background:var(--maroon-50,rgba(150,40,40,.08))}
.mk.wash.format{background:var(--blue-50,rgba(40,80,150,.08))}
/* Rewrite comparison: draft 1 against the green-pen version. Deletions keep
   the maroon of an error mark, insertions the green of the pen itself. */
.viewtabs{display:inline-flex;border:1px solid var(--border-2);border-radius:9px;overflow:hidden;margin-bottom:12px}
.viewtabs button{border:0;background:var(--surface);color:var(--text-2);font:inherit;font-weight:700;font-size:12.5px;padding:6px 13px;cursor:pointer}
.viewtabs button + button{border-left:1px solid var(--border-2)}
.viewtabs button.on{background:var(--green-600);color:#fff}
.diffsum{font-family:var(--mono);font-size:12px;color:var(--text-3);margin:0 0 14px}
.dins{background:var(--green-50);box-shadow:inset 0 -2px 0 var(--green-500);border-radius:2px}
.ddel{color:var(--maroon-500);text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.7}
.code-pop{position:absolute;z-index:90;display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border-2);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow-lift)}
.code-pop-quote{font-family:var(--serif);font-size:12.5px;color:var(--text-2);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-pop select{border:1.5px solid var(--border-2);border-radius:8px;padding:5px 7px;font:inherit;font-size:12.5px;background:var(--surface)}
.code-choose{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-picker{width:min(720px,calc(100vw - 24px));max-height:min(760px,calc(100vh - 24px));padding:0;border:1px solid var(--border-2);border-radius:14px;background:var(--surface);color:var(--text);box-shadow:var(--shadow-lift)}
.code-picker::backdrop{background:rgba(24,28,25,.42);backdrop-filter:blur(2px)}
.code-picker-box{display:grid;grid-template-rows:auto auto minmax(160px,1fr) auto;max-height:min(760px,calc(100vh - 24px))}
.code-picker-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.code-picker-head strong{flex:1;font-family:var(--serif);font-size:18px}
.code-search{margin:12px 16px 6px;width:calc(100% - 32px);border:1.5px solid var(--border-2);border-radius:9px;padding:9px 11px;font:inherit;background:var(--surface);color:var(--text)}
.code-options{overflow:auto;padding:6px 16px 14px;display:grid;gap:12px}
.code-family{display:grid;gap:5px}
.code-family h3{margin:0;color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.code-choice{display:grid;grid-template-columns:minmax(130px,.55fr) minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:8px 10px;text-align:left;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer}
.code-choice:hover,.code-choice.current{border-color:var(--green-600);background:var(--green-50)}
.code-choice code{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--maroon-500);overflow-wrap:anywhere}
.code-choice span{font-size:12.5px}
.code-choice small{font-size:10px;color:var(--text-3)}
.code-picker-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end}
.code-alternatives{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 7px}
.mk:hover .tip{display:block}
.rail{position:sticky;top:64px;display:grid;gap:10px;max-height:calc(100vh - 80px);overflow:auto;padding-bottom:4px;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card)}
.card>header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 13px;border-bottom:1px solid var(--border)}
.card>header strong{font-size:13px}
.count{font-size:11px;font-weight:800;background:var(--surface-2);border-radius:999px;padding:2px 8px;color:var(--text-2)}
.count.warn{background:var(--coral-50);color:var(--coral-500)}
.body{padding:11px 13px;display:grid;gap:8px}
.grp{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:12.5px;cursor:pointer}
.grp .cc{font-family:var(--mono);font-size:11px;font-weight:800;min-width:52px}
.grp .cc.surface{color:var(--amber-700)}
.grp .cc.grammar{color:var(--maroon-500)}
.grp .cc.format{color:var(--blue-700)}
.grp .lbl{flex:1;color:var(--text-2)}
.grp .n{font-weight:800}
.grp .x{color:var(--text-3);font-size:11px}
.grpmarks{display:grid;gap:5px;padding:2px 2px 6px 10px}
.grpmark{display:flex;align-items:center;gap:8px;font-size:12px}
.grpmark .q{flex:1;font-family:var(--serif);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.autonote{font-size:11px;color:var(--text-3);padding:2px 13px 11px}
.cst{border:1px dashed var(--coral-500);border-radius:var(--r-sm);padding:9px 10px;background:var(--coral-50)}
.cst .q{font-family:var(--serif);font-size:13.5px;white-space:normal;line-height:1.5}
.cst .q mark.ctx-hit{background:var(--amber-50);color:var(--maroon-500);font-weight:800;border-radius:3px;padding:0 1px}
.cst .why{font-size:11px;color:var(--text-2);margin:3px 0 7px}
.cst .acts{display:flex;gap:6px;flex-wrap:wrap}
.sug{border:1px dashed var(--border-2);border-radius:var(--r-sm);padding:9px 10px;background:var(--bg)}
.sug strong{font-size:12.5px;display:block}
.sug p{margin:3px 0 7px;color:var(--text-2);font-size:12px}
.sug .acts{display:flex;gap:6px;flex-wrap:wrap}
.fb{border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px;background:var(--surface)}
.fb.s{border-left:4px solid var(--green-500)}
.fb.t{border-left:4px solid var(--blue-700)}
.fb .hd{display:flex;align-items:center;gap:6px}
.fb strong{font-size:12.5px;display:block;flex:1}
.fb p{margin:3px 0 0;color:var(--text-2);font-size:12px}
.fb .del{color:var(--text-3);cursor:pointer;font-size:12px;border:none;background:none}
.addrow{display:grid;gap:6px;margin-top:4px}
.addrow textarea,.addrow input,.addrow select{width:100%;border:1.5px solid var(--border-2);border-radius:8px;padding:7px 9px;font:inherit;font-size:12.5px;background:var(--surface);color:var(--text)}
.addrow textarea{min-height:48px;resize:vertical}
.rtabs{display:flex;gap:4px;padding:9px 13px 0}
.rtab{border:none;background:var(--surface-2);font:inherit;font-size:11.5px;font-weight:800;color:var(--text-3);padding:5px 10px;border-radius:8px;cursor:pointer}
.rtab.on{background:var(--ink);color:#fff}
.crit{padding:7px 0;border-bottom:1px solid var(--border)}
.crit:last-child{border:none}
.crit .nm{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.crit .nm b{font-variant-numeric:tabular-nums}
.scale{display:flex;gap:2px}
.pt{flex:1;min-height:26px;border:1px solid var(--border-2);background:var(--bg);border-radius:6px;font-size:10.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.pt.half{flex:.55;background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 3px,var(--surface-3) 3px,var(--surface-3) 5px)}
.pt.sel{background:var(--green-600);border-color:var(--green-600);color:#fff}
.desc{font-size:11px;color:var(--text-3);margin-top:4px}
.desc a{color:var(--blue-700);font-weight:700;text-decoration:none;cursor:pointer}
.selbar{position:fixed;z-index:85;background:var(--surface);border:1px solid var(--border-2);border-radius:10px;padding:5px 6px;display:none;gap:5px;align-items:center;box-shadow:var(--shadow-lift)}
.selbar.open{display:flex}
.selbar select{border:1.5px solid var(--border-2);border-radius:8px;padding:4px 6px;font:inherit;font-size:12px;background:var(--surface)}
.popover{position:fixed;z-index:80;background:var(--ink);border-radius:10px;padding:8px;display:none;gap:6px;box-shadow:var(--shadow-lift)}
.popover.open{display:flex}
.popover textarea{width:220px;min-height:48px;border:none;border-radius:6px;padding:6px 8px;font:inherit;font-size:12.5px;resize:vertical}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.loading{padding:60px;text-align:center;color:var(--text-3)}
@media (max-width:1100px){
  .wrap{grid-template-columns:1fr;max-width:900px;padding:14px 16px 44px}
  .paper{min-height:0;padding:30px 34px}
  .rail{position:static;max-height:none;overflow:visible;grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{min-width:0}
}
@media (max-width:760px){
  body{font-size:15px}
  .appbar{padding:9px 10px;gap:8px}
  .glyph{width:26px;height:26px;border-radius:8px;flex:0 0 auto}
  .who{font-size:15px;min-width:0;max-width:calc(100vw - 150px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crumb{order:20;width:100%;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spacer{display:none}
  .nextprev{order:21;font-size:12px}
  .appbar .btn{min-height:40px;padding:0 10px;font-size:12.5px;flex:1 1 auto}
  .appbar .btn.sm{flex:0 0 auto}
  .wrap{padding:10px 10px 32px;gap:10px}
  .paper{border-radius:12px;padding:20px 16px}
  .paper h2{font-size:20px}
  .paper .meta{font-size:11.5px;line-height:1.45}
  .essay{font-size:18px;line-height:1.75;overflow-wrap:anywhere}
  .rail{grid-template-columns:1fr}
  .card{border-radius:12px}
  .body{padding:12px;gap:10px}
  .btn{min-height:44px;padding:0 12px}
  .btn.sm{min-height:44px;padding:0 10px;font-size:12.5px}
  .grp,.cst,.sug,.fb{padding:10px}
  .grpmark{align-items:flex-start;flex-wrap:wrap}
  .grpmark .q{flex-basis:100%;white-space:normal}
  .addrow textarea,.addrow input,.addrow select,.code-pop select,.popover textarea,.code-search{font-size:16px}
  .addrow textarea{min-height:88px}
  .scale{gap:7px;overflow-x:auto;padding-bottom:6px}
  .pt{flex:0 0 50px;min-height:48px;font-size:15px;border-radius:9px}
  .pt.half{flex:0 0 38px;min-height:48px}
  .selbar{left:8px;right:8px;width:auto;flex-wrap:wrap;justify-content:flex-start}
  .selbar .btn{flex:1 1 auto}
  .popover{left:8px;right:8px;width:auto;flex-wrap:wrap}
  .popover textarea{width:100%;min-height:96px}
  .code-pop{position:fixed;left:8px;right:8px;width:auto;flex-wrap:wrap}
  .code-pop-quote{max-width:100%;flex-basis:100%}
  .code-choice{grid-template-columns:minmax(110px,.7fr) minmax(0,1fr);min-height:44px}
  .code-choice small{display:none}
  .toast{left:10px;right:10px;bottom:12px;transform:none;text-align:center}
}
@media (hover:none) and (pointer:coarse){
  .btn,.btn.sm{min-height:44px}
  .appbar .btn{min-height:44px}
  .code-choice{min-height:48px}
}
@media (max-width:480px){
  .appbar{display:grid;grid-template-columns:120px minmax(0,1fr) auto auto}
  .glyph{display:none}
  #backBtn{grid-column:1;grid-row:1}
  .who{grid-column:2/-1;grid-row:1;max-width:100%}
  .crumb{grid-column:1/4;grid-row:2;order:initial;width:auto}
  .nextprev{grid-column:4;grid-row:2;order:initial;justify-self:end}
  #reanalyzeBtn{grid-column:1/3;grid-row:3}
  #prevBtn{grid-column:3;grid-row:3}
  #nextBtn{grid-column:4;grid-row:3}
  #finishBtn{grid-column:1/-1;grid-row:4}
  #sendFeedbackBtn{grid-column:1/-1;grid-row:5}
  .code-choice{grid-template-columns:1fr;gap:3px;min-height:52px}
  .code-choice code{line-height:1.25}
}
</style>
  <meta name="theme-color" content="#246343">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InkHeron">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<div class="appbar">
  <div class="glyph">i</div>
  <a class="btn sm" id="backBtn" href="/teacher/assignments">← Assignments</a>
  <span class="who" id="studentName">…</span>
  <span class="crumb" id="crumb"></span>
  <span class="spacer"></span>
  <span class="nextprev" id="markedCount"></span>
  <button class="btn" id="reanalyzeBtn" title="Re-run the AI marking on this essay">Run AI review</button>
  <button class="btn" id="prevBtn">← Prev</button>
  <button class="btn" id="nextBtn">Next →</button>
  <button class="btn" id="sendFeedbackBtn" style="display:none">Send feedback</button>
  <button class="btn primary" id="finishBtn">Finish marking</button>
</div>

<div class="wrap" id="wrap">
  <div class="paper">
    <h2 id="essayTitle">…</h2>
    <div class="meta" id="essayMeta"></div>
    <div id="viewTabs"></div>
    <div class="diffsum" id="diffSummary"></div>
    <div class="essay" id="essay"><div class="loading">Loading essay…</div></div>
  </div>
  <div class="rail" id="rail"></div>
</div>

<div class="popover" id="commentPop">
  <textarea id="commentText" placeholder="Comment on the selected text…"></textarea>
  <button class="btn sm primary" id="commentSave">Save</button>
</div>
<div class="selbar" id="selBar">
  <button class="btn sm" id="selComment">Comment</button>
  <button class="btn sm" id="selMark">Mark error ▾</button>
</div>
<dialog class="code-picker" id="codePicker">
  <div class="code-picker-box">
    <div class="code-picker-head"><strong id="codePickerTitle">Choose literacy code</strong><button class="btn sm" id="codePickerClose" type="button">Close</button></div>
    <input class="code-search" id="codeSearch" type="search" placeholder="Search code, label or grammar family" autocomplete="off">
    <div class="code-options" id="codeOptions"></div>
    <div class="code-picker-foot"><button class="btn sm" id="codePickerCancel" type="button">Cancel</button></div>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const CAT = { surface: 'surface', grammar: 'grammar', format: 'format' };
const CAT_LABEL = { surface: 'Spelling and words', grammar: 'Grammar', format: 'Punctuation and format' };
let csrf = '';
let review = null;
let fbSuggestions = [];
let contested = [];
let queue = [];
let padId = null;
let activeRubric = 'internal';
const pendingAttention = new Set();
const QUEUE_CACHE_MS = 5 * 60 * 1000;
const CODEBOOK_CACHE_KEY = 'literacy-codebook-2026-07-26';

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
async function api(path, opts={}){
  const o = Object.assign({ headers: {} }, opts);
  if (opts.method && opts.method !== 'GET'){ o.headers['X-CSRF-Token'] = csrf; if (opts.body && typeof opts.body !== 'string'){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(opts.body);} }
  const r = await fetch(path, o);
  if (!r.ok && r.status !== 204) throw new Error(path + ' ' + r.status);
  if (r.status === 204) return null;
  return r.json();
}
function isDone(status){ return status === 'marked' || status === 'resubmitted'; }
function queueCacheKey(){ return review && review.assignment ? 'review-queue-'+review.assignment.id : ''; }
function cacheQueue(){
  const key = queueCacheKey();
  if (!key) return;
  try { sessionStorage.setItem(key, JSON.stringify({ savedAt:Date.now(), students:queue })); } catch(_){}
}

async function boot(){
  padId = new URLSearchParams(location.search).get('pad_id');
  if (!padId){ document.getElementById('essay').innerHTML='<div class="loading">No pad selected.</div>'; return; }
  const me = await fetch('/api/me').then(r=>r.ok?r.json():null).catch(()=>null);
  if (!me || !me.user || me.user.type !== 'teacher'){ location.href='/teacher-login.html'; return; }
  csrf = me.user.csrf_token;
  await loadAll();
}

async function loadAll(){
  const [nextReview, suggestionResult] = await Promise.all([
    api('/api/native/pads/'+padId+'/review?compact=1'),
    api('/api/native/pads/'+padId+'/feedback-suggestions?status=pending'),
    loadCodeDefinitions()
  ]);
  review = nextReview;
  fbSuggestions = suggestionResult.suggestions || [];
  contested = (review.suggestions || []).filter(s => s.status === 'pending');
  const cacheKey = queueCacheKey();
  let cached = null;
  try {
    cached = JSON.parse(sessionStorage.getItem(cacheKey));
    if (!cached || Date.now() - cached.savedAt > QUEUE_CACHE_MS || !Array.isArray(cached.students)) cached = null;
  } catch(_){ cached = null; }
  if (cached) queue = cached.students;
  else {
    try {
      queue = (await api('/api/assignments/'+review.assignment.id+'/dashboard?sort=name')).students || [];
      cacheQueue();
    } catch(_){ queue = []; }
  }
  render();
}

function render(){ renderTop(); renderEssay(); renderRail(); }

function renderLocal({ top=false, essay=false, rail=true }={}){
  const railEl = document.getElementById('rail');
  const railTop = railEl ? railEl.scrollTop : 0;
  if (top) renderTop();
  if (essay) renderEssay();
  if (rail){ renderRail(); document.getElementById('rail').scrollTop = railTop; }
}
function upsertAnnotation(annotation){
  const index = review.annotations.findIndex(item => String(item.id) === String(annotation.id));
  if (index === -1) review.annotations.push(annotation);
  else review.annotations[index] = annotation;
}
function removeAnnotation(annotationId){
  review.annotations = review.annotations.filter(item => String(item.id) !== String(annotationId));
}
function resolveLiteracySuggestion(suggestionId){
  contested = contested.filter(item => String(item.id) !== String(suggestionId));
  review.suggestions = (review.suggestions || []).filter(item => String(item.id) !== String(suggestionId));
}
function addFeedbackItem(item){
  const key = item.kind === 'strength' ? 'strengths' : 'targets';
  review.feedback[key].push(item);
}
function removeFeedbackItem(item){
  const key = item.kind === 'strength' ? 'strengths' : 'targets';
  review.feedback[key] = review.feedback[key].filter(existing => String(existing.id) !== String(item.id));
}

function renderTop(){
  const s = review.student, pad = review.pad, a = review.assignment;
  document.getElementById('studentName').textContent = s.display_name;
  const pasteN = review.paste_events.length;
  document.getElementById('crumb').textContent = [a.title, (pad.word_count||0)+' words', 'v'+(pad.version||1), pasteN+' paste event'+(pasteN===1?'':'s')].join(' · ');
  document.getElementById('essayTitle').textContent = a.title;
  const autoN = review.annotations.filter(isAuto).length;
  document.getElementById('essayMeta').textContent = 'AI placed '+autoN+' marks automatically · '+contested.length+' need your decision · hover any mark for its category';
  const withPad = queue.filter(q => q.pad_id);
  const markedN = withPad.filter(q => isDone(q.status)).length;
  document.getElementById('markedCount').textContent = markedN+' of '+withPad.length+' marked';
  const idx = withPad.findIndex(q => String(q.pad_id) === String(padId));
  const nextUnmarked = withPad.slice(idx+1).find(q => !isDone(q.status));
  const prev = idx > 0 ? withPad[idx-1] : null;
  const nextBtn = document.getElementById('nextBtn'), prevBtn = document.getElementById('prevBtn');
  nextBtn.disabled = !nextUnmarked; nextBtn.onclick = ()=>{ if(nextUnmarked) location.href = '/teacher/native-review?pad_id='+nextUnmarked.pad_id; };
  prevBtn.disabled = !prev; prevBtn.onclick = ()=>{ if(prev) location.href = '/teacher/native-review?pad_id='+prev.pad_id; };
  document.getElementById('finishBtn').onclick = finishMarking;
  renderSendFeedback();
  document.getElementById('reanalyzeBtn').onclick = reanalyze;
  const back = document.getElementById('backBtn');
  if (back) back.href = a.id ? '/teacher/assignments?id=' + a.id : '/teacher/assignments';
}

async function reanalyze(){
  const btn = document.getElementById('reanalyzeBtn');
  if (btn.disabled) return;
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Reviewing…';
  try {
    const res = await api('/api/native/pads/'+padId+'/reanalyze', { method:'POST' });
    if (res.status === 'no_key') toast(res.message);
    else if (res.status === 'empty') toast(res.message);
    else if (res.status === 'ok') toast('AI review done: '+res.marks+' marks, '+res.suggestions+' suggestions');
    else toast('AI review finished');
    if (res.status === 'ok') await loadAll();
  } catch(e){ toast('AI review failed'); }
  finally { btn.disabled = false; btn.textContent = label; }
}

function isAuto(ann){ return ann.type === 'literacy_code'; }
function markCategory(ann){ return CAT[ann.metadata && ann.metadata.category] || 'grammar'; }

// On a rewrite pad the teacher can flip the essay body between the rewrite as
// submitted and a word diff against draft 1, which is the only quick way to
// see what the student actually changed.
let essayView = 'rewrite';

function renderViewTabs(){
  const host = document.getElementById('viewTabs');
  if (!host) return;
  host.innerHTML = '';
  if (!review.draft_comparison) return;
  const tabs = el('div','viewtabs');
  [['rewrite','Rewrite'],['compare','Compare to draft 1']].forEach(function(pair){
    const b = el('button');
    b.type = 'button';
    b.textContent = pair[1];
    if (essayView === pair[0]) b.className = 'on';
    b.onclick = function(){ essayView = pair[0]; renderViewTabs(); renderEssay(); };
    tabs.appendChild(b);
  });
  host.appendChild(tabs);
}

// Marking is disabled in compare mode: the diff interleaves deleted text from
// the original, so a selection offset here would not match the rewrite.
function renderDiff(){
  const cmp = review.draft_comparison;
  const st = cmp.stats || {};
  const pct = Math.round((st.changed_ratio || 0) * 100);
  document.getElementById('diffSummary').textContent =
    st.words_added + ' words added · ' + st.words_removed + ' removed · '
    + pct + '% of the draft changed · struck-through text was cut';
  let html = '';
  for (const seg of (cmp.segments || [])){
    if (seg.type === 'insert') html += '<span class="dins">' + esc(seg.text) + '</span>';
    else if (seg.type === 'delete') html += '<span class="ddel">' + esc(seg.text) + '</span>';
    else html += esc(seg.text);
  }
  const elx = document.getElementById('essay');
  elx.innerHTML = html;
  elx.onmouseup = null;
  elx.ontouchend = null;
  elx.onclick = null;
}

function renderEssay(){
  renderViewTabs();
  if (essayView === 'compare' && review.draft_comparison) return renderDiff();
  document.getElementById('diffSummary').textContent = '';
  const text = review.pad.plain_text || '';
  const spans = [];
  for (const ann of review.annotations){
    if (ann.start_offset == null || ann.end_offset == null) continue;
    if (ann.type === 'literacy_code') spans.push({ s:ann.start_offset, e:ann.end_offset, cls:markCategory(ann), tip:CAT_LABEL[ann.metadata.category]||'Grammar', kind:'lit', id:ann.id, sug:ann.metadata.suggestion_id });
    else if (ann.type === 'inline_comment') spans.push({ s:ann.start_offset, e:ann.end_offset, cls:'comment', tip:'Comment', kind:'comment', id:ann.id });
  }
  for (const c of contested) spans.push({ s:c.start_offset, e:c.end_offset, cls:'contested', tip:'Needs your decision', kind:'contested', id:c.id });
  const valid = spans.filter(sp => Number.isInteger(sp.s) && Number.isInteger(sp.e) && sp.e > sp.s);
  // Segment rendering: split the text at every mark boundary so overlapping
  // marks all show. Each segment carries ALL marks covering it; the widest is
  // the outer underline, the narrowest is the inner (word-level) mark, which
  // gets the background wash. A lone mark renders as a plain single underline.
  const bounds = new Set([0, text.length]);
  for (const sp of valid){ bounds.add(sp.s); bounds.add(sp.e); }
  const cuts = [...bounds].filter(b => b >= 0 && b <= text.length).sort((a,b)=>a-b);
  const openTag = (m, cls) =>
    '<span class="mk '+m.cls+cls+'" data-kind="'+m.kind+'" data-id="'+m.id+'"'+(m.sug?(' data-sug="'+m.sug+'"'):'')+'>';
  let html = '';
  for (let i=0; i<cuts.length-1; i++){
    const a = cuts[i], b = cuts[i+1];
    if (b <= a) continue;
    const piece = esc(text.slice(a, b));
    // Widest first = outermost; narrowest last = innermost.
    const covering = valid.filter(m => m.s <= a && m.e >= b).sort((x,y)=> (y.e-y.s) - (x.e-x.s));
    if (!covering.length){ html += piece; continue; }
    const layered = covering.length >= 2;
    let seg = '';
    covering.forEach((m, idx) => {
      const innermost = idx === covering.length-1;
      let cls = '';
      if (layered && !innermost) cls += ' stack-outer';
      if (layered && innermost) cls += ' wash';
      seg += openTag(m, cls);
    });
    seg += piece;
    if (layered){
      const labels = covering.map(m => m.tip).filter(Boolean);
      seg += '<span class="tip">'+esc(labels.join(' · '))+'</span>';
    } else {
      seg += '<span class="tip">'+esc(covering[0].tip)+'</span>';
    }
    seg += covering.map(()=>'</span>').join('');
    html += seg;
  }
  const elx = document.getElementById('essay');
  elx.innerHTML = html;
  elx.onmouseup = onSelectText;
  elx.ontouchend = ()=> setTimeout(onSelectText, 0);
  // Click a placed literacy mark to change its code in place.
  elx.onclick = (e)=>{
    if (String(window.getSelection())) return;
    const mk = e.target.closest('.mk[data-kind="lit"]');
    if (!mk) return;
    const ann = review.annotations.find(a=> String(a.id) === mk.dataset.id);
    if (ann) openCodeChanger(ann, mk);
  };
}

const FALLBACK_CODES = [['Sp','Spelling','Spelling','surface'],['Caps','Capital letter','Capitalisation','surface'],['P','Punctuation','Punctuation','format'],['Exp','Expression','Expression','surface'],['Embed','Quotation embedding','Punctuation','format'],['FOR','Formatting','Formatting','format'],['WW','Wrong word','Word choice','surface'],['Rep','Repetition','Expression','surface'],['✓','Good work','Teacher marks','positive'],['//','New paragraph','Teacher marks','format']]
  .map(([code,label,family,category])=>({code,label,searchLabel:label,family,category,priority:'fallback',source:'fallback'}));
let codeDefinitions = FALLBACK_CODES;

function setCodeDefinitions(codes){
  if (!Array.isArray(codes) || !codes.length) return;
  codeDefinitions = codes;
}
async function loadCodeDefinitions(){
  try {
    const cached = JSON.parse(sessionStorage.getItem(CODEBOOK_CACHE_KEY));
    if (cached && Array.isArray(cached.codes)) setCodeDefinitions(cached.codes);
  } catch(_){}
  try {
    const payload = await api('/api/native/literacy-codes');
    setCodeDefinitions(payload.codes);
    try { sessionStorage.setItem(CODEBOOK_CACHE_KEY, JSON.stringify(payload)); } catch(_){}
  } catch(error){
    if (codeDefinitions === FALLBACK_CODES) console.warn('Literacy codebook unavailable', error);
  }
}
function codeDefinition(code){ return codeDefinitions.find(item=>item.code===code) || {code,label:code,family:'Other',category:'other'}; }
const CODE_CAT = (code)=>codeDefinition(code).category||'other';
const CODE_LABEL = (code)=>codeDefinition(code).label||code;

let codePickerCallback = null;
let codePickerCurrent = '';
function pickerFamily(definition){
  if (definition.source === 'legacy') return 'Legacy codes';
  if (definition.source === 'manual') return 'Teacher marks';
  return definition.family || 'Other';
}
function renderCodePicker(){
  const query = document.getElementById('codeSearch').value.trim().toLowerCase();
  const visible = codeDefinitions.filter(definition=>{
    const haystack = [definition.code,definition.label,definition.searchLabel,definition.family,definition.definition].join(' ').toLowerCase();
    return !query || haystack.includes(query);
  });
  const groups = new Map();
  visible.forEach(definition=>{
    const family = pickerFamily(definition);
    if (!groups.has(family)) groups.set(family, []);
    groups.get(family).push(definition);
  });
  const host = document.getElementById('codeOptions'); host.innerHTML='';
  if (!visible.length){ const empty=el('div','autonote'); empty.textContent='No matching literacy codes.'; host.appendChild(empty); return; }
  [...groups.entries()].sort(([a],[b])=>a.localeCompare(b)).forEach(([family,definitions])=>{
    const section=el('section','code-family'); const heading=document.createElement('h3'); heading.textContent=family; section.appendChild(heading);
    definitions.forEach(definition=>{
      const button=el('button','code-choice'+(definition.code===codePickerCurrent?' current':'')); button.type='button';
      button.innerHTML='<code>'+esc(definition.code)+'</code><span>'+esc(definition.label)+'</span><small>'+esc(definition.priority||'')+'</small>';
      button.title=definition.definition||definition.label;
      button.onclick=()=>{ const callback=codePickerCallback; closeCodePicker(); if(callback) callback(definition.code); };
      section.appendChild(button);
    });
    host.appendChild(section);
  });
}
function openCodePicker({ currentCode='', title='Choose literacy code', onChoose }={}){
  codePickerCallback=onChoose; codePickerCurrent=currentCode;
  document.getElementById('codePickerTitle').textContent=title;
  const search=document.getElementById('codeSearch'); search.value=''; renderCodePicker();
  const dialog=document.getElementById('codePicker'); dialog.showModal(); setTimeout(()=>search.focus(),0);
}
function closeCodePicker(){ const dialog=document.getElementById('codePicker'); if(dialog.open) dialog.close(); codePickerCallback=null; }
document.getElementById('codeSearch').oninput=renderCodePicker;
document.getElementById('codePickerClose').onclick=closeCodePicker;
document.getElementById('codePickerCancel').onclick=closeCodePicker;

function openCodeChanger(ann, anchor){
  document.querySelectorAll('.code-pop').forEach(p=>p.remove());
  const pop = el('div','code-pop');
  let selectedCode = ann.metadata && ann.metadata.code;
  const choose = el('button','btn sm code-choose');
  const refreshChoice=()=>{ choose.textContent=selectedCode+' · '+CODE_LABEL(selectedCode); };
  refreshChoice();
  choose.onclick=()=>openCodePicker({ currentCode:selectedCode, title:'Change literacy code', onChoose:(code)=>{ selectedCode=code; refreshChoice(); } });
  const save = el('button','btn sm'); save.textContent='Save';
  const reject = el('button','btn sm'); reject.textContent='Reject mark'; reject.style.color='var(--maroon-500)';
  reject.onclick = async ()=>{
    if(!confirm('Remove this mark? It also leaves the student\'s error record.')) return;
    reject.disabled = true; reject.textContent = 'Removing…';
    const sug = ann.metadata && ann.metadata.suggestion_id;
    if (sug) await api('/api/native/pads/'+padId+'/suggestions/'+sug+'/disagree', { method:'POST' });
    else await api('/api/native/annotations/'+ann.id, { method:'DELETE' });
    removeAnnotation(ann.id);
    if (sug) resolveLiteracySuggestion(sug);
    pop.remove(); toast('Mark removed'); renderLocal({ top:true, essay:true });
  };
  const cancel = el('button','btn sm'); cancel.textContent='✕';
  save.onclick = async ()=>{
    save.disabled = true; save.textContent = 'Saving…';
    const code = selectedCode;
    const label = CODE_LABEL(code);
    const result = await api('/api/native/annotations/'+ann.id, { method:'PATCH',
      body:{ metadata: Object.assign({}, ann.metadata, { code, category: CODE_CAT(code), label }) } });
    upsertAnnotation(result.annotation);
    pop.remove(); toast('Code changed to '+code); renderLocal({ essay:true });
  };
  cancel.onclick = ()=> pop.remove();
  const quoteEl = el('span','code-pop-quote'); quoteEl.textContent = '"'+(ann.selected_text||'').slice(0,40)+'"';
  pop.append(quoteEl, choose, save, reject, cancel);
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  if (window.matchMedia('(max-width: 760px)').matches){
    pop.style.position = 'fixed';
    placeFloating(pop, r.left, r.bottom + 6);
  } else {
    pop.style.left = Math.min(window.innerWidth - pop.offsetWidth - 12, Math.max(8, r.left + window.scrollX)) + 'px';
    pop.style.top = (r.bottom + window.scrollY + 6) + 'px';
  }
}

// Green-pen verdict card, only on scored rewrite pads: did the student act
// on the feedback or just shuffle words?
function cardImplementation(){
  const s = review.implementation_score;
  if (!s) return null;
  const card = el('div','card');
  const verdict = s.meaningful ? 'Meaningful revision' : 'Mostly cosmetic revision';
  const tone = s.meaningful ? 'var(--green-700)' : 'var(--maroon-500)';
  const head = el('header');
  head.innerHTML = '<strong>Green pen result</strong><span class="count" style="color:'+tone+'">'+verdict+'</span>';
  card.appendChild(head);
  const body = el('div','body');
  const bits = [];
  if (s.codes_total) bits.push('codes fixed <b>'+s.codes_addressed+' / '+s.codes_total+'</b>');
  if (s.targets_total) bits.push('targets acted on <b>'+s.targets_addressed+' / '+s.targets_total+'</b>');
  if (s.inline_comments_total) bits.push('comments addressed <b>'+s.inline_comments_addressed+' / '+s.inline_comments_total+'</b>');
  bits.push('cosmetic share <b>'+Math.round((s.cosmetic_ratio ?? 0)*100)+'%</b>');
  const line = el('div'); line.style.fontSize='12.5px'; line.innerHTML = bits.join(' &middot; ');
  body.appendChild(line);
  if (s.summary){ const p = el('div'); p.style.cssText='font-size:12px;color:var(--text-2);margin-top:6px'; p.textContent = s.summary; body.appendChild(p); }
  // Per target, how well the rewrite met that goal out of 10.
  if (Array.isArray(s.targets) && s.targets.length){
    const list = el('div'); list.style.cssText='margin-top:10px;display:flex;flex-direction:column;gap:6px';
    s.targets.forEach(function(t){
      const row = el('div');
      row.style.cssText='display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.45';
      const rated = t.score !== null && t.score !== undefined;
      const tone = !rated ? 'var(--text-2)' : (t.score >= 7 ? 'var(--green-700)' : (t.score >= 4 ? '#8a6d1f' : 'var(--maroon-500)'));
      const pill = el('span');
      pill.style.cssText='flex:0 0 auto;min-width:38px;text-align:center;font-weight:800;border-radius:999px;padding:1px 7px;font-size:11.5px;color:#fff;background:'+tone;
      pill.textContent = rated ? (t.score + '/10') : '--';
      const txt = el('span');
      txt.textContent = t.title + (t.note ? ' (' + t.note + ')' : '');
      row.appendChild(pill); row.appendChild(txt);
      list.appendChild(row);
    });
    body.appendChild(list);
  }
  if (s.original_pad_id){
    const a = el('a'); a.className='btn sm'; a.style.marginTop='8px'; a.href='/teacher/native-review?pad_id='+s.original_pad_id; a.textContent='Open original';
    body.appendChild(a);
  }
  card.appendChild(body);
  return card;
}

function cardAutoMarked(){
  const auto = review.annotations.filter(isAuto);
  const groups = {};
  for (const ann of auto){ const code = ann.metadata.code || '?'; (groups[code] = groups[code] || { code, cat:markCategory(ann), label:ann.metadata.label||code, items:[] }).items.push(ann); }
  const ordered = Object.values(groups).sort((a,b)=> b.items.length - a.items.length);
  const card = el('div','card');
  const head = el('header'); head.innerHTML = '<strong>Auto-marked</strong><span class="count">'+auto.length+' marks</span><span class="spacer" style="flex:1"></span>';
  const showBtn = el('button','btn sm'); showBtn.textContent='Show in text';
  showBtn.onclick = ()=>{ auto.forEach((a,i)=> setTimeout(()=>flashMark(a.id), i*90)); };
  head.appendChild(showBtn); card.appendChild(head);
  const body = el('div','body');
  for (const g of ordered){
    const row = el('div','grp');
    row.innerHTML = '<span class="cc '+g.cat+'">'+esc(g.code)+'</span><span class="lbl">'+esc(g.label)+'</span><span class="n">'+g.items.length+'</span><span class="x">review</span>';
    const marks = el('div','grpmarks'); marks.style.display='none';
    g.items.forEach((ann)=>{
      const m = el('div','grpmark');
      m.innerHTML = '<span class="q">'+esc(ann.selected_text||'')+'</span>';
      const walk = el('button','btn sm'); walk.textContent='find'; walk.onclick=(ev)=>{ ev.stopPropagation(); flashMark(ann.id); };
      const dis = el('button','btn sm'); dis.textContent='✕ disagree'; dis.onclick=(ev)=>{ ev.stopPropagation(); disagreeMark(ann); };
      m.append(walk, dis); marks.appendChild(m);
    });
    let cyc = 0;
    row.onclick = ()=>{ marks.style.display = marks.style.display==='none'?'grid':'none'; if(g.items.length){ flashMark(g.items[cyc % g.items.length].id); cyc++; } };
    body.append(row, marks);
  }
  card.appendChild(body);
  const note = el('div','autonote'); note.textContent = 'Both models agreed on these with less than 40% uncertainty, so they are already live marks. Click a group to walk its spans in the text; disagree on any one to retract it.';
  card.appendChild(note);
  return card;
}

function cardNeedsYou(){
  const card = el('div','card');
  const head = el('header'); head.innerHTML = '<strong>Needs you</strong><span class="count'+(contested.length?' warn':'')+'">'+contested.length+'</span>';
  card.appendChild(head);
  const body = el('div','body');
  if (!contested.length){ const n=el('div','autonote'); n.style.padding='0'; n.textContent='Nothing contested. Everything is decided.'; body.appendChild(n); }
  else {
    const c = contested[0];
    let checker = {}; try { checker = JSON.parse(c.checker_json||'{}'); } catch(_){}
    const definition = codeDefinition(c.code);
    const uncertainty = typeof checker.confidence === 'number' ? Math.round((1-checker.confidence)*100)+'% uncertainty' : 'confidence unavailable';
    const cst = el('div','cst');
    cst.innerHTML = '<div class="q">'+sentenceHtml(c.start_offset, c.end_offset, c.quote)+' <span class="count">'+esc(c.code)+'</span></div>'+
      '<div class="why">'+esc(definition.label)+' · '+esc(uncertainty)+(checker.note?': '+esc(checker.note):'')+'</div>';
    const alternatives = (checker.alternatives||[]).map(codeDefinition).filter(item=>item&&item.code!==c.code);
    if (alternatives.length){
      const altWrap=el('div','code-alternatives');
      alternatives.forEach(alternative=>{
        const alt=el('button','btn sm'); alt.textContent='Use '+alternative.code; alt.title=alternative.label;
        alt.onclick=()=>resolveContested(c,'change',alternative.code); altWrap.appendChild(alt);
      });
      cst.appendChild(altWrap);
    }
    const acts = el('div','acts');
    const keep = el('button','btn sm'); keep.textContent='✓ Keep '+c.code; keep.onclick=()=>resolveContested(c,'keep');
    const change = el('button','btn sm'); change.textContent='Change code'; change.onclick=()=>openCodePicker({ currentCode:c.code, title:'Choose the correct code', onChoose:(code)=>resolveContested(c,'change',code) });
    const no = el('button','btn sm'); no.textContent='✕ Not an error'; no.onclick=()=>resolveContested(c,'reject');
    acts.append(keep,change,no); cst.appendChild(acts); body.appendChild(cst);
    if (contested.length>1){ const more=el('div','autonote'); more.style.padding='0'; more.textContent='+ '+(contested.length-1)+' more after this one'; body.appendChild(more); }
    body.tabIndex = 0;
    body.onkeydown = (e)=>{ if(e.key==='a'||e.key==='A') resolveContested(c,'keep'); if(e.key==='d'||e.key==='D') resolveContested(c,'reject'); };
  }
  card.appendChild(body);
  return card;
}

// The teacher's own inline comments, listed so they can be found, edited or
// deleted after placement.
function cardComments(){
  const comments = review.annotations.filter(a => a.type === 'inline_comment');
  const card = el('div','card');
  const head = el('header'); head.innerHTML = '<strong>Your comments</strong><span class="count">'+comments.length+'</span>';
  card.appendChild(head);
  const body = el('div','body');
  if (!comments.length){
    const n = el('div','autonote'); n.style.padding='0';
    n.textContent = 'No comments yet. Select any text in the essay to add one.';
    body.appendChild(n);
  }
  for (const ann of comments){
    const div = el('div','cst');
    div.innerHTML = '<div class="q">"'+esc((ann.selected_text||'').slice(0,80))+'"</div>'+
      '<div class="why">'+esc(ann.body||'')+'</div>';
    const acts = el('div','acts');
    const find = el('button','btn sm'); find.textContent='find'; find.onclick=()=>flashMark(ann.id);
    const edit = el('button','btn sm'); edit.textContent='Edit'; edit.onclick=async ()=>{
      const next = prompt('Edit comment', ann.body || '');
      if (next == null) return;
      const trimmed = next.trim();
      if (!trimmed){ toast('Comment cannot be empty'); return; }
      const result = await api('/api/native/annotations/'+ann.id, { method:'PATCH', body:{ body: trimmed } });
      upsertAnnotation(result.annotation);
      toast('Comment updated'); renderLocal({ essay:true });
    };
    const del = el('button','btn sm'); del.textContent='✕ Delete'; del.onclick=async ()=>{
      await api('/api/native/annotations/'+ann.id, { method:'DELETE' });
      removeAnnotation(ann.id);
      toast('Comment deleted'); renderLocal({ essay:true });
    };
    acts.append(find, edit, del); div.appendChild(acts);
    body.appendChild(div);
  }
  card.appendChild(body);
  return card;
}

function cardStrengthsTargets(){
  const card = el('div','card');
  const head = el('header'); head.innerHTML = '<strong>Strengths and targets</strong><span class="count">AI suggests '+fbSuggestions.length+'</span>';
  card.appendChild(head);
  const body = el('div','body');
  // Feedback bank switcher: which uploaded table(s) the AI draws from for this
  // essay. Persists per pad via applied-feedback-table; reloads so the AI
  // suggestions re-run against the chosen bank.
  const tables = review.feedback_tables || [];
  if (tables.length){
    const pick = el('div','addrow'); pick.style.marginBottom='10px';
    const lbl = document.createElement('label'); lbl.textContent='Feedback bank'; lbl.style.cssText='font-size:12px;color:var(--text-2)';
    const sel = document.createElement('select');
    for (const t of tables){ const o=document.createElement('option'); o.value=t.id; o.textContent=t.title; if(t.id===review.applied_feedback_table) o.selected=true; sel.appendChild(o); }
    const allOpt = document.createElement('option'); allOpt.value='all'; allOpt.textContent='All tables'; if(review.applied_feedback_table==='all') allOpt.selected=true; sel.appendChild(allOpt);
    sel.onchange = async ()=>{
      sel.disabled = true;
      const result = await api('/api/native/pads/'+padId+'/applied-feedback-table', { method:'PUT', body:{ table: sel.value } });
      review.applied_feedback_table = result.applied_feedback_table;
      review.feedback_options = result.feedback_options;
      toast('Feedback bank set'); renderLocal();
    };
    pick.append(lbl, sel); body.appendChild(pick);
  }
  for (const sug of fbSuggestions){
    const div = el('div','sug');
    div.innerHTML = '<strong>'+(sug.kind==='target'?'Target':'Strength')+' · '+esc(sug.title)+'</strong><p>'+esc(sug.explanation||'')+'</p>';
    const acts = el('div','acts');
    const use = el('button','btn sm'); use.textContent='✓ Use'; use.onclick=()=>acceptSuggestion(sug);
    const edit = el('button','btn sm'); edit.textContent='Edit'; edit.onclick=()=>editSuggestion(sug);
    const rej = el('button','btn sm'); rej.textContent='✕'; rej.onclick=()=>rejectSuggestion(sug);
    acts.append(use,edit,rej); div.appendChild(acts); body.appendChild(div);
  }
  const items = [].concat(review.feedback.strengths.map(x=>['s',x]), review.feedback.targets.map(x=>['t',x]));
  for (const [k,item] of items){
    const div = el('div','fb '+k);
    div.innerHTML = '<div class="hd"><strong>'+esc(item.title)+'</strong><button class="del" title="Remove">✕</button></div>'+
      '<p>'+(item.source==='ai'?'AI':'Added by you')+(item.try_now_prompt?' · Try now: '+esc(item.try_now_prompt):'')+'</p>';
    div.querySelector('.del').onclick = ()=>deleteFeedback(item);
    body.appendChild(div);
  }
  const add = el('div','addrow');
  add.innerHTML = '<select id="fbKind"><option value="target">Target</option><option value="strength">Strength</option></select>'+
    '<input id="fbTitle" placeholder="Title (e.g. Fix run-on sentences)">'+
    '<textarea id="fbExpl" placeholder="Explanation (optional)"></textarea>'+
    '<button class="btn sm" id="fbAdd">Add</button>';
  body.appendChild(add);
  card.appendChild(body);
  setTimeout(()=>{ const b=document.getElementById('fbAdd'); if(b) b.onclick=addFeedback; },0);
  return card;
}

// Every loaded rubric kind that carries criteria gets a scorable tab. Order:
// internal, secondary, exam (AP). Exam only when the class is AP Lang.
function rubricTabs(){
  const list = [];
  if (review.rubric && review.rubric.criteria && review.rubric.criteria.length)
    list.push({ kind:'internal', label: review.rubric.name || 'Rubric 1', data: review.rubric, endpoint:'rubric-scores' });
  if (review.secondary_rubric && review.secondary_rubric.criteria && review.secondary_rubric.criteria.length)
    list.push({ kind:'secondary', label: review.secondary_rubric.name || 'Rubric 2', data: review.secondary_rubric, endpoint:'secondary-rubric-scores' });
  if (review.exam_rubric && review.exam_rubric.visible && review.exam_rubric.criteria && review.exam_rubric.criteria.length)
    list.push({ kind:'exam', label: review.exam_rubric.name || 'AP Lang', data: review.exam_rubric, endpoint:'exam-rubric-scores' });
  return list;
}

function cardRubric(){
  const card = el('div','card');
  const list = rubricTabs();
  if (!list.length) return card;
  if (!list.some(t=>t.kind===activeRubric)) activeRubric = list[0].kind;
  const tabs = el('div','rtabs');
  for (const t of list){
    const tab = el('button','rtab'+(activeRubric===t.kind?' on':''));
    tab.textContent = t.label;
    tab.onclick=()=>{ activeRubric=t.kind; renderRail(); };
    tabs.appendChild(tab);
  }
  card.appendChild(tabs);
  const rub = (list.find(t=>t.kind===activeRubric) || list[0]).data;
  const scores = new Map((rub.scores||[]).map(s=>[s.criterion_id, s.selected_score]));
  const body = el('div','body');
  for (const crit of rub.criteria){
    const max = Math.max.apply(null, crit.bands.map(b=>b.score_value).concat([5]));
    const min = Math.min.apply(null, crit.bands.map(b=>b.score_value).concat([1]));
    const cur = scores.has(crit.id) ? scores.get(crit.id) : null;
    const c = el('div','crit');
    const nm = el('div','nm'); nm.innerHTML = '<span>'+esc(crit.label)+'</span><b>'+(cur!=null?fmt(cur)+' / '+max:'—')+'</b>';
    c.appendChild(nm);
    const scale = el('div','scale');
    for (let v = min; v <= max; v += 0.5){
      const isHalf = (v % 1) !== 0;
      const pt = el('div','pt'+(isHalf?' half':'')+(cur===v?' sel':''));
      if (!isHalf) pt.textContent = v;
      pt.onclick = ()=>setScore(crit.id, v);
      scale.appendChild(pt);
    }
    c.appendChild(scale);
    const band = crit.bands.find(b=>b.score_value===Math.round(cur)) || crit.bands.find(b=>b.descriptor);
    if (band && band.descriptor){
      const desc = el('div','desc');
      const short = band.descriptor.length>70 ? band.descriptor.slice(0,70)+'… ' : band.descriptor+' ';
      desc.innerHTML = esc(short)+'<a>full band text</a>';
      desc.querySelector('a').onclick=(e)=>{ e.preventDefault(); desc.textContent = band.descriptor; };
      c.appendChild(desc);
    }
    body.appendChild(c);
  }
  card.appendChild(body);
  return card;
}

function fmt(n){ return Number.isInteger(n)? String(n) : n.toFixed(1); }
// Pull the whole sentence around a flagged span so the teacher gets context
// without scrolling up to the essay. Returns the sentence split around the
// flagged part for highlighting, or null if offsets are missing.
function sentenceAround(s, e){
  const text = (review.pad && review.pad.plain_text) || '';
  if (s == null || e == null || !text) return null;
  s = Math.max(0, Math.min(s, text.length));
  e = Math.max(s, Math.min(e, text.length));
  let start = s, end = e;
  while (start > 0 && !/[.!?\n]/.test(text[start-1])) start--;
  while (start < s && /\s/.test(text[start])) start++;
  while (end < text.length && !/[.!?\n]/.test(text[end])) end++;
  if (end < text.length) end++;
  return { before: text.slice(start, s), quote: text.slice(s, e), after: text.slice(e, end).replace(/\s+$/,'') };
}
function sentenceHtml(s, e, fallbackQuote){
  const ctx = sentenceAround(s, e);
  if (!ctx || !ctx.quote) return '"'+esc(fallbackQuote||'')+'"';
  return esc(ctx.before)+'<mark class="ctx-hit">'+esc(ctx.quote)+'</mark>'+esc(ctx.after);
}
function el(tag, cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }
function placeFloating(elm, left, top){
  const gap = 8;
  const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const width = elm.offsetWidth || 260;
  const height = elm.offsetHeight || 52;
  const x = Math.max(gap, Math.min(left, vw - width - gap));
  const y = Math.max(gap, Math.min(top, vh - height - gap));
  elm.style.left = x + 'px';
  elm.style.top = y + 'px';
}

function flashMark(annId){
  const span = document.querySelector('.mk[data-id="'+annId+'"][data-kind="lit"]');
  if (!span) return;
  span.scrollIntoView({ behavior:'smooth', block:'center' });
  span.classList.add('flash'); setTimeout(()=>span.classList.remove('flash'), 1200);
}

async function disagreeMark(ann){
  const sug = ann.metadata && ann.metadata.suggestion_id;
  if (!sug){ toast('This mark has no AI record to retract'); return; }
  await api('/api/native/pads/'+padId+'/suggestions/'+sug+'/disagree', { method:'POST' });
  removeAnnotation(ann.id); resolveLiteracySuggestion(sug);
  toast('Mark retracted'); renderLocal({ top:true, essay:true });
}
async function resolveContested(c, action, acceptedCode=c.code){
  if (pendingAttention.has(c.id)) return;
  pendingAttention.add(c.id);
  const provisionalId = 'saving-'+c.id;
  if (action !== 'reject') upsertAnnotation({
    id: provisionalId,
    type: 'literacy_code',
    start_offset: c.start_offset,
    end_offset: c.end_offset,
    selected_text: c.quote,
    body: '',
    document_version: c.document_version,
    metadata: { code:acceptedCode, category:CODE_CAT(acceptedCode), label:CODE_LABEL(acceptedCode), source:'saving', suggestion_id:c.id },
  });
  resolveLiteracySuggestion(c.id);
  renderLocal({ top:true, essay:true });
  toast('Saving decision…');
  try {
    let result = null;
    if (action==='keep' || action==='change') result = await api('/api/native/pads/'+padId+'/suggestions/'+c.id+'/accept', { method:'POST', body:action==='change'?{code:acceptedCode}:{} });
    else await api('/api/native/pads/'+padId+'/suggestions/'+c.id+'/disagree', { method:'POST' });
    removeAnnotation(provisionalId);
    if (result && result.annotation) upsertAnnotation(result.annotation);
    if (result) renderLocal({ top:true, essay:true });
    toast('Decision saved');
  } catch(error){
    removeAnnotation(provisionalId);
    if (!(review.suggestions || []).some(item=>String(item.id)===String(c.id))) review.suggestions.push(c);
    if (!contested.some(item=>String(item.id)===String(c.id))) contested.push(c);
    review.suggestions.sort((a,b)=>a.start_offset-b.start_offset || a.id-b.id);
    contested.sort((a,b)=>a.start_offset-b.start_offset || a.id-b.id);
    renderLocal({ top:true, essay:true });
    toast('Save failed. Decision restored.');
    console.error(error);
    loadAll().catch(refreshError=>console.error(refreshError));
  } finally {
    pendingAttention.delete(c.id);
  }
}
async function acceptSuggestion(sug){
  const result = await api('/api/native/pads/'+padId+'/feedback-suggestions/'+sug.id+'/accept', { method:'POST' });
  addFeedbackItem(result.item); fbSuggestions = fbSuggestions.filter(item=>String(item.id)!==String(sug.id));
  toast('Added'); renderLocal();
}
async function rejectSuggestion(sug){
  await api('/api/native/pads/'+padId+'/feedback-suggestions/'+sug.id+'/reject', { method:'POST' });
  fbSuggestions = fbSuggestions.filter(item=>String(item.id)!==String(sug.id));
  toast('Rejected'); renderLocal();
}
async function editSuggestion(sug){
  const title = prompt('Edit title', sug.title); if(title==null) return;
  const result = await api('/api/native/pads/'+padId+'/feedback-items', { method:'POST', body:{ kind:sug.kind, title, explanation:sug.explanation, try_now_prompt:sug.try_now_prompt, source:'ai' } });
  await api('/api/native/pads/'+padId+'/feedback-suggestions/'+sug.id+'/reject', { method:'POST' });
  addFeedbackItem(result.item); fbSuggestions = fbSuggestions.filter(item=>String(item.id)!==String(sug.id));
  toast('Saved'); renderLocal();
}
async function addFeedback(){
  const kind = document.getElementById('fbKind').value;
  const title = document.getElementById('fbTitle').value.trim();
  const explanation = document.getElementById('fbExpl').value.trim();
  if (!title){ toast('Title needed'); return; }
  const result = await api('/api/native/pads/'+padId+'/feedback-items', { method:'POST', body:{ kind, title, explanation } });
  addFeedbackItem(result.item);
  toast('Added'); renderLocal();
}
async function deleteFeedback(item){
  await api('/api/native/pads/'+padId+'/feedback-items/'+item.id, { method:'DELETE' });
  removeFeedbackItem(item); toast('Removed'); renderLocal();
}
async function setScore(criterionId, value){
  const tab = rubricTabs().find(t=>t.kind===activeRubric);
  const endpoint = tab ? tab.endpoint : 'rubric-scores';
  const result = await api('/api/native/pads/'+padId+'/'+endpoint, { method:'PUT', body:{ scores:[{ criterion_id:criterionId, selected_score:value }] } });
  if (tab) tab.data.scores = result.scores;
  renderLocal();
}
// Per-student early release: only meaningful on batch assignments that are
// marked but not yet released to the class.
function renderSendFeedback(){
  const btn = document.getElementById('sendFeedbackBtn');
  const marked = ['marked','green_pen_open','resubmitted'].includes(review.pad.state);
  const held = review.assignment.feedback_release === 'batch' && !review.assignment.feedback_released_at;
  if (!marked || !held){ btn.style.display = 'none'; return; }
  btn.style.display = '';
  if (review.pad_feedback_released_at){
    btn.textContent = 'Feedback sent';
    btn.disabled = true;
    return;
  }
  btn.textContent = 'Send feedback';
  btn.disabled = false;
  btn.onclick = async ()=>{
    if(!confirm('Send feedback to this student now, before the class release?')) return;
    const res = await api('/api/native/pads/'+padId+'/release-feedback', { method:'POST' });
    if (res && res.rewrite_assignment){
      toast((res.rewrite_assignment.created?'Feedback sent. Rewrite assignment created: ':'Feedback sent. Added to rewrite: ')+res.rewrite_assignment.title);
    } else {
      toast('Feedback sent to student');
    }
    review.pad_feedback_released_at = new Date().toISOString();
    renderSendFeedback();
  };
}

async function finishMarking(){
  await api('/api/native/pads/'+padId+'/finish-marking', { method:'POST' });
  const current = queue.find(q=>String(q.pad_id)===String(padId));
  if (current) current.status = 'marked';
  cacheQueue();
  toast('Marked. Score held until you release to the class.');
  const withPad = queue.filter(q=>q.pad_id);
  const idx = withPad.findIndex(q=>String(q.pad_id)===String(padId));
  const next = withPad.slice(idx+1).find(q=>!isDone(q.status));
  if (next) setTimeout(()=>location.href='/teacher/native-review?pad_id='+next.pad_id, 700);
  else setTimeout(loadAll, 500);
}

let pendingSel = null;
// On mouseup show a small toolbar NEAR the selection without touching the
// selection or focus, so highlight-to-copy (Cmd/Ctrl+C) keeps working. The
// teacher then chooses Comment or Mark error from the toolbar.
function onSelectText(){
  const sel = window.getSelection();
  const essay = document.getElementById('essay');
  if (!sel || sel.isCollapsed || !essay.contains(sel.anchorNode)){ closeSelBar(); return; }
  const range = sel.getRangeAt(0);
  const offsets = offsetsWithin(essay, range);
  if (offsets == null || offsets.start === offsets.end){ closeSelBar(); return; }
  pendingSel = offsets;
  const rect = range.getBoundingClientRect();
  const bar = document.getElementById('selBar');
  bar.classList.add('open');
  // On touch devices the phone's own copy/paste bubble sits right on the
  // selection, so drop our toolbar clearly ABOVE the selected text with extra
  // clearance. On mouse devices keep it just below where the cursor left off.
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (coarse){
    const barH = bar.offsetHeight || 52;
    placeFloating(bar, rect.left, rect.top - barH - 16);
  } else {
    placeFloating(bar, rect.left, rect.bottom + 8);
  }
}
function closeSelBar(){ document.getElementById('selBar').classList.remove('open'); }
function closePop(){ document.getElementById('commentPop').classList.remove('open'); pendingSel=null; }
// Toolbar: Comment opens the existing comment popover for the stored selection.
document.getElementById('selComment').onmousedown = (e)=>{ e.preventDefault(); };
document.getElementById('selComment').onclick = ()=>{
  if (!pendingSel) return;
  const bar = document.getElementById('selBar');
  const pop = document.getElementById('commentPop');
  closeSelBar();
  pop.classList.add('open');
  placeFloating(pop, parseFloat(bar.style.left) || 8, parseFloat(bar.style.top) || 8);
  const ta = document.getElementById('commentText'); ta.value=''; ta.focus();
};
// Mark error opens the searchable, family-grouped code picker and tags the
// selection as a literacy_code annotation (source teacher).
document.getElementById('selMark').onmousedown = (e)=>{ e.preventDefault(); };
document.getElementById('selMark').onclick = ()=>{
  if (!pendingSel) return;
  closeSelBar();
  openCodePicker({ title:'Mark selected text', onChoose:markPendingSelection });
};
async function markPendingSelection(code){
  if (!code || !pendingSel) return;
  const label = CODE_LABEL(code);
  const sel = pendingSel;
  const result = await api('/api/native/pads/'+padId+'/annotations', { method:'POST', body:{
    type:'literacy_code', start_offset:sel.start, end_offset:sel.end, selected_text:sel.text,
    metadata:{ code, category:CODE_CAT(code), label, source:'teacher' }, document_version:review.pad.version } });
  upsertAnnotation(result.annotation);
  toast('Marked '+code); renderLocal({ top:true, essay:true });
}
// The essay DOM carries hidden tooltip labels (<span class="tip">) inside
// every mark, so counting characters with Range.toString() drifts right by
// each tip before the selection and the comment lands on the wrong text.
// Clone the ranges and strip the tips before measuring.
function rangeTextWithoutTips(range){
  const frag = range.cloneContents();
  frag.querySelectorAll('.tip').forEach(t => t.remove());
  return frag.textContent;
}
function offsetsWithin(container, range){
  const pre = document.createRange(); pre.selectNodeContents(container); pre.setEnd(range.startContainer, range.startOffset);
  const start = rangeTextWithoutTips(pre).length;
  const text = rangeTextWithoutTips(range);
  return { start, end: start + text.length, text };
}
document.getElementById('commentSave').onclick = async ()=>{
  if (!pendingSel) return;
  const body = document.getElementById('commentText').value.trim();
  if (!body){ toast('Write a comment'); return; }
  const result = await api('/api/native/pads/'+padId+'/annotations', { method:'POST', body:{ type:'inline_comment', body, start_offset:pendingSel.start, end_offset:pendingSel.end, selected_text:pendingSel.text, document_version:review.pad.version } });
  upsertAnnotation(result.annotation);
  closePop(); toast('Comment saved'); renderLocal({ essay:true });
};
document.addEventListener('mousedown', (e)=>{
  const pop=document.getElementById('commentPop'); if(pop.classList.contains('open') && !pop.contains(e.target)) closePop();
  const bar=document.getElementById('selBar');
  if(bar.classList.contains('open') && !bar.contains(e.target) && !document.getElementById('essay').contains(e.target)) closeSelBar();
});
// The toolbar disappears when the selection collapses (click elsewhere in the
// text, arrow keys, etc).
document.addEventListener('selectionchange', ()=>{
  const bar=document.getElementById('selBar');
  if(!bar.classList.contains('open')) return;
  const sel=window.getSelection();
  if(!sel || sel.isCollapsed) closeSelBar();
});

boot().catch(err=>{ console.error(err); document.getElementById('essay').innerHTML='<div class="loading">'+esc(err.message)+'</div>'; });
</script>
