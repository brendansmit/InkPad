<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InkHeron - Native Review</title>
  <link rel="icon" href="/assets/InkHeron%20Logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--font);font-size:14px;line-height:1.55;color:var(--text);background:var(--bg);min-height:100vh}
    .appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:14px 26px;background:rgba(247,246,242,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
    .glyph{width:32px;height:32px;border-radius:10px;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;font-weight:600;transform:rotate(-4deg)}
    .brand{font-family:var(--serif);font-size:17px;font-weight:600}
    .spacer{flex:1}
    .container{max-width:1380px;margin:0 auto;padding:24px 24px 70px}
    .topline{display:flex;gap:12px;align-items:flex-end;margin-bottom:16px}
    .back{color:var(--text-2);font-size:13px;text-decoration:none}
    h1{font-family:var(--serif);font-size:28px;line-height:1.1;margin:0 0 4px;color:var(--ink)}
    .lead{margin:0;color:var(--text-2)}
    .layout{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:16px;align-items:start}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card)}
    .rail{position:sticky;top:82px;padding:16px}
    .section{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}
    .section:first-child{border-top:none;padding-top:0;margin-top:0}
    .label{display:block;color:var(--text-2);font-size:12px;font-weight:800;text-transform:uppercase;margin:0 0 6px}
    .value{font-weight:800}
    .sub{display:block;color:var(--text-3);font-size:12.5px;margin-top:2px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 13px;border-radius:var(--r-sm);font-weight:800;text-decoration:none;cursor:pointer;border:1.5px solid var(--border-2);background:var(--surface);color:var(--text)}
    .btn.primary{background:var(--green-600);color:#fff;border-color:var(--green-600)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .stack{display:grid;gap:9px}
    .pill{display:inline-flex;align-items:center;min-height:25px;border-radius:999px;padding:0 9px;font-size:12px;font-weight:800;background:var(--blue-50);color:var(--blue-700)}
    .pill.warn{background:var(--coral-50);color:var(--coral-600);border:1px solid var(--coral-100)}
    select,textarea,input{width:100%;border:1.5px solid var(--border-2);border-radius:var(--r-sm);padding:10px 11px;font:inherit;font-size:14px;background:var(--surface);color:var(--text)}
    textarea{resize:vertical;min-height:88px}
    .paper{padding:34px;min-height:70vh}
    .essay{white-space:pre-wrap;font-family:var(--serif);font-size:18px;line-height:1.78;color:var(--ink);outline:none}
    .mark{border-bottom:2px solid var(--green-600);background:var(--green-50);padding:0 1px}
    .mark.comment{border-color:var(--blue-700);background:var(--blue-50)}
    .mark.code{border-color:var(--maroon-500);background:var(--maroon-50)}
    .mark.highlight{border-color:var(--amber-700);background:var(--amber-50)}
    .side{position:sticky;top:82px;display:grid;gap:12px}
    .box{padding:15px}
    .comment-list{display:grid;gap:9px;max-height:36vh;overflow:auto}
    .comment{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;background:var(--surface)}
    .comment strong{display:block;font-size:12.5px;margin-bottom:3px}
    .comment p{margin:0;color:var(--text-2)}
    .meta{font-family:var(--mono);font-size:12px;color:var(--text-3)}
    .tabs{display:flex;gap:6px;margin-bottom:10px}
    .tab{min-height:32px;padding:0 10px}
    .empty{padding:30px;text-align:center;color:var(--text-3)}
    @media(max-width:1080px){.layout{grid-template-columns:1fr}.rail,.side{position:static}.paper{min-height:50vh}.topline{display:block}}
  </style>
</head>
<body>
  <div class="appbar">
    <div class="glyph">i</div><div class="brand">InkHeron</div>
    <span class="spacer"></span>
    <button class="btn" id="logoutBtn" type="button">Sign out</button>
  </div>

  <main class="container">
    <div class="topline">
      <div>
        <a class="back" id="backLink" href="/teacher/assignments">Back to assignments</a>
        <h1 id="title">Native review</h1>
        <p class="lead" id="subtitle"></p>
      </div>
    </div>
    <div id="root" class="panel empty">Loading review...</div>
  </main>

  <script>
    let csrfToken='';
    let reviewData=null;
    let selectedRange=null;
    let selectedGeneralId=null;

    async function init(){
      const me=await fetch('/api/me');
      if(!me.ok){ window.location.href='/teacher-login'; return; }
      const payload=await me.json();
      if(payload.user.type!=='teacher'){ window.location.href='/'; return; }
      csrfToken=payload.user.csrf_token;
      document.getElementById('logoutBtn').addEventListener('click',async()=>{
        await fetch('/api/logout',{method:'POST',headers:{'X-CSRF-Token':csrfToken}});
        window.location.href='/teacher-login';
      });
      await loadReview();
    }

    async function loadReview(){
      const padId=new URLSearchParams(window.location.search).get('pad_id');
      if(!padId){ renderError('No pad selected.'); return; }
      const response=await fetch('/api/native/pads/'+encodeURIComponent(padId)+'/review');
      if(!response.ok){ renderError('Could not load native pad.'); return; }
      reviewData=await response.json();
      document.getElementById('title').textContent=reviewData.student.display_name;
      document.getElementById('subtitle').textContent=reviewData.assignment.title+' · '+reviewData.class.name;
      document.getElementById('backLink').href='/teacher/assignments?id='+reviewData.assignment.id;
      renderReview();
    }

    function renderReview(){
      const general=reviewData.annotations.filter(item=>item.type==='general_comment').at(-1);
      selectedGeneralId=general ? general.id : null;
      document.getElementById('root').className='layout';
      document.getElementById('root').innerHTML=`
        <aside class="panel rail">
          <div class="section">
            <span class="label">Student</span>
            <span class="value">${escapeHtml(reviewData.student.display_name)}</span>
            <span class="sub">${escapeHtml(reviewData.student.username)}</span>
          </div>
          <div class="section">
            <span class="label">State</span>
            <span class="pill">${escapeHtml(reviewData.pad.state)}</span>
            <span class="sub">Version ${reviewData.pad.version} · ${reviewData.pad.word_count} words</span>
          </div>
          <div class="section stack">
            <label class="label" for="pasteMode">Paste</label>
            <select id="pasteMode">
              ${policyOption('allow','Allow')}
              ${policyOption('log','Log')}
              ${policyOption('block','Block')}
            </select>
            <label><input id="spellcheckToggle" type="checkbox" ${reviewData.policy.spellcheck_enabled?'checked':''}> Spellcheck</label>
            <button class="btn primary" id="savePolicyBtn" type="button">Save policy</button>
            <span class="sub" id="policyMsg"></span>
          </div>
          <div class="section">
            <span class="label">Evidence</span>
            ${reviewData.paste_events.length?`<span class="pill warn">${reviewData.paste_events.length} paste event${reviewData.paste_events.length===1?'':'s'}</span>`:'<span class="sub">No paste events</span>'}
            <div class="stack" style="margin-top:8px">${reviewData.paste_events.map(pasteEvent).join('')}</div>
          </div>
          <div class="section">
            <span class="label">Revisions</span>
            <div class="stack">${reviewData.revisions.map(revisionItem).join('')}</div>
          </div>
        </aside>
        <article class="panel paper">
          <div class="essay" id="essayText">${renderMarkedText(reviewData.pad.plain_text, reviewData.annotations)}</div>
        </article>
        <aside class="side">
          <section class="panel box">
            <span class="label">General comment</span>
            <textarea id="generalComment">${escapeHtml(general?.body || '')}</textarea>
            <button class="btn primary" id="saveGeneralBtn" type="button" style="margin-top:8px">Save comment</button>
            <span class="sub" id="generalMsg"></span>
          </section>
          <section class="panel box">
            <span class="label">Range annotation</span>
            <div class="meta" id="selectionMeta">${selectedRange ? rangeLabel(selectedRange) : 'No text selected'}</div>
            <select id="rangeType" style="margin-top:8px">
              <option value="inline_comment">Inline comment</option>
              <option value="literacy_code">Literacy code</option>
              <option value="highlight">Highlight</option>
            </select>
            <div id="codeFields" style="display:none;margin-top:8px">
              <input id="codeInput" type="text" placeholder="Code, e.g. EV" style="margin-bottom:8px">
              <input id="categoryInput" type="text" placeholder="Category, e.g. Evidence">
            </div>
            <textarea id="rangeBody" placeholder="Comment or explanation" style="margin-top:8px"></textarea>
            <button class="btn primary" id="addRangeBtn" type="button" style="margin-top:8px" ${selectedRange?'':'disabled'}>Add annotation</button>
            <span class="sub" id="rangeMsg"></span>
          </section>
          <section class="panel box">
            <div class="tabs">
              <button class="btn tab" type="button" data-filter="all">All</button>
              <button class="btn tab" type="button" data-filter="inline_comment">Inline</button>
              <button class="btn tab" type="button" data-filter="literacy_code">Codes</button>
            </div>
            <div class="comment-list" id="annotationList">${annotationList('all')}</div>
          </section>
        </aside>
      `;
      document.getElementById('essayText').addEventListener('mouseup', captureSelection);
      document.getElementById('essayText').addEventListener('keyup', captureSelection);
      document.getElementById('savePolicyBtn').addEventListener('click', savePolicy);
      document.getElementById('saveGeneralBtn').addEventListener('click', saveGeneralComment);
      document.getElementById('addRangeBtn').addEventListener('click', addRangeAnnotation);
      document.getElementById('rangeType').addEventListener('change', updateRangeForm);
      document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=> {
        document.getElementById('annotationList').innerHTML=annotationList(btn.dataset.filter);
      }));
      updateRangeForm();
    }

    function policyOption(value,label){
      return `<option value="${value}" ${reviewData.policy.paste_mode===value?'selected':''}>${label}</option>`;
    }

    function pasteEvent(event){
      return `<div class="comment"><strong>${escapeHtml(event.input_type)}</strong><p>${event.length} chars</p><span class="meta">${escapeHtml(formatDate(event.at))}</span></div>`;
    }

    function revisionItem(revision){
      return `<div class="comment"><strong>${escapeHtml(revision.reason)}</strong><p>${revision.word_count} words · v${revision.document_version}</p><span class="meta">${escapeHtml(formatDate(revision.created_at))}</span></div>`;
    }

    function annotationList(filter){
      const annotations=reviewData.annotations.filter(item=>filter==='all' || item.type===filter);
      if(!annotations.length) return '<div class="empty">No annotations.</div>';
      return annotations.map(item=>`
        <div class="comment">
          <strong>${escapeHtml(labelForType(item.type))}${item.resolved?' · resolved':''}</strong>
          ${item.selected_text?`<p><mark>${escapeHtml(item.selected_text)}</mark></p>`:''}
          <p>${escapeHtml(item.body || item.metadata?.label || '')}</p>
          <span class="meta">v${item.document_version}</span>
          ${item.type!=='general_comment' && !item.resolved?`<button class="btn" type="button" onclick="resolveAnnotation(${item.id})" style="margin-top:8px">Resolve</button>`:''}
        </div>
      `).join('');
    }

    function labelForType(type){
      return {
        general_comment:'General',
        inline_comment:'Inline',
        literacy_code:'Code',
        highlight:'Highlight',
      }[type] || type;
    }

    function renderMarkedText(text, annotations){
      const ranged=annotations
        .filter(item=>item.type!=='general_comment' && Number.isInteger(item.start_offset) && Number.isInteger(item.end_offset))
        .map(item=>({...item,start_offset:Math.max(0,Math.min(text.length,item.start_offset)),end_offset:Math.max(0,Math.min(text.length,item.end_offset))}))
        .filter(item=>item.end_offset>item.start_offset)
        .sort((a,b)=>a.start_offset-b.start_offset || a.end_offset-b.end_offset);
      let cursor=0;
      let html='';
      ranged.forEach(item=>{
        if(item.start_offset<cursor) return;
        html+=escapeHtml(text.slice(cursor,item.start_offset));
        html+=`<span class="mark ${escapeHtml(markClass(item.type))}" title="${escapeHtml(item.body || item.metadata?.label || item.type)}">${escapeHtml(text.slice(item.start_offset,item.end_offset))}</span>`;
        cursor=item.end_offset;
      });
      html+=escapeHtml(text.slice(cursor));
      return html || '<span class="sub">No text saved.</span>';
    }

    function markClass(type){
      return {inline_comment:'comment',literacy_code:'code',highlight:'highlight'}[type] || '';
    }

    function captureSelection(){
      const root=document.getElementById('essayText');
      const selection=window.getSelection();
      if(!selection || selection.rangeCount===0 || selection.isCollapsed || !root.contains(selection.anchorNode) || !root.contains(selection.focusNode)){
        selectedRange=null;
      }else{
        selectedRange=selectionOffsets(root, selection.getRangeAt(0));
      }
      const meta=document.getElementById('selectionMeta');
      const button=document.getElementById('addRangeBtn');
      if(meta) meta.textContent=selectedRange ? rangeLabel(selectedRange) : 'No text selected';
      if(button) button.disabled=!selectedRange;
    }

    function updateRangeForm(){
      const type=document.getElementById('rangeType')?.value;
      const fields=document.getElementById('codeFields');
      if(fields) fields.style.display=type==='literacy_code'?'':'none';
    }

    function selectionOffsets(root, range){
      const before=document.createRange();
      before.selectNodeContents(root);
      before.setEnd(range.startContainer, range.startOffset);
      const selected=range.toString();
      const start=before.toString().length;
      return { start, end:start+selected.length, text:selected };
    }

    function rangeLabel(range){
      return `${range.start}-${range.end}: ${range.text.slice(0,60)}`;
    }

    async function savePolicy(){
      const response=await fetch('/api/native/pads/'+reviewData.pad.id+'/policy',{
        method:'PUT',
        headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},
        body:JSON.stringify({
          paste_mode:document.getElementById('pasteMode').value,
          spellcheck_enabled:document.getElementById('spellcheckToggle').checked,
        }),
      });
      document.getElementById('policyMsg').textContent=response.ok?'Policy saved.':'Policy failed.';
      if(response.ok){ reviewData.policy=(await response.json()).policy; }
    }

    async function saveGeneralComment(){
      const body=document.getElementById('generalComment').value;
      const response=selectedGeneralId
        ? await fetch('/api/native/annotations/'+selectedGeneralId,{method:'PATCH',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({body})})
        : await fetch('/api/native/pads/'+reviewData.pad.id+'/annotations',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({type:'general_comment',body})});
      document.getElementById('generalMsg').textContent=response.ok?'Comment saved.':'Comment failed.';
      if(response.ok) await loadReview();
    }

    async function addRangeAnnotation(){
      if(!selectedRange) return;
      const type=document.getElementById('rangeType').value;
      const body=document.getElementById('rangeBody').value;
      const code=document.getElementById('codeInput').value.trim();
      const category=document.getElementById('categoryInput').value.trim();
      const metadata=type==='literacy_code' ? { code, category, label: code ? `${code}${category ? ' · ' + category : ''}` : category } : {};
      const response=await fetch('/api/native/pads/'+reviewData.pad.id+'/annotations',{
        method:'POST',
        headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},
        body:JSON.stringify({
          type,
          start_offset:selectedRange.start,
          end_offset:selectedRange.end,
          selected_text:selectedRange.text,
          body,
          metadata,
          document_version:reviewData.pad.version,
        }),
      });
      document.getElementById('rangeMsg').textContent=response.ok?'Annotation saved.':'Annotation failed.';
      if(response.ok){ selectedRange=null; await loadReview(); }
    }

    async function resolveAnnotation(id){
      const response=await fetch('/api/native/annotations/'+id,{
        method:'PATCH',
        headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},
        body:JSON.stringify({resolved:true}),
      });
      if(response.ok) await loadReview();
    }

    function renderError(message){
      document.getElementById('root').className='panel empty';
      document.getElementById('root').textContent=message;
    }

    function formatDate(value){
      const date=new Date(value);
      if(Number.isNaN(date.getTime())) return value || '';
      return date.toLocaleString([], { dateStyle:'medium', timeStyle:'short' });
    }

    function escapeHtml(value){
      const div=document.createElement('div');
      div.textContent=value ?? '';
      return div.innerHTML;
    }

    window.resolveAnnotation=resolveAnnotation;
    init();
  </script>
</body>
</html>
