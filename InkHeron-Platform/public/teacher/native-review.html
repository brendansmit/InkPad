<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkHeron - Review</title>
<link rel="icon" href="/assets/InkHeron%20Logo.png">
<link rel="stylesheet" href="/assets/styles.css">
<style>
/* Direction D: calm desk. Component styles layered on the shared tokens. */
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg)}
.appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 22px;background:rgba(247,246,242,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.glyph{width:30px;height:30px;border-radius:9px;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;transform:rotate(-4deg)}
.who{font-family:var(--serif);font-size:16px;font-weight:600}
.crumb{color:var(--text-3);font-size:13px}
.spacer{flex:1}
.nextprev{display:flex;gap:4px;align-items:center;color:var(--text-3);font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border-radius:var(--r-sm);font-weight:800;font-size:13px;cursor:pointer;border:1.5px solid var(--border-2);background:var(--surface);color:var(--text);text-decoration:none}
.btn.primary{background:var(--green-600);color:#fff;border-color:var(--green-600)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1400px;margin:0 auto;padding:16px 22px 60px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.paper{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:38px 44px;min-height:78vh}
.paper h2{font-family:var(--serif);font-size:21px;margin:0 0 2px}
.paper .meta{color:var(--text-3);font-size:12px;font-family:var(--mono);margin-bottom:18px}
.essay{font-family:var(--serif);font-size:17.5px;line-height:1.95;color:var(--ink);white-space:pre-wrap}
.mk{padding:0 1px;border-bottom:2px solid;cursor:help;position:relative;text-decoration:none}
.mk.surface{border-color:var(--amber-700)}
.mk.grammar{border-color:var(--maroon-500)}
.mk.format{border-color:var(--blue-700)}
/* Needs-you marks use a neon highlighter wash no literacy code comes close
   to, so they jump out of the code colour noise. */
.mk.contested{border-bottom:2.5px dotted var(--ink);background:#ccff00;border-radius:2px}
.mk.comment{border-color:var(--green-500);background:var(--green-50)}
.mk.flash{background:var(--amber-50);outline:2px solid var(--amber-700);border-radius:3px}
.tip{position:absolute;bottom:125%;left:0;background:var(--ink);color:#fff;font-family:var(--font);font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:5;pointer-events:none;display:none}
.mk[data-kind="lit"]{cursor:pointer}
/* Layered marks: an outer clause-level mark keeps a plain underline, an inner
   word-level mark (2+ marks covering the same text) drops its underline lower
   and wins a faint background wash so both stay visible. */
.mk.stack-outer{padding-bottom:3px}
.mk.wash.surface{background:var(--amber-50)}
.mk.wash.grammar{background:var(--maroon-50,rgba(150,40,40,.08))}
.mk.wash.format{background:var(--blue-50,rgba(40,80,150,.08))}
.code-pop{position:absolute;z-index:90;display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border-2);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow-lift)}
.code-pop-quote{font-family:var(--serif);font-size:12.5px;color:var(--text-2);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-pop select{border:1.5px solid var(--border-2);border-radius:8px;padding:5px 7px;font:inherit;font-size:12.5px;background:var(--surface)}
.mk:hover .tip{display:block}
.rail{position:sticky;top:64px;display:grid;gap:10px;max-height:calc(100vh - 80px);overflow:auto;padding-bottom:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card)}
.card>header{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--border)}
.card>header strong{font-size:13px}
.count{font-size:11px;font-weight:800;background:var(--surface-2);border-radius:999px;padding:2px 8px;color:var(--text-2)}
.count.warn{background:var(--coral-50);color:var(--coral-500)}
.body{padding:11px 13px;display:grid;gap:8px}
.grp{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:12.5px;cursor:pointer}
.grp .cc{font-family:var(--mono);font-size:11px;font-weight:800;min-width:52px}
.grp .cc.surface{color:var(--amber-700)}
.grp .cc.grammar{color:var(--maroon-500)}
.grp .cc.format{color:var(--blue-700)}
.grp .lbl{flex:1;color:var(--text-2)}
.grp .n{font-weight:800}
.grp .x{color:var(--text-3);font-size:11px}
.grpmarks{display:grid;gap:5px;padding:2px 2px 6px 10px}
.grpmark{display:flex;align-items:center;gap:8px;font-size:12px}
.grpmark .q{flex:1;font-family:var(--serif);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.autonote{font-size:11px;color:var(--text-3);padding:2px 13px 11px}
.cst{border:1px dashed var(--coral-500);border-radius:var(--r-sm);padding:9px 10px;background:var(--coral-50)}
.cst .q{font-family:var(--serif);font-size:13.5px}
.cst .why{font-size:11px;color:var(--text-2);margin:3px 0 7px}
.cst .acts{display:flex;gap:6px;flex-wrap:wrap}
.sug{border:1px dashed var(--border-2);border-radius:var(--r-sm);padding:9px 10px;background:var(--bg)}
.sug strong{font-size:12.5px;display:block}
.sug p{margin:3px 0 7px;color:var(--text-2);font-size:12px}
.sug .acts{display:flex;gap:6px;flex-wrap:wrap}
.fb{border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px;background:var(--surface)}
.fb.s{border-left:4px solid var(--green-500)}
.fb.t{border-left:4px solid var(--blue-700)}
.fb .hd{display:flex;align-items:center;gap:6px}
.fb strong{font-size:12.5px;display:block;flex:1}
.fb p{margin:3px 0 0;color:var(--text-2);font-size:12px}
.fb .del{color:var(--text-3);cursor:pointer;font-size:12px;border:none;background:none}
.addrow{display:grid;gap:6px;margin-top:4px}
.addrow textarea,.addrow input,.addrow select{width:100%;border:1.5px solid var(--border-2);border-radius:8px;padding:7px 9px;font:inherit;font-size:12.5px;background:var(--surface);color:var(--text)}
.addrow textarea{min-height:48px;resize:vertical}
.rtabs{display:flex;gap:4px;padding:9px 13px 0}
.rtab{border:none;background:var(--surface-2);font:inherit;font-size:11.5px;font-weight:800;color:var(--text-3);padding:5px 10px;border-radius:8px;cursor:pointer}
.rtab.on{background:var(--ink);color:#fff}
.crit{padding:7px 0;border-bottom:1px solid var(--border)}
.crit:last-child{border:none}
.crit .nm{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.crit .nm b{font-variant-numeric:tabular-nums}
.scale{display:flex;gap:2px}
.pt{flex:1;min-height:26px;border:1px solid var(--border-2);background:var(--bg);border-radius:6px;font-size:10.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.pt.half{flex:.55;background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 3px,var(--surface-3) 3px,var(--surface-3) 5px)}
.pt.sel{background:var(--green-600);border-color:var(--green-600);color:#fff}
.desc{font-size:11px;color:var(--text-3);margin-top:4px}
.desc a{color:var(--blue-700);font-weight:700;text-decoration:none;cursor:pointer}
.selbar{position:fixed;z-index:85;background:var(--surface);border:1px solid var(--border-2);border-radius:10px;padding:5px 6px;display:none;gap:5px;align-items:center;box-shadow:var(--shadow-lift)}
.selbar.open{display:flex}
.selbar select{border:1.5px solid var(--border-2);border-radius:8px;padding:4px 6px;font:inherit;font-size:12px;background:var(--surface)}
.popover{position:fixed;z-index:80;background:var(--ink);border-radius:10px;padding:8px;display:none;gap:6px;box-shadow:var(--shadow-lift)}
.popover.open{display:flex}
.popover textarea{width:220px;min-height:48px;border:none;border-radius:6px;padding:6px 8px;font:inherit;font-size:12.5px;resize:vertical}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.loading{padding:60px;text-align:center;color:var(--text-3)}
</style>
</head>
<body>
<div class="appbar">
  <div class="glyph">i</div>
  <a class="btn sm" id="backBtn" href="/teacher/assignments">← Assignments</a>
  <span class="who" id="studentName">…</span>
  <span class="crumb" id="crumb"></span>
  <span class="spacer"></span>
  <span class="nextprev" id="markedCount"></span>
  <button class="btn" id="reanalyzeBtn" title="Re-run the AI marking on this essay">Run AI review</button>
  <button class="btn" id="prevBtn">← Prev</button>
  <button class="btn" id="nextBtn">Next →</button>
  <button class="btn" id="sendFeedbackBtn" style="display:none">Send feedback</button>
  <button class="btn primary" id="finishBtn">Finish marking</button>
</div>

<div class="wrap" id="wrap">
  <div class="paper">
    <h2 id="essayTitle">…</h2>
    <div class="meta" id="essayMeta"></div>
    <div class="essay" id="essay"><div class="loading">Loading essay…</div></div>
  </div>
  <div class="rail" id="rail"></div>
</div>

<div class="popover" id="commentPop">
  <textarea id="commentText" placeholder="Comment on the selected text…"></textarea>
  <button class="btn sm primary" id="commentSave">Save</button>
</div>
<div class="selbar" id="selBar">
  <button class="btn sm" id="selComment">Comment</button>
  <button class="btn sm" id="selMark">Mark error ▾</button>
  <select id="selCode" style="display:none"></select>
</div>
<div class="toast" id="toast"></div>

<script>
const CAT = { surface: 'surface', grammar: 'grammar', format: 'format' };
const CAT_LABEL = { surface: 'Spelling and words', grammar: 'Grammar', format: 'Punctuation and format' };
let csrf = '';
let review = null;
let fbSuggestions = [];
let contested = [];
let queue = [];
let padId = null;
let activeRubric = 'internal';

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
async function api(path, opts={}){
  const o = Object.assign({ headers: {} }, opts);
  if (opts.method && opts.method !== 'GET'){ o.headers['X-CSRF-Token'] = csrf; if (opts.body && typeof opts.body !== 'string'){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(opts.body);} }
  const r = await fetch(path, o);
  if (!r.ok && r.status !== 204) throw new Error(path + ' ' + r.status);
  if (r.status === 204) return null;
  return r.json();
}
function isDone(status){ return status === 'marked' || status === 'resubmitted'; }

async function boot(){
  padId = new URLSearchParams(location.search).get('pad_id');
  if (!padId){ document.getElementById('essay').innerHTML='<div class="loading">No pad selected.</div>'; return; }
  const me = await fetch('/api/me').then(r=>r.ok?r.json():null).catch(()=>null);
  if (!me || !me.user || me.user.type !== 'teacher'){ location.href='/teacher-login.html'; return; }
  csrf = me.user.csrf_token;
  await loadAll();
}

async function loadAll(){
  review = await api('/api/native/pads/'+padId+'/review');
  fbSuggestions = (await api('/api/native/pads/'+padId+'/feedback-suggestions?status=pending')).suggestions || [];
  contested = (review.suggestions || []).filter(s => s.status === 'pending');
  try { queue = (await api('/api/assignments/'+review.assignment.id+'/dashboard?sort=name')).students || []; } catch(_){ queue = []; }
  render();
}

function render(){ renderTop(); renderEssay(); renderRail(); }

function renderTop(){
  const s = review.student, pad = review.pad, a = review.assignment;
  document.getElementById('studentName').textContent = s.display_name;
  const pasteN = review.paste_events.length;
  document.getElementById('crumb').textContent = [a.title, (pad.word_count||0)+' words', 'v'+(pad.version||1), pasteN+' paste event'+(pasteN===1?'':'s')].join(' · ');
  document.getElementById('essayTitle').textContent = a.title;
  const autoN = review.annotations.filter(isAuto).length;
  document.getElementById('essayMeta').textContent = 'AI placed '+autoN+' marks automatically · '+contested.length+' need your decision · hover any mark for its category';
  const withPad = queue.filter(q => q.pad_id);
  const markedN = withPad.filter(q => isDone(q.status)).length;
  document.getElementById('markedCount').textContent = markedN+' of '+withPad.length+' marked';
  const idx = withPad.findIndex(q => String(q.pad_id) === String(padId));
  const nextUnmarked = withPad.slice(idx+1).find(q => !isDone(q.status));
  const prev = idx > 0 ? withPad[idx-1] : null;
  const nextBtn = document.getElementById('nextBtn'), prevBtn = document.getElementById('prevBtn');
  nextBtn.disabled = !nextUnmarked; nextBtn.onclick = ()=>{ if(nextUnmarked) location.href = '/teacher/native-review?pad_id='+nextUnmarked.pad_id; };
  prevBtn.disabled = !prev; prevBtn.onclick = ()=>{ if(prev) location.href = '/teacher/native-review?pad_id='+prev.pad_id; };
  document.getElementById('finishBtn').onclick = finishMarking;
  renderSendFeedback();
  document.getElementById('reanalyzeBtn').onclick = reanalyze;
  const back = document.getElementById('backBtn');
  if (back) back.href = a.id ? '/teacher/assignments?id=' + a.id : '/teacher/assignments';
}

async function reanalyze(){
  const btn = document.getElementById('reanalyzeBtn');
  if (btn.disabled) return;
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Reviewing…';
  try {
    const res = await api('/api/native/pads/'+padId+'/reanalyze', { method:'POST' });
    if (res.status === 'no_key') toast(res.message);
    else if (res.status === 'empty') toast(res.message);
    else if (res.status === 'ok') toast('AI review done: '+res.marks+' marks, '+res.suggestions+' suggestions');
    else toast('AI review finished');
    if (res.status === 'ok') await loadAll();
  } catch(e){ toast('AI review failed'); }
  finally { btn.disabled = false; btn.textContent = label; }
}

function isAuto(ann){ return ann.type === 'literacy_code'; }
function markCategory(ann){ return CAT[ann.metadata && ann.metadata.category] || 'grammar'; }

function renderEssay(){
  const text = review.pad.plain_text || '';
  const spans = [];
  for (const ann of review.annotations){
    if (ann.start_offset == null || ann.end_offset == null) continue;
    if (ann.type === 'literacy_code') spans.push({ s:ann.start_offset, e:ann.end_offset, cls:markCategory(ann), tip:CAT_LABEL[ann.metadata.category]||'Grammar', kind:'lit', id:ann.id, sug:ann.metadata.suggestion_id });
    else if (ann.type === 'inline_comment') spans.push({ s:ann.start_offset, e:ann.end_offset, cls:'comment', tip:'Comment', kind:'comment', id:ann.id });
  }
  for (const c of contested) spans.push({ s:c.start_offset, e:c.end_offset, cls:'contested', tip:'Needs your decision', kind:'contested', id:c.id });
  const valid = spans.filter(sp => Number.isInteger(sp.s) && Number.isInteger(sp.e) && sp.e > sp.s);
  // Segment rendering: split the text at every mark boundary so overlapping
  // marks all show. Each segment carries ALL marks covering it; the widest is
  // the outer underline, the narrowest is the inner (word-level) mark, which
  // gets the background wash. A lone mark renders as a plain single underline.
  const bounds = new Set([0, text.length]);
  for (const sp of valid){ bounds.add(sp.s); bounds.add(sp.e); }
  const cuts = [...bounds].filter(b => b >= 0 && b <= text.length).sort((a,b)=>a-b);
  const openTag = (m, cls) =>
    '<span class="mk '+m.cls+cls+'" data-kind="'+m.kind+'" data-id="'+m.id+'"'+(m.sug?(' data-sug="'+m.sug+'"'):'')+'>';
  let html = '';
  for (let i=0; i<cuts.length-1; i++){
    const a = cuts[i], b = cuts[i+1];
    if (b <= a) continue;
    const piece = esc(text.slice(a, b));
    // Widest first = outermost; narrowest last = innermost.
    const covering = valid.filter(m => m.s <= a && m.e >= b).sort((x,y)=> (y.e-y.s) - (x.e-x.s));
    if (!covering.length){ html += piece; continue; }
    const layered = covering.length >= 2;
    let seg = '';
    covering.forEach((m, idx) => {
      const innermost = idx === covering.length-1;
      let cls = '';
      if (layered && !innermost) cls += ' stack-outer';
      if (layered && innermost) cls += ' wash';
      seg += openTag(m, cls);
    });
    seg += piece;
    if (layered){
      const labels = covering.map(m => m.tip).filter(Boolean);
      seg += '<span class="tip">'+esc(labels.join(' · '))+'</span>';
    } else {
      seg += '<span class="tip">'+esc(covering[0].tip)+'</span>';
    }
    seg += covering.map(()=>'</span>').join('');
    html += seg;
  }
  const elx = document.getElementById('essay');
  elx.innerHTML = html;
  elx.onmouseup = onSelectText;
  // Click a placed literacy mark to change its code in place.
  elx.onclick = (e)=>{
    if (String(window.getSelection())) return;
    const mk = e.target.closest('.mk[data-kind="lit"]');
    if (!mk) return;
    const ann = review.annotations.find(a=> String(a.id) === mk.dataset.id);
    if (ann) openCodeChanger(ann, mk);
  };
}

const ALL_CODES = [['Sp','Spelling'],['Caps','Capital letter'],['P','Punctuation'],['^','Missing word'],['Exp','Expression'],['Gra','Grammar'],['Embed','Quotation embedding'],['AA/Adj','Adjective form'],['STR','Sentence structure'],['FOR','Formatting'],['WO','Word order'],['WW','Wrong word'],['V','Verb formation'],['VT','Verb tense'],['del','Delete word'],['inc','Incomplete sentence'],['RO','Run-on sentence'],['Rep','Repetition'],['MT','Mistranslated name or saying'],['✓','Good work'],['//','New paragraph']];
const CODE_CAT = (code)=>{
  if (['Sp','Caps','^','WW','AA/Adj','Rep'].includes(code)) return 'surface';
  if (['Gra','VT','V','WO','del','inc','RO','STR','Exp','MT'].includes(code)) return 'grammar';
  if (['P','FOR','//','Embed'].includes(code)) return 'format';
  if (code === '✓') return 'positive';
  return 'other';
};

function openCodeChanger(ann, anchor){
  document.querySelectorAll('.code-pop').forEach(p=>p.remove());
  const pop = el('div','code-pop');
  const sel = document.createElement('select');
  for (const [code,label] of ALL_CODES){
    const opt = document.createElement('option');
    opt.value = code; opt.textContent = code+' · '+label;
    if (code === (ann.metadata && ann.metadata.code)) opt.selected = true;
    sel.appendChild(opt);
  }
  const save = el('button','btn sm'); save.textContent='Save';
  const cancel = el('button','btn sm'); cancel.textContent='✕';
  save.onclick = async ()=>{
    const code = sel.value;
    const label = (ALL_CODES.find(c=>c[0]===code)||[code,code])[1];
    await api('/api/native/annotations/'+ann.id, { method:'PATCH',
      body:{ metadata: Object.assign({}, ann.metadata, { code, category: CODE_CAT(code), label }) } });
    pop.remove(); toast('Code changed to '+code); await loadAll();
  };
  cancel.onclick = ()=> pop.remove();
  const quoteEl = el('span','code-pop-quote'); quoteEl.textContent = '"'+(ann.selected_text||'').slice(0,40)+'"';
  pop.append(quoteEl, sel, save, cancel);
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.min(window.innerWidth - pop.offsetWidth - 12, Math.max(8, r.left + window.scrollX)) + 'px';
  pop.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function renderRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  const impl = cardImplementation();
  if (impl) rail.appendChild(impl);
  rail.appendChild(cardAutoMarked());
  rail.appendChild(cardNeedsYou());
  rail.appendChild(cardStrengthsTargets());
  rail.appendChild(cardRubric());
}

// Green-pen verdict card, only on scored rewrite pads: did the student act
// on the feedback or just shuffle words?
function cardImplementation(){
  const s = review.implementation_score;
  if (!s) return null;
  const card = el('div','card');
  const verdict = s.meaningful ? 'Meaningful revision' : 'Mostly cosmetic revision';
  const tone = s.meaningful ? 'var(--green-700)' : 'var(--maroon-500)';
  const head = el('header');
  head.innerHTML = '<strong>Green pen result</strong><span class="count" style="color:'+tone+'">'+verdict+'</span>';
  card.appendChild(head);
  const body = el('div','body');
  const bits = [];
  if (s.codes_total) bits.push('codes fixed <b>'+s.codes_addressed+' / '+s.codes_total+'</b>');
  if (s.targets_total) bits.push('targets acted on <b>'+s.targets_addressed+' / '+s.targets_total+'</b>');
  if (s.inline_comments_total) bits.push('comments addressed <b>'+s.inline_comments_addressed+' / '+s.inline_comments_total+'</b>');
  bits.push('cosmetic share <b>'+Math.round((s.cosmetic_ratio ?? 0)*100)+'%</b>');
  const line = el('div'); line.style.fontSize='12.5px'; line.innerHTML = bits.join(' &middot; ');
  body.appendChild(line);
  if (s.summary){ const p = el('div'); p.style.cssText='font-size:12px;color:var(--text-2);margin-top:6px'; p.textContent = s.summary; body.appendChild(p); }
  if (s.original_pad_id){
    const a = el('a'); a.className='btn sm'; a.style.marginTop='8px'; a.href='/teacher/native-review?pad_id='+s.original_pad_id; a.textContent='Open original';
    body.appendChild(a);
  }
  card.appendChild(body);
  return card;
}

function cardAutoMarked(){
  const auto = review.annotations.filter(isAuto);
  const groups = {};
  for (const ann of auto){ const code = ann.metadata.code || '?'; (groups[code] = groups[code] || { code, cat:markCategory(ann), label:ann.metadata.label||code, items:[] }).items.push(ann); }
  const ordered = Object.values(groups).sort((a,b)=> b.items.length - a.items.length);
  const card = el('div','card');
  const head = el('header'); head.innerHTML = '<strong>Auto-marked</strong><span class="count">'+auto.length+' marks</span><span class="spacer" style="flex:1"></span>';
  const showBtn = el('button','btn sm'); showBtn.textContent='Show in text';
  showBtn.onclick = ()=>{ auto.forEach((a,i)=> setTimeout(()=>flashMark(a.id), i*90)); };
  head.appendChild(showBtn); card.appendChild(head);
  const body = el('div','body');
  for (const g of ordered){
    const row = el('div','grp');
    row.innerHTML = '<span class="cc '+g.cat+'">'+esc(g.code)+'</span><span class="lbl">'+esc(g.label)+'</span><span class="n">'+g.items.length+'</span><span class="x">review</span>';
    const marks = el('div','grpmarks'); marks.style.display='none';
    g.items.forEach((ann)=>{
      const m = el('div','grpmark');
      m.innerHTML = '<span class="q">'+esc(ann.selected_text||'')+'</span>';
      const walk = el('button','btn sm'); walk.textContent='find'; walk.onclick=(ev)=>{ ev.stopPropagation(); flashMark(ann.id); };
      const dis = el('button','btn sm'); dis.textContent='✕ disagree'; dis.onclick=(ev)=>{ ev.stopPropagation(); disagreeMark(ann); };
      m.append(walk, dis); marks.appendChild(m);
    });
    let cyc = 0;
    row.onclick = ()=>{ marks.style.display = marks.style.display==='none'?'grid':'none'; if(g.items.length){ flashMark(g.items[cyc % g.items.length].id); cyc++; } };
    body.append(row, marks);
  }
  card.appendChild(body);
  const note = el('div','autonote'); note.textContent = 'Both models agreed on these at 75%+ confidence, so they are already live marks. Click a group to walk its spans in the text; disagree on any one to retract it.';
  card.appendChild(note);
  return card;
}

function cardNeedsYou(){
  const card = el('div','card');
  const head = el('header'); head.innerHTML = '<strong>Needs you</strong><span class="count'+(contested.length?' warn':'')+'">'+contested.length+'</span>';
  card.appendChild(head);
  const body = el('div','body');
  if (!contested.length){ const n=el('div','autonote'); n.style.padding='0'; n.textContent='Nothing contested. Everything is decided.'; body.appendChild(n); }
  else {
    const c = contested[0];
    let checker = {}; try { checker = JSON.parse(c.checker_json||'{}'); } catch(_){}
    const cst = el('div','cst');
    cst.innerHTML = '<div class="q">"'+esc(c.quote)+'" <span class="count">'+esc(c.code)+'</span></div>'+
      '<div class="why">Checker unsure ('+(checker.confidence!=null?checker.confidence:'?')+')'+(checker.note?': '+esc(checker.note):'')+'</div>';
    const acts = el('div','acts');
    const keep = el('button','btn sm'); keep.textContent='✓ Keep '+c.code; keep.onclick=()=>resolveContested(c,'keep');
    const change = el('button','btn sm'); change.textContent='Change code'; change.onclick=()=>resolveContested(c,'change');
    const no = el('button','btn sm'); no.textContent='✕ Not an error'; no.onclick=()=>resolveContested(c,'reject');
    acts.append(keep,change,no); cst.appendChild(acts); body.appendChild(cst);
    if (contested.length>1){ const more=el('div','autonote'); more.style.padding='0'; more.textContent='+ '+(contested.length-1)+' more after this one'; body.appendChild(more); }
    body.tabIndex = 0;
    body.onkeydown = (e)=>{ if(e.key==='a'||e.key==='A') resolveContested(c,'keep'); if(e.key==='d'||e.key==='D') resolveContested(c,'reject'); };
  }
  card.appendChild(body);
  return card;
}

function cardStrengthsTargets(){
  const card = el('div','card');
  const head = el('header'); head.innerHTML = '<strong>Strengths and targets</strong><span class="count">AI suggests '+fbSuggestions.length+'</span>';
  card.appendChild(head);
  const body = el('div','body');
  // Feedback bank switcher: which uploaded table(s) the AI draws from for this
  // essay. Persists per pad via applied-feedback-table; reloads so the AI
  // suggestions re-run against the chosen bank.
  const tables = review.feedback_tables || [];
  if (tables.length){
    const pick = el('div','addrow'); pick.style.marginBottom='10px';
    const lbl = document.createElement('label'); lbl.textContent='Feedback bank'; lbl.style.cssText='font-size:12px;color:var(--text-2)';
    const sel = document.createElement('select');
    for (const t of tables){ const o=document.createElement('option'); o.value=t.id; o.textContent=t.title; if(t.id===review.applied_feedback_table) o.selected=true; sel.appendChild(o); }
    const allOpt = document.createElement('option'); allOpt.value='all'; allOpt.textContent='All tables'; if(review.applied_feedback_table==='all') allOpt.selected=true; sel.appendChild(allOpt);
    sel.onchange = async ()=>{ await api('/api/native/pads/'+padId+'/applied-feedback-table', { method:'PUT', body:{ table: sel.value } }); toast('Feedback bank set'); await loadAll(); };
    pick.append(lbl, sel); body.appendChild(pick);
  }
  for (const sug of fbSuggestions){
    const div = el('div','sug');
    div.innerHTML = '<strong>'+(sug.kind==='target'?'Target':'Strength')+' · '+esc(sug.title)+'</strong><p>'+esc(sug.explanation||'')+'</p>';
    const acts = el('div','acts');
    const use = el('button','btn sm'); use.textContent='✓ Use'; use.onclick=()=>acceptSuggestion(sug);
    const edit = el('button','btn sm'); edit.textContent='Edit'; edit.onclick=()=>editSuggestion(sug);
    const rej = el('button','btn sm'); rej.textContent='✕'; rej.onclick=()=>rejectSuggestion(sug);
    acts.append(use,edit,rej); div.appendChild(acts); body.appendChild(div);
  }
  const items = [].concat(review.feedback.strengths.map(x=>['s',x]), review.feedback.targets.map(x=>['t',x]));
  for (const [k,item] of items){
    const div = el('div','fb '+k);
    div.innerHTML = '<div class="hd"><strong>'+esc(item.title)+'</strong><button class="del" title="Remove">✕</button></div>'+
      '<p>'+(item.source==='ai'?'AI':'Added by you')+(item.try_now_prompt?' · Try now: '+esc(item.try_now_prompt):'')+'</p>';
    div.querySelector('.del').onclick = ()=>deleteFeedback(item);
    body.appendChild(div);
  }
  const add = el('div','addrow');
  add.innerHTML = '<select id="fbKind"><option value="target">Target</option><option value="strength">Strength</option></select>'+
    '<input id="fbTitle" placeholder="Title (e.g. Fix run-on sentences)">'+
    '<textarea id="fbExpl" placeholder="Explanation (optional)"></textarea>'+
    '<button class="btn sm" id="fbAdd">Add</button>';
  body.appendChild(add);
  card.appendChild(body);
  setTimeout(()=>{ const b=document.getElementById('fbAdd'); if(b) b.onclick=addFeedback; },0);
  return card;
}

// Every loaded rubric kind that carries criteria gets a scorable tab. Order:
// internal, secondary, exam (AP). Exam only when the class is AP Lang.
function rubricTabs(){
  const list = [];
  if (review.rubric && review.rubric.criteria && review.rubric.criteria.length)
    list.push({ kind:'internal', label: review.rubric.name || 'Rubric 1', data: review.rubric, endpoint:'rubric-scores' });
  if (review.secondary_rubric && review.secondary_rubric.criteria && review.secondary_rubric.criteria.length)
    list.push({ kind:'secondary', label: review.secondary_rubric.name || 'Rubric 2', data: review.secondary_rubric, endpoint:'secondary-rubric-scores' });
  if (review.exam_rubric && review.exam_rubric.visible && review.exam_rubric.criteria && review.exam_rubric.criteria.length)
    list.push({ kind:'exam', label: review.exam_rubric.name || 'AP Lang', data: review.exam_rubric, endpoint:'exam-rubric-scores' });
  return list;
}

function cardRubric(){
  const card = el('div','card');
  const list = rubricTabs();
  if (!list.length) return card;
  if (!list.some(t=>t.kind===activeRubric)) activeRubric = list[0].kind;
  const tabs = el('div','rtabs');
  for (const t of list){
    const tab = el('button','rtab'+(activeRubric===t.kind?' on':''));
    tab.textContent = t.label;
    tab.onclick=()=>{ activeRubric=t.kind; renderRail(); };
    tabs.appendChild(tab);
  }
  card.appendChild(tabs);
  const rub = (list.find(t=>t.kind===activeRubric) || list[0]).data;
  const scores = new Map((rub.scores||[]).map(s=>[s.criterion_id, s.selected_score]));
  const body = el('div','body');
  for (const crit of rub.criteria){
    const max = Math.max.apply(null, crit.bands.map(b=>b.score_value).concat([5]));
    const min = Math.min.apply(null, crit.bands.map(b=>b.score_value).concat([1]));
    const cur = scores.has(crit.id) ? scores.get(crit.id) : null;
    const c = el('div','crit');
    const nm = el('div','nm'); nm.innerHTML = '<span>'+esc(crit.label)+'</span><b>'+(cur!=null?fmt(cur)+' / '+max:'—')+'</b>';
    c.appendChild(nm);
    const scale = el('div','scale');
    for (let v = min; v <= max; v += 0.5){
      const isHalf = (v % 1) !== 0;
      const pt = el('div','pt'+(isHalf?' half':'')+(cur===v?' sel':''));
      if (!isHalf) pt.textContent = v;
      pt.onclick = ()=>setScore(crit.id, v);
      scale.appendChild(pt);
    }
    c.appendChild(scale);
    const band = crit.bands.find(b=>b.score_value===Math.round(cur)) || crit.bands.find(b=>b.descriptor);
    if (band && band.descriptor){
      const desc = el('div','desc');
      const short = band.descriptor.length>70 ? band.descriptor.slice(0,70)+'… ' : band.descriptor+' ';
      desc.innerHTML = esc(short)+'<a>full band text</a>';
      desc.querySelector('a').onclick=(e)=>{ e.preventDefault(); desc.textContent = band.descriptor; };
      c.appendChild(desc);
    }
    body.appendChild(c);
  }
  card.appendChild(body);
  return card;
}

function fmt(n){ return Number.isInteger(n)? String(n) : n.toFixed(1); }
function el(tag, cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }

function flashMark(annId){
  const span = document.querySelector('.mk[data-id="'+annId+'"][data-kind="lit"]');
  if (!span) return;
  span.scrollIntoView({ behavior:'smooth', block:'center' });
  span.classList.add('flash'); setTimeout(()=>span.classList.remove('flash'), 1200);
}

async function disagreeMark(ann){
  const sug = ann.metadata && ann.metadata.suggestion_id;
  if (!sug){ toast('This mark has no AI record to retract'); return; }
  await api('/api/native/pads/'+padId+'/suggestions/'+sug+'/disagree', { method:'POST' });
  toast('Mark retracted'); await loadAll();
}
async function resolveContested(c, action){
  if (action==='keep') await api('/api/native/pads/'+padId+'/suggestions/'+c.id+'/accept', { method:'POST' });
  else if (action==='reject') await api('/api/native/pads/'+padId+'/suggestions/'+c.id+'/disagree', { method:'POST' });
  else if (action==='change'){ if(!confirm('Keep this mark? Change the code from the mark once it is placed.')) return; await api('/api/native/pads/'+padId+'/suggestions/'+c.id+'/accept', { method:'POST' }); }
  toast('Decision saved'); await loadAll();
}
async function acceptSuggestion(sug){ await api('/api/native/pads/'+padId+'/feedback-suggestions/'+sug.id+'/accept', { method:'POST' }); toast('Added'); await loadAll(); }
async function rejectSuggestion(sug){ await api('/api/native/pads/'+padId+'/feedback-suggestions/'+sug.id+'/reject', { method:'POST' }); toast('Rejected'); await loadAll(); }
async function editSuggestion(sug){
  const title = prompt('Edit title', sug.title); if(title==null) return;
  await api('/api/native/pads/'+padId+'/feedback-items', { method:'POST', body:{ kind:sug.kind, title, explanation:sug.explanation, try_now_prompt:sug.try_now_prompt, source:'ai' } });
  await api('/api/native/pads/'+padId+'/feedback-suggestions/'+sug.id+'/reject', { method:'POST' });
  toast('Saved'); await loadAll();
}
async function addFeedback(){
  const kind = document.getElementById('fbKind').value;
  const title = document.getElementById('fbTitle').value.trim();
  const explanation = document.getElementById('fbExpl').value.trim();
  if (!title){ toast('Title needed'); return; }
  await api('/api/native/pads/'+padId+'/feedback-items', { method:'POST', body:{ kind, title, explanation } });
  toast('Added'); await loadAll();
}
async function deleteFeedback(item){ await api('/api/native/pads/'+padId+'/feedback-items/'+item.id, { method:'DELETE' }); toast('Removed'); await loadAll(); }
async function setScore(criterionId, value){
  const tab = rubricTabs().find(t=>t.kind===activeRubric);
  const endpoint = tab ? tab.endpoint : 'rubric-scores';
  await api('/api/native/pads/'+padId+'/'+endpoint, { method:'PUT', body:{ scores:[{ criterion_id:criterionId, selected_score:value }] } });
  review = await api('/api/native/pads/'+padId+'/review');
  contested = (review.suggestions||[]).filter(s=>s.status==='pending');
  renderRail();
}
// Per-student early release: only meaningful on batch assignments that are
// marked but not yet released to the class.
function renderSendFeedback(){
  const btn = document.getElementById('sendFeedbackBtn');
  const marked = ['marked','green_pen_open','resubmitted'].includes(review.pad.state);
  const held = review.assignment.feedback_release === 'batch' && !review.assignment.feedback_released_at;
  if (!marked || !held){ btn.style.display = 'none'; return; }
  btn.style.display = '';
  if (review.pad_feedback_released_at){
    btn.textContent = 'Feedback sent';
    btn.disabled = true;
    return;
  }
  btn.textContent = 'Send feedback';
  btn.disabled = false;
  btn.onclick = async ()=>{
    if(!confirm('Send feedback to this student now, before the class release?')) return;
    await api('/api/native/pads/'+padId+'/release-feedback', { method:'POST' });
    toast('Feedback sent to student');
    review.pad_feedback_released_at = new Date().toISOString();
    renderSendFeedback();
  };
}

async function finishMarking(){
  await api('/api/native/pads/'+padId+'/finish-marking', { method:'POST' });
  toast('Marking finished');
  const withPad = queue.filter(q=>q.pad_id);
  const idx = withPad.findIndex(q=>String(q.pad_id)===String(padId));
  const next = withPad.slice(idx+1).find(q=>!isDone(q.status));
  if (next) setTimeout(()=>location.href='/teacher/native-review?pad_id='+next.pad_id, 700);
  else setTimeout(loadAll, 500);
}

let pendingSel = null;
// On mouseup show a small toolbar NEAR the selection without touching the
// selection or focus, so highlight-to-copy (Cmd/Ctrl+C) keeps working. The
// teacher then chooses Comment or Mark error from the toolbar.
function onSelectText(){
  const sel = window.getSelection();
  const essay = document.getElementById('essay');
  if (!sel || sel.isCollapsed || !essay.contains(sel.anchorNode)){ closeSelBar(); return; }
  const range = sel.getRangeAt(0);
  const offsets = offsetsWithin(essay, range);
  if (offsets == null || offsets.start === offsets.end){ closeSelBar(); return; }
  pendingSel = offsets;
  const rect = range.getBoundingClientRect();
  const bar = document.getElementById('selBar');
  document.getElementById('selCode').style.display = 'none';
  bar.style.left = Math.min(rect.left, window.innerWidth-220)+'px';
  bar.style.top = (rect.bottom+8)+'px';
  bar.classList.add('open');
}
function closeSelBar(){ document.getElementById('selBar').classList.remove('open'); document.getElementById('selCode').style.display='none'; }
function closePop(){ document.getElementById('commentPop').classList.remove('open'); pendingSel=null; }
// Toolbar: Comment opens the existing comment popover for the stored selection.
document.getElementById('selComment').onmousedown = (e)=>{ e.preventDefault(); };
document.getElementById('selComment').onclick = ()=>{
  if (!pendingSel) return;
  const bar = document.getElementById('selBar');
  const pop = document.getElementById('commentPop');
  pop.style.left = bar.style.left; pop.style.top = bar.style.top;
  closeSelBar();
  pop.classList.add('open');
  const ta = document.getElementById('commentText'); ta.value=''; ta.focus();
};
// Mark error reveals a code dropdown; picking a code tags the selection as a
// literacy_code annotation (source teacher) for a mistake the marking missed.
document.getElementById('selMark').onmousedown = (e)=>{ e.preventDefault(); };
document.getElementById('selMark').onclick = ()=>{
  const codeSel = document.getElementById('selCode');
  if (!codeSel.options.length){
    codeSel.appendChild(new Option('Pick a code…', ''));
    for (const [code,label] of ALL_CODES) codeSel.appendChild(new Option(code+' · '+label, code));
  }
  codeSel.value = '';
  codeSel.style.display = codeSel.style.display==='none' ? '' : 'none';
};
document.getElementById('selCode').onchange = async ()=>{
  const code = document.getElementById('selCode').value;
  if (!code || !pendingSel) return;
  const label = (ALL_CODES.find(c=>c[0]===code)||[code,code])[1];
  const sel = pendingSel;
  closeSelBar();
  await api('/api/native/pads/'+padId+'/annotations', { method:'POST', body:{
    type:'literacy_code', start_offset:sel.start, end_offset:sel.end, selected_text:sel.text,
    metadata:{ code, category:CODE_CAT(code), label, source:'teacher' }, document_version:review.pad.version } });
  toast('Marked '+code); await loadAll();
};
function offsetsWithin(container, range){
  const pre = document.createRange(); pre.selectNodeContents(container); pre.setEnd(range.startContainer, range.startOffset);
  const start = pre.toString().length;
  const end = start + range.toString().length;
  return { start, end, text: range.toString() };
}
document.getElementById('commentSave').onclick = async ()=>{
  if (!pendingSel) return;
  const body = document.getElementById('commentText').value.trim();
  if (!body){ toast('Write a comment'); return; }
  await api('/api/native/pads/'+padId+'/annotations', { method:'POST', body:{ type:'inline_comment', body, start_offset:pendingSel.start, end_offset:pendingSel.end, selected_text:pendingSel.text, document_version:review.pad.version } });
  closePop(); toast('Comment saved'); await loadAll();
};
document.addEventListener('mousedown', (e)=>{
  const pop=document.getElementById('commentPop'); if(pop.classList.contains('open') && !pop.contains(e.target)) closePop();
  const bar=document.getElementById('selBar');
  if(bar.classList.contains('open') && !bar.contains(e.target) && !document.getElementById('essay').contains(e.target)) closeSelBar();
});
// The toolbar disappears when the selection collapses (click elsewhere in the
// text, arrow keys, etc).
document.addEventListener('selectionchange', ()=>{
  const bar=document.getElementById('selBar');
  if(!bar.classList.contains('open')) return;
  // Keep the bar while the teacher is picking a code (opening the native
  // select can collapse the text selection).
  if(document.getElementById('selCode').style.display !== 'none') return;
  const sel=window.getSelection();
  if(!sel || sel.isCollapsed) closeSelBar();
});

boot().catch(err=>{ console.error(err); document.getElementById('essay').innerHTML='<div class="loading">'+esc(err.message)+'</div>'; });
</script>
