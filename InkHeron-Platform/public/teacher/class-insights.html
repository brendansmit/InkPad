<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class insights · InkHeron</title>
<link rel="icon" href="/assets/InkHeron%20Logo.png">
<link rel="stylesheet" href="/assets/styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg)}
.appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 22px;background:rgba(247,246,242,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);flex-wrap:wrap}
.glyph{width:30px;height:30px;border-radius:9px;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;transform:rotate(-4deg)}
.who{font-family:var(--serif);font-size:16px;font-weight:600}
.crumb{color:var(--text-3);font-size:13px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 13px;border-radius:var(--r-sm);font-weight:800;font-size:12.5px;cursor:pointer;border:1.5px solid var(--border-2);background:var(--surface);color:var(--text);text-decoration:none}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px}
select{border:1.5px solid var(--border-2);border-radius:var(--r-sm);padding:7px 10px;font:inherit;font-size:13px;background:var(--surface);color:var(--text)}
.wrap{max-width:1240px;margin:0 auto;padding:18px 22px 70px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card)}
.card>header{display:flex;align-items:center;gap:8px;padding:12px 15px;border-bottom:1px solid var(--border)}
.card>header strong{font-size:13.5px}
.card>header .sub{color:var(--text-3);font-size:11.5px}
.body{padding:13px 15px}
.full{grid-column:1/-1}
.headline{grid-column:1/-1;display:grid;gap:8px}
.hstate{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--maroon-500);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:12px 16px;font-size:15px}
.hstate b{font-family:var(--serif);font-size:17px}
.hstate.good{border-left-color:var(--green-500)}
.stats{display:flex;gap:10px;grid-column:1/-1;flex-wrap:wrap}
.stat{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:12px 15px}
.stat b{display:block;font-size:21px;font-family:var(--serif)}
.stat span{font-size:11.5px;color:var(--text-2);font-weight:700}
.stat .raw{display:block;font-size:10.5px;color:var(--text-3);font-weight:600}
.erow{display:grid;grid-template-columns:60px 1fr 150px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.erow:last-child{border:none}
.erow .cc{font-family:var(--mono);font-size:11.5px;font-weight:800;cursor:help;border-bottom:1px dotted var(--text-3)}
.meter{height:10px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--maroon-500)}
.meter i.surface{background:var(--amber-700)}
.meter i.format{background:var(--blue-700)}
.affected{font-size:11.5px;color:var(--text-2);text-align:right}
.affected b{color:var(--maroon-500)}
.spark{display:flex;align-items:flex-end;gap:6px;height:66px;margin-top:4px}
.spark .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.spark .bar{width:100%;border-radius:4px 4px 0 0;background:var(--green-500);min-height:2px}
.spark .bar.warn{background:var(--maroon-500)}
.spark .lb{font-size:9.5px;color:var(--text-3);font-family:var(--mono)}
.big{font-family:var(--serif);font-size:26px}
.mut{color:var(--text-3);font-size:12px}
.srow{display:grid;grid-template-columns:1fr 60px 90px 60px 70px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.srow:last-child{border:none}
.srow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .cc{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--maroon-500)}
.srow a{color:var(--blue-700);font-weight:800;text-decoration:none;font-size:11.5px}
.srow .num{font-variant-numeric:tabular-nums;text-align:right}
.mrow{display:grid;grid-template-columns:1fr 90px 60px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.mrow:last-child{border:none}
.mrow .d{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.mrow .d.over{color:var(--maroon-500)}
.mrow .d.under{color:var(--blue-700)}
.empty{color:var(--text-3);font-size:12.5px;padding:6px 0}
.loading{padding:60px;text-align:center;color:var(--text-3);grid-column:1/-1}
.thead{font-size:10.5px;font-weight:800;color:var(--text-3);text-transform:uppercase;letter-spacing:.03em}
</style>
  <meta name="theme-color" content="#246343">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InkHeron">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
<div class="appbar">
  <div class="glyph">i</div>
  <a class="btn sm" href="/teacher">← Dashboard</a>
  <span class="who" id="className">Class insights</span>
  <span class="crumb" id="crumb"></span>
  <span class="spacer"></span>
  <select id="classPicker" title="Switch class"></select>
</div>
<div class="wrap" id="wrap"><div class="loading">Loading class insights…</div></div>

<script>
const CATCOLOR = { surface:'surface', grammar:'', format:'format' };
let classes = [], data = null, classId = null;

function esc(s){ return String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function el(tag,cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }
function fmt(n){ return n==null?'—':(Number.isInteger(n)?String(n):Number(n).toFixed(1)); }

async function boot(){
  classId = new URLSearchParams(location.search).get('class_id');
  const me = await fetch('/api/me').then(r=>r.ok?r.json():null).catch(()=>null);
  if(!me || !me.user || me.user.type!=='teacher'){ location.href='/teacher-login'; return; }
  classes = (await fetch('/api/classes').then(r=>r.json()).catch(()=>({classes:[]}))).classes || [];
  if(!classId && classes.length) classId = classes[0].id;
  renderPicker();
  await load();
}

function renderPicker(){
  const sel = document.getElementById('classPicker');
  sel.innerHTML = classes.map(c=>'<option value="'+c.id+'"'+(String(c.id)===String(classId)?' selected':'')+'>'+esc(c.name)+'</option>').join('');
  sel.onchange = ()=>{ classId = sel.value; history.replaceState(null,'','/teacher/class-insights?class_id='+classId); load(); };
}

async function load(){
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = '<div class="loading">Loading…</div>';
  try {
    data = await fetch('/api/classes/'+encodeURIComponent(classId)+'/insights').then(r=>{ if(!r.ok) throw new Error('insights '+r.status); return r.json(); });
  } catch(e){ wrap.innerHTML = '<div class="loading">'+esc(e.message)+'</div>'; return; }
  render();
}

function render(){
  document.getElementById('className').textContent = data.class.name;
  document.getElementById('crumb').textContent = 'Class insights · '+data.class.student_count+' student'+(data.class.student_count===1?'':'s');
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = '';
  if(!data.class.student_count){ wrap.innerHTML = '<div class="loading">No students in this class yet.</div>'; return; }
  wrap.appendChild(headline());
  wrap.appendChild(statsStrip());
  wrap.appendChild(recurringCard());
  wrap.appendChild(errTrendCard());
  wrap.appendChild(rubricCard());
  wrap.appendChild(greenPenCard());
  wrap.appendChild(markerCard());
  wrap.appendChild(perStudentCard());
}

function headline(){
  const box = el('div','headline');
  const total = data.class.student_count;
  const top = data.recurring_codes.filter(c=>c.students_affected>0).slice(0,3);
  if(!top.length){
    const s = el('div','hstate good');
    s.innerHTML = 'No open literacy issues across the class yet. Marks build these as you review essays.';
    box.appendChild(s);
    return box;
  }
  for(const c of top){
    const s = el('div','hstate');
    s.innerHTML = '<b>'+c.students_affected+' of '+total+'</b> students have open '+esc(c.label)+' ('+esc(c.code)+') issues';
    box.appendChild(s);
  }
  return box;
}

function statsStrip(){
  const strip = el('div','stats');
  strip.appendChild(stat(fmt(data.totals.err_per_100), 'class errors per 100 words', data.totals.errors+' marks across '+data.totals.words+' words'));
  const trendFirst = data.err_trend[0], trendLast = data.err_trend[data.err_trend.length-1];
  const dir = (trendFirst && trendLast) ? (trendLast.mean_err_per_100 < trendFirst.mean_err_per_100 ? 'improving' : trendLast.mean_err_per_100 > trendFirst.mean_err_per_100 ? 'rising' : 'steady') : '—';
  strip.appendChild(stat(dir, 'error-rate trend', trendFirst&&trendLast? (fmt(trendFirst.mean_err_per_100)+' → '+fmt(trendLast.mean_err_per_100)+' over '+data.err_trend.length+' essays') : 'needs more essays'));
  const gp = data.green_pen.fix_rate;
  strip.appendChild(stat(gp==null?'—':gp+'%', 'green-pen fix rate', data.green_pen.rewrites? (data.green_pen.fixed+' of '+data.green_pen.flagged+' items fixed') : 'no rewrites scored yet'));
  const r = data.rubric_trend;
  strip.appendChild(stat(r.length? fmt(r[r.length-1].avg_total) : '—', 'avg rubric (latest)', r.length? ('internal total, '+r.length+' assignments tracked') : 'no scores yet'));
  return strip;
}
function stat(big, label, raw){
  const s = el('div','stat');
  s.innerHTML = '<b>'+esc(big)+'</b><span>'+esc(label)+'</span><span class="raw">'+esc(raw)+'</span>';
  return s;
}

function recurringCard(){
  const card = el('div','card');
  card.innerHTML = '<header><strong>Recurring errors across the class</strong><span class="sub">students affected · rate per 100 words</span></header>';
  const body = el('div','body');
  const codes = data.recurring_codes.slice(0, 8);
  if(!codes.length){ body.innerHTML = '<div class="empty">No literacy issues recorded yet. They collect as you mark.</div>'; card.appendChild(body); return card; }
  const maxAffected = Math.max(1, ...codes.map(c=>c.students_affected));
  for(const c of codes){
    const row = el('div','erow');
    const pct = Math.round(c.students_affected / maxAffected * 100);
    row.innerHTML = '<span class="cc" title="'+esc(c.label)+'">'+esc(c.code)+'</span>'+
      '<div class="meter"><i class="'+(CATCOLOR[c.category]||'')+'" style="width:'+pct+'%"></i></div>'+
      '<span class="affected"><b>'+c.students_affected+'</b> / '+data.class.student_count+' students · '+fmt(c.per_100)+'/100</span>';
    body.appendChild(row);
  }
  card.appendChild(body);
  return card;
}

function errTrendCard(){
  const card = el('div','card');
  card.innerHTML = '<header><strong>Error rate over time</strong><span class="sub">class mean err/100 by essay order</span></header>';
  const body = el('div','body');
  const pts = data.err_trend;
  if(!pts.length){ body.innerHTML='<div class="empty">Needs at least one marked essay.</div>'; card.appendChild(body); return card; }
  const max = Math.max(1, ...pts.map(p=>p.mean_err_per_100));
  const spark = el('div','spark');
  pts.forEach(p=>{
    const col = el('div','col');
    col.innerHTML = '<div class="bar warn" style="height:'+Math.round(p.mean_err_per_100/max*100)+'%" title="'+fmt(p.mean_err_per_100)+'/100"></div><span class="lb">E'+p.essay_index+'</span>';
    spark.appendChild(col);
  });
  body.appendChild(spark);
  card.appendChild(body);
  return card;
}

function rubricCard(){
  const card = el('div','card');
  card.innerHTML = '<header><strong>Average rubric score over time</strong><span class="sub">internal total per assignment</span></header>';
  const body = el('div','body');
  const pts = data.rubric_trend;
  if(!pts.length){ body.innerHTML='<div class="empty">No rubric scores yet. Finish marking an assignment to start the trend.</div>'; card.appendChild(body); return card; }
  const max = Math.max(1, ...pts.map(p=>p.avg_total));
  const spark = el('div','spark');
  pts.forEach((p,i)=>{
    const col = el('div','col');
    col.innerHTML = '<div class="bar" style="height:'+Math.round(p.avg_total/max*100)+'%" title="'+esc(p.title)+': '+fmt(p.avg_total)+'"></div><span class="lb">'+(i+1)+'</span>';
    spark.appendChild(col);
  });
  body.appendChild(spark);
  const legend = el('div','mut'); legend.style.marginTop='6px';
  legend.textContent = pts[pts.length-1].title+' latest: '+fmt(pts[pts.length-1].avg_total)+' avg';
  body.appendChild(legend);
  card.appendChild(body);
  return card;
}

function greenPenCard(){
  const card = el('div','card');
  card.innerHTML = '<header><strong>Green-pen follow-through</strong><span class="sub">did students act on feedback in rewrites</span></header>';
  const body = el('div','body');
  if(!data.green_pen.rewrites){ body.innerHTML='<div class="empty">No rewrites have been scored yet. This fills in once students revise in green pen.</div>'; card.appendChild(body); return card; }
  body.innerHTML = '<div class="big">'+data.green_pen.fix_rate+'%</div><div class="mut">'+data.green_pen.fixed+' of '+data.green_pen.flagged+' flagged items fixed across '+data.green_pen.rewrites+' rewrites</div>';
  card.appendChild(body);
  return card;
}

function markerCard(){
  const card = el('div','card full');
  card.innerHTML = '<header><strong>Your marking vs the estimate</strong><span class="sub">mean gap between your score and the pre-mark estimate</span></header>';
  const body = el('div','body');
  if(!data.marker_profile.ready){
    body.innerHTML = '<div class="empty">This collects as you mark. It needs at least 10 scored criteria across the class (currently '+data.marker_profile.delta_count+').</div>';
    card.appendChild(body); return card;
  }
  const head = el('div','mrow thead'); head.innerHTML = '<span>Criterion</span><span>Mean gap</span><span class="d">n</span>'; body.appendChild(head);
  for(const r of data.marker_profile.rows){
    const row = el('div','mrow');
    const cls = r.mean_delta>0?'over':r.mean_delta<0?'under':'';
    const sign = r.mean_delta>0?'+':'';
    row.innerHTML = '<span>'+esc(r.label)+' <span class="mut">('+esc(r.rubric_kind)+')</span></span><span class="d '+cls+'">'+sign+fmt(r.mean_delta)+'</span><span class="d">'+r.count+'</span>';
    body.appendChild(row);
  }
  const note = el('div','mut'); note.style.marginTop='6px';
  note.textContent = 'Positive means you scored higher than the estimate, negative means lower.';
  body.appendChild(note);
  card.appendChild(body);
  return card;
}

function perStudentCard(){
  const card = el('div','card full');
  card.innerHTML = '<header><strong>Students</strong><span class="sub">jump to any profile</span></header>';
  const body = el('div','body');
  const head = el('div','srow thead');
  head.innerHTML = '<span>Name</span><span class="num">Essays</span><span class="num">Err/100</span><span>Top code</span><span></span>';
  body.appendChild(head);
  for(const s of data.per_student){
    const row = el('div','srow');
    row.innerHTML = '<span class="nm">'+esc(s.display_name)+'</span>'+
      '<span class="num">'+s.essays+'</span>'+
      '<span class="num">'+(s.err_per_100_latest==null?'—':fmt(s.err_per_100_latest))+'</span>'+
      '<span>'+(s.top_code?'<span class="cc">'+esc(s.top_code)+'</span>':'<span class="mut">—</span>')+'</span>'+
      '<a href="/teacher/student-profile?student_id='+s.student_id+'">Profile →</a>';
    body.appendChild(row);
  }
  card.appendChild(body);
  return card;
}

boot().catch(err=>{ console.error(err); document.getElementById('wrap').innerHTML='<div class="loading">'+esc(err.message)+'</div>'; });
</script>
</body>
</html>
