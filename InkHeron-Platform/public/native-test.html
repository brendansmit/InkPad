<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test - InkHeron</title>
  <link rel="icon" href="/assets/InkHeron%20Logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    body{margin:0;font-family:var(--font);font-size:14px;line-height:1.55;color:var(--text);background:var(--bg)}*{box-sizing:border-box}.bar{position:sticky;top:0;z-index:30;display:flex;gap:14px;align-items:center;padding:13px 22px;background:rgba(247,246,242,.94);border-bottom:1px solid var(--border)}.glyph{width:32px;height:32px;border-radius:10px;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700}.sp{flex:1}.timer{font-weight:900;color:var(--maroon-500)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface);color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}.btn.p{background:var(--green-600);color:#fff;border-color:var(--green-600)}.wrap{max-width:920px;margin:0 auto;padding:28px 22px 84px}h1{font-family:var(--serif);font-size:32px;margin:0 0 6px;color:var(--ink)}.lead{color:var(--text-2);margin:0 0 18px}.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-card)}.passage{font-family:var(--serif);font-size:17px;line-height:1.7;white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:15px 16px;margin:10px 0 16px}.q{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}.q:first-of-type{border-top:0;padding-top:0}.option{display:flex;gap:8px;align-items:flex-start;padding:9px;border:1px solid var(--border);border-radius:var(--r-sm);margin:7px 0;background:#fff}.option input{margin-top:4px}textarea{width:100%;min-height:110px;border:1.5px solid var(--border-2);border-radius:var(--r-sm);padding:10px;font:inherit;background:#fff;color:var(--text)}.notice{background:var(--amber-50);border:1px solid var(--amber-100);border-radius:var(--r-sm);padding:10px;margin:12px 0;color:var(--amber-700)}.result{display:flex;justify-content:space-between;gap:14px;border-top:1px solid var(--border);padding:10px 0}.muted{color:var(--text-3)}@media(max-width:680px){.wrap{padding:22px 16px 70px}.bar{padding:12px 16px}}
  </style>
  <meta name="theme-color" content="#246343">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InkHeron">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <script src="/assets/pwa.js" defer></script>
</head>
<body>
  <div class="bar"><div class="glyph">i</div><strong>InkHeron</strong><span class="sp"></span><span class="timer" id="timer"></span><a class="btn" href="/student">Dashboard</a></div>
  <main class="wrap" id="root"><h1>Test</h1><p class="lead">Loading...</p></main>
  <script>
    const assignmentId=Number(location.pathname.split('/').pop());let csrfToken='',payload=null,blurCount=0,saveTimers={};
    async function boot(){const me=await fetch('/api/me');if(!me.ok){location.href='/login';return;}const u=await me.json();csrfToken=u.user.csrf_token;await load();}
    async function load(){const r=await fetch(`/api/tests/${assignmentId}/take`);if(!r.ok){root.innerHTML='<p class="notice">This test is not open.</p>';return;}payload=await r.json();if(!payload.attempt){renderStart();return;}if(payload.submitted){await renderSubmitted();return;}renderTake();startTimer();}
    function renderStart(){root.innerHTML=`<h1>${escapeHtml(payload.assignment.title)}</h1><p class="lead">Start when your teacher tells you to begin.</p><button class="btn p" id="startBtn" type="button">Start test</button>`;startBtn.onclick=start;}
    async function start(){await fetch(`/api/tests/${assignmentId}/start`,{method:'POST',headers:{'X-CSRF-Token':csrfToken}});await load();}
    function renderTake(){root.innerHTML=`<h1>${escapeHtml(payload.assignment.title)}</h1><p class="lead">Answer each section. Your short answers save as you type.</p><div id="warn"></div>${payload.sections.map(sectionHtml).join('')}<button class="btn p" id="submitBtn" type="button">Hand in</button>`;submitBtn.onclick=submit;window.onblur=()=>focusEvent('blur');window.onfocus=()=>focusEvent('focus');}
    function sectionHtml(s){return `<section class="section"><h2>${escapeHtml(s.title)}</h2>${s.passage_text?`<div class="passage">${escapeHtml(s.passage_text)}</div>`:''}${s.questions.map(questionHtml).join('')}</section>`;}
    function questionHtml(q){if(q.kind==='mcq')return `<div class="q"><strong>${escapeHtml(q.prompt_text)}</strong>${q.options.map(o=>`<label class="option"><input type="radio" name="q-${q.id}" value="${o.index}" ${q.response?.chosen_index===o.index?'checked':''} onchange="saveMcq(${q.id},${o.index})"><span>${escapeHtml(o.text)}</span></label>`).join('')}</div>`;if(q.kind==='srq')return `<div class="q"><strong>${escapeHtml(q.prompt_text)}</strong><textarea oninput="saveSrq(${q.id},this.value)">${escapeHtml(q.response?.text||'')}</textarea><div class="muted" id="saved-${q.id}"></div></div>`;return `<div class="q"><strong>${escapeHtml(q.prompt_text)}</strong><p><a class="btn" href="/native/write/${assignmentId}" target="_blank">Open writing page</a></p></div>`;}
    async function saveMcq(id,chosen){await fetch(`/api/tests/${assignmentId}/answers/${id}`,{method:'PUT',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({chosen_index:chosen})});}
    function saveSrq(id,text){clearTimeout(saveTimers[id]);saveTimers[id]=setTimeout(async()=>{const r=await fetch(`/api/tests/${assignmentId}/answers/${id}`,{method:'PUT',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({text})});document.getElementById('saved-'+id).textContent=r.ok?'Saved.':'Could not save.';},450);}
    async function focusEvent(kind){if(!payload?.focus_warning)return;await fetch(`/api/tests/${assignmentId}/focus-event`,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({kind})});if(kind==='blur'){blurCount+=1;warn.innerHTML=`<div class="notice">${blurCount===1?'Stay on the test page until you hand in.':'You left the test page again. Your teacher will see this.'}</div>`;}}
    async function submit(){if(!confirm('Hand in this test now?'))return;const r=await fetch(`/api/tests/${assignmentId}/submit`,{method:'POST',headers:{'X-CSRF-Token':csrfToken}});if(r.ok)await load();else root.insertAdjacentHTML('afterbegin','<div class="notice">This test can no longer be changed.</div>');}
    async function renderSubmitted(){let html=`<h1>${escapeHtml(payload.assignment.title)}</h1><p class="lead">Your test has been handed in.</p>`;const r=await fetch(`/api/tests/${assignmentId}/results`);if(r.ok){const d=await r.json();html+=`<section class="section"><h2>Results</h2>${d.sections.map(s=>`<div class="result"><span>${escapeHtml(s.title)}</span><strong>${s.earned} / ${s.possible}</strong></div>`).join('')}<div class="result"><span>Total</span><strong>${d.total.earned}</strong></div></section>`;}else{html+='<p class="notice">Results will show here after your teacher releases them.</p>';}root.innerHTML=html;}
    function startTimer(){if(!payload.attempt?.seconds_remaining)return;let left=payload.attempt.seconds_remaining;const tick=()=>{timer.textContent=left<=0?'Time is up':`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;left-=1;if(left>=0)setTimeout(tick,1000);};tick();}
    function escapeHtml(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
    boot();
  </script>
</body>
</html>
