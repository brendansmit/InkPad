<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test - InkHeron</title>
  <link rel="icon" href="/assets/InkHeron%20Logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    body{margin:0;font-family:var(--font);font-size:14px;line-height:1.55;color:var(--text);background:var(--bg)}
    *{box-sizing:border-box}.bar{position:sticky;top:0;z-index:40;display:flex;gap:14px;align-items:center;padding:13px 22px;background:rgba(247,246,242,.96);border-bottom:1px solid var(--border)}.glyph{width:32px;height:32px;border-radius:10px;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700}.sp{flex:1}.timer{font-weight:900;color:var(--maroon-500);font-variant-numeric:tabular-nums}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface);color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}.btn.p{background:var(--green-600);color:#fff;border-color:var(--green-600)}.btn.warn{background:var(--amber-50);border-color:var(--amber-100);color:var(--amber-700)}.btn:disabled{opacity:.55;cursor:default}
    .wrap{max-width:1160px;margin:0 auto;padding:24px 22px 84px}.exam-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}h1{font-family:var(--serif);font-size:32px;margin:0 0 6px;color:var(--ink)}h2{font-size:18px;margin:0 0 10px}.lead{color:var(--text-2);margin:0 0 18px}.panel,.section,.rules{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:18px;box-shadow:var(--shadow-card)}.panel{position:sticky;top:76px}.navmap{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.navbtn{height:34px;border-radius:9px;border:1.5px solid var(--border-2);background:#fff;color:var(--text);font-weight:900;cursor:pointer}.navbtn.current{background:var(--green-600);border-color:var(--green-600);color:#fff}.navbtn.answered{border-color:var(--green-600)}.navbtn.flagged{box-shadow:inset 0 0 0 2px var(--amber-100)}.legend{display:grid;gap:5px;margin-top:12px;color:var(--text-3);font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid var(--border-2);vertical-align:-1px}.dot.current{background:var(--green-600)}.dot.answered{background:#fff;border-color:var(--green-600)}.dot.flagged{background:var(--amber-50);border-color:var(--amber-100)}
    .section{margin-bottom:14px}.passage{font-family:var(--serif);font-size:17px;line-height:1.7;white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:15px 16px;margin:10px 0 16px}.q{border-top:1px solid var(--border);padding-top:16px;margin-top:16px;scroll-margin-top:92px}.q:first-of-type{border-top:0;padding-top:0}.q.active{outline:2px solid rgba(36,99,67,.18);outline-offset:8px}.qhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.qprompt{font-weight:900;white-space:pre-wrap}.qtools{display:flex;gap:7px;flex-wrap:wrap}.mini{font-size:12px;font-weight:800;color:var(--text-3)}.option{display:flex;gap:8px;align-items:flex-start;padding:9px;border:1px solid var(--border);border-radius:var(--r-sm);margin:7px 0;background:#fff}.option input{margin-top:4px}.srq-tools{display:flex;justify-content:space-between;gap:10px;margin:8px 0 4px}.srq-mini{width:100%;height:7.5em;max-height:7.5em;overflow:auto;border:1.5px solid var(--border-2);border-radius:var(--r-sm);padding:10px;font:inherit;background:#fff;color:var(--text);resize:vertical}.notice{background:var(--amber-50);border:1px solid var(--amber-100);border-radius:var(--r-sm);padding:10px;margin:12px 0;color:var(--amber-700)}.ok{background:var(--green-50);border:1px solid rgba(36,99,67,.22);border-radius:var(--r-sm);padding:10px;margin:12px 0;color:var(--green-700)}.result{display:flex;justify-content:space-between;gap:14px;border-top:1px solid var(--border);padding:10px 0}.muted{color:var(--text-3)}.rules{max-width:860px;margin:0 auto}.rules p{font-size:16px}.rules .cn{font-size:15px;color:var(--text-2)}.ack{display:flex;gap:9px;align-items:flex-start;margin:18px 0}.ack input{margin-top:4px}.warnbox{position:fixed;inset:74px 18px auto;z-index:80;max-width:720px;margin:0 auto;background:var(--amber-50);border:1.5px solid var(--amber-100);border-radius:var(--r-md);padding:14px 16px;color:var(--amber-700);box-shadow:0 12px 28px rgba(31,42,36,.16)}.pulse{animation:colorPulse 900ms ease-in-out 3}.blurred{filter:blur(5px);pointer-events:none;user-select:none}.overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(247,246,242,.82);padding:20px}.modal{max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:22px;box-shadow:0 22px 48px rgba(31,42,36,.2)}@keyframes colorPulse{0%,100%{background:var(--bg)}50%{background:#fff3c4}}@media(max-width:820px){.wrap{padding:20px 16px 70px}.bar{padding:12px 16px}.exam-grid{grid-template-columns:1fr}.panel{position:static}.navmap{grid-template-columns:repeat(8,1fr)}}@media(max-width:520px){.bar strong{display:none}.navmap{grid-template-columns:repeat(5,1fr)}}
  </style>
</head>
<body>
  <div class="bar"><div class="glyph">i</div><strong>InkHeron</strong><span class="sp"></span><span class="timer" id="timer"></span><button class="btn" id="fullscreenBtn" type="button" style="display:none">Full screen</button><a class="btn" href="/student">Dashboard</a></div>
  <main class="wrap" id="root"><h1>Test</h1><p class="lead">Loading...</p></main>
  <div id="overlay"></div>
  <script>
    const assignmentId=Number(location.pathname.split('/').pop());
    const rulesEn='I understand the academic integrity rules for this test. I will stay on the test screen, use only permitted materials and complete my own work without help from other people, websites, apps or AI tools. I understand that leaving the test screen, using outside help or breaking these rules may be recorded, reviewed by my teacher and may result in my test being invalidated or other academic consequences. I acknowledge these rules and agree to follow them.';
    const rulesZh='我理解本次测试的学术诚信规则。我会停留在测试页面，只使用允许的材料，并独立完成自己的作答，不接受他人、网站、应用程序或 AI 工具的帮助。我理解，如果我离开测试页面、使用外部帮助或违反这些规则，系统可能会记录相关行为，老师会进行审核，并且我的测试成绩可能会被取消，或产生其他学术后果。我确认已了解这些规则，并同意遵守。';
    let csrfToken='',payload=null,saveTimers={},timerHandle=null,secondsLeft=null,autosubmitting=false,submitReviewShown=false,fullscreenArmed=false,warningCount=0,currentKey='',activeQuestion=null,activeStarted=0,lastInputAt=0;
    const flagged=new Set(),durations=new Map(),warnedAt=new Set();

    async function boot(){
      const me=await fetch('/api/me');
      if(!me.ok){location.href='/login';return;}
      const u=await me.json();csrfToken=u.user.csrf_token;
      bindGuards();
      await load();
    }

    async function load(){
      const r=await fetch(`/api/tests/${assignmentId}/take`);
      if(!r.ok){root.innerHTML='<p class="notice">This test is not open.</p>';return;}
      payload=await r.json();
      if(payload.submitted){await renderSubmitted();return;}
      if(!payload.attempt||!payload.attempt.rules_acknowledged_at){renderRules();return;}
      renderTake();
      startTimer();
      armFullscreen();
    }

    function renderRules(){
      root.innerHTML=`<section class="rules"><h1>${escapeHtml(payload.assignment.title)}</h1><p class="lead">Read the rules before you begin.</p><p>${escapeHtml(rulesEn)}</p><p class="cn">${escapeHtml(rulesZh)}</p><label class="ack"><input id="ackBox" type="checkbox"><span>I acknowledge the rules and agree to follow them.</span></label><button class="btn p" id="ackBtn" type="button" disabled>Start test</button></section>`;
      ackBox.onchange=()=>{ackBtn.disabled=!ackBox.checked;};
      ackBtn.onclick=acknowledgeRules;
    }

    async function acknowledgeRules(){
      ackBtn.disabled=true;
      const r=await fetch(`/api/tests/${assignmentId}/acknowledge-rules`,{method:'POST',headers:{'X-CSRF-Token':csrfToken}});
      if(!r.ok){ackBtn.disabled=false;return;}
      await requestFullscreenSafe();
      await load();
    }

    function renderTake(){
      warningCount=0;
      const flat=flatQuestions();
      root.innerHTML=`<div class="exam-grid"><aside class="panel"><h2>Questions</h2><div class="navmap" id="navmap">${flat.map((item,i)=>navButton(item,i)).join('')}</div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot flagged"></i>Flagged</span></div><button class="btn p" id="submitBtn" type="button" style="width:100%;margin-top:14px">Submit</button><p class="muted" id="saveState"></p></aside><section><h1>${escapeHtml(payload.assignment.title)}</h1><p class="lead">Answer each section. Short answers save as you type.</p><div id="warn"></div>${payload.sections.map((s,si)=>sectionHtml(s,si)).join('')}</section></div>`;
      bindQuestionEvents();
      submitBtn.onclick=submitWithReview;
      fullscreenBtn.style.display='';
      fullscreenBtn.onclick=()=>requestFullscreenSafe();
    }

    function flatQuestions(){
      const list=[];
      (payload.sections||[]).forEach((section,sectionIndex)=>section.questions.forEach((question)=>list.push({section,sectionIndex,question})));
      return list;
    }
    function keyFor(question){return String(question.id);}
    function isAnswered(question){
      if(question.kind==='mcq')return Number.isInteger(Number(question.response?.chosen_index));
      if(question.kind==='srq')return Boolean(String(question.response?.text||'').trim());
      return false;
    }
    function navButton(item,index){
      const key=keyFor(item.question), answered=isAnswered(item.question), isFlagged=flagged.has(key);
      return `<button class="navbtn ${answered?'answered':''} ${isFlagged?'flagged':''}" data-nav="${key}" data-index="${index}" type="button">${index+1}</button>`;
    }
    function refreshNav(){
      const flat=flatQuestions();
      navmap.innerHTML=flat.map((item,i)=>navButton(item,i)).join('');
      navmap.querySelectorAll('[data-nav]').forEach(btn=>btn.onclick=()=>scrollToQuestion(btn.dataset.nav));
      if(currentKey){const btn=navmap.querySelector(`[data-nav="${CSS.escape(currentKey)}"]`);if(btn)btn.classList.add('current');}
    }
    function scrollToQuestion(key){
      const card=document.querySelector(`[data-qkey="${CSS.escape(key)}"]`);
      if(card){card.scrollIntoView({behavior:'smooth',block:'start'});card.focus({preventScroll:true});}
    }

    function sectionHtml(section,sectionIndex){
      return `<section class="section"><h2>${escapeHtml(section.title)}</h2>${section.passage_text?`<div class="passage">${escapeHtml(section.passage_text)}</div>`:''}${section.questions.map(q=>questionHtml(q,sectionIndex)).join('')}</section>`;
    }
    function questionHtml(q,sectionIndex){
      const key=keyFor(q);
      if(q.kind==='mcq')return `<article class="q" tabindex="-1" data-qkey="${key}" data-qid="${q.id}" data-section="${sectionIndex}"><div class="qhead"><div class="qprompt">${escapeHtml(q.prompt_text)}</div>${toolsHtml(key)}</div>${q.options.map(o=>`<label class="option"><input type="radio" name="q-${q.id}" value="${o.index}" ${q.response?.chosen_index===o.index?'checked':''} data-mcq="${q.id}" data-choice="${o.index}"><span>${escapeHtml(o.text)}</span></label>`).join('')}</article>`;
      if(q.kind==='srq')return `<article class="q" tabindex="-1" data-qkey="${key}" data-qid="${q.id}" data-section="${sectionIndex}"><div class="qhead"><div class="qprompt">${escapeHtml(q.prompt_text)}</div>${toolsHtml(key)}</div><div class="srq-tools"><span class="mini"><span id="words-${q.id}">${wordCount(q.response?.text||'')}</span> words</span><span class="mini" id="saved-${q.id}"></span></div><textarea class="srq-mini" data-srq="${q.id}" spellcheck="false">${escapeHtml(q.response?.text||'')}</textarea></article>`;
      return `<article class="q" tabindex="-1" data-qkey="${key}" data-qid="${q.id}" data-section="${sectionIndex}"><div class="qhead"><div class="qprompt">${escapeHtml(q.prompt_text)}</div>${toolsHtml(key)}</div><p><a class="btn p" href="/native/write/${assignmentId}?return=/native/test/${assignmentId}" target="_blank" rel="noopener" data-frq="${q.id}">Start FRQ</a></p><p class="muted">The essay opens in InkPad and autosaves as you write.</p></article>`;
    }
    function toolsHtml(key){return `<div class="qtools"><button class="btn" data-flag="${key}" type="button">${flagged.has(key)?'Unflag':'Flag for review'}</button></div>`;}

    function bindQuestionEvents(){
      refreshNav();
      document.querySelectorAll('.q').forEach(card=>{
        card.addEventListener('focusin',()=>activateQuestion(card));
        card.addEventListener('click',()=>activateQuestion(card));
      });
      document.querySelectorAll('[data-mcq]').forEach(input=>input.onchange=()=>saveMcq(Number(input.dataset.mcq),Number(input.dataset.choice),input.closest('.q')));
      document.querySelectorAll('[data-srq]').forEach(area=>{
        area.oninput=()=>{document.getElementById('words-'+area.dataset.srq).textContent=wordCount(area.value);saveSrq(Number(area.dataset.srq),area.value,area.closest('.q'));};
      });
      document.querySelectorAll('[data-flag]').forEach(button=>button.onclick=()=>toggleFlag(button.dataset.flag));
      document.querySelectorAll('[data-frq]').forEach(link=>link.onclick=()=>postActivity('question_focus',{question_id:Number(link.dataset.frq),metadata:{surface:'frq'}}));
    }

    function activateQuestion(card){
      const key=card.dataset.qkey;
      if(currentKey===key)return;
      closeActiveQuestion();
      currentKey=key;activeQuestion=card;activeStarted=Date.now();
      document.querySelectorAll('.q.active').forEach(el=>el.classList.remove('active'));
      card.classList.add('active');
      refreshNav();
      postActivity('question_focus',{question_id:Number(card.dataset.qid),section_index:Number(card.dataset.section)});
    }
    function closeActiveQuestion(){
      if(!activeQuestion||!activeStarted)return;
      const elapsed=Math.max(0,Math.round((Date.now()-activeStarted)/1000));
      const key=activeQuestion.dataset.qkey;
      if(elapsed>0&&elapsed<900){
        durations.set(key,(durations.get(key)||0)+elapsed);
        postActivity('question_time',{question_id:Number(activeQuestion.dataset.qid),section_index:Number(activeQuestion.dataset.section),metadata:{seconds:elapsed}});
      }
      activeQuestion=null;activeStarted=0;
    }

    async function saveMcq(id,chosen,card){
      if(card)activateQuestion(card);
      lastInputAt=Date.now();
      const r=await fetch(`/api/tests/${assignmentId}/answers/${id}`,{method:'PUT',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({chosen_index:chosen})});
      if(r.ok){markResponse(id,{chosen_index:chosen});saveState.textContent='Saved.';refreshNav();}
      else saveState.textContent='Could not save.';
    }
    function saveSrq(id,text,card){
      if(card)activateQuestion(card);
      lastInputAt=Date.now();
      clearTimeout(saveTimers[id]);
      saveTimers[id]=setTimeout(async()=>{
        const r=await fetch(`/api/tests/${assignmentId}/answers/${id}`,{method:'PUT',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({text})});
        document.getElementById('saved-'+id).textContent=r.ok?'Saved.':'Could not save.';
        if(r.ok){markResponse(id,{text});refreshNav();}
      },450);
    }
    function markResponse(id,response){
      for(const section of payload.sections)for(const question of section.questions)if(question.id===id)question.response=response;
    }
    function toggleFlag(key){
      const had=flagged.has(key);
      if(had)flagged.delete(key);else flagged.add(key);
      const card=document.querySelector(`[data-qkey="${CSS.escape(key)}"]`);
      postActivity(had?'unflag_review':'flag_review',{question_id:card?Number(card.dataset.qid):null});
      renderTake();
    }

    function startTimer(){
      clearInterval(timerHandle);
      secondsLeft=payload.attempt?.seconds_remaining;
      if(secondsLeft===null||secondsLeft===undefined){timer.textContent='';return;}
      tickTimer();
      timerHandle=setInterval(tickTimer,1000);
    }
    function tickTimer(){
      if(secondsLeft===null)return;
      timer.textContent=secondsLeft<=0?'Time is up':formatTime(secondsLeft);
      if([600,300,60].includes(secondsLeft)&&!warnedAt.has(secondsLeft)){warnedAt.add(secondsLeft);showWarning(`${Math.round(secondsLeft/60)} minute${secondsLeft===60?'':'s'} left. Please check your answers and keep going.`,false);}
      if(secondsLeft<=0&&!autosubmitting)beginAutosubmit();
      secondsLeft-=1;
    }
    function formatTime(total){const m=Math.floor(total/60),s=total%60;return `${m}:${String(s).padStart(2,'0')}`;}
    function beginAutosubmit(){
      autosubmitting=true;clearInterval(timerHandle);postActivity('autosubmit_warning',{metadata:{seconds:15}});
      let left=15;root.classList.add('blurred');
      overlay.innerHTML=`<div class="overlay"><div class="modal"><h2>Time is up</h2><p>Please finish your sentence. This test will submit in <strong id="autoCount">15</strong> seconds.</p></div></div>`;
      const h=setInterval(async()=>{left-=1;autoCount.textContent=String(left);if(left<=0){clearInterval(h);await submitNow(true);}},1000);
    }

    async function submitWithReview(){
      closeActiveQuestion();
      if(secondsLeft!==null&&secondsLeft>900&&!submitReviewShown){
        submitReviewShown=true;
        postActivity('manual_submit_prompt',{metadata:{seconds_left:secondsLeft}});
        const key=longestQuestionKey();
        alert('You still have more than 15 minutes. Please review your work first. I am taking you to the question you spent longest on.');
        if(key)scrollToQuestion(key);
        return;
      }
      if(!confirm('Are you sure? Once you submit, you cannot go back.'))return;
      await submitNow(false);
    }
    function longestQuestionKey(){
      closeActiveQuestion();
      let best='',bestSeconds=-1;
      for(const [key,value] of durations.entries())if(value>bestSeconds){best=key;bestSeconds=value;}
      return best||flatQuestions()[0]?.question?.id;
    }
    async function submitNow(auto){
      const r=await fetch(`/api/tests/${assignmentId}/submit`,{method:'POST',headers:{'X-CSRF-Token':csrfToken}});
      if(r.ok){overlay.innerHTML='';root.classList.remove('blurred');await load();}
      else if(!auto){root.insertAdjacentHTML('afterbegin','<div class="notice">This test can no longer be changed.</div>');}
    }

    async function postActivity(event_type,body={}){
      if(!payload?.attempt)return;
      try{await fetch(`/api/tests/${assignmentId}/activity`,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({event_type,...body})});}catch(_){}
    }

    function bindGuards(){
      document.addEventListener('fullscreenchange',()=>{
        if(!payload?.attempt||payload.submitted)return;
        if(document.fullscreenElement)postActivity('fullscreen_enter');
        else if(fullscreenArmed)integrityWarning('fullscreen_exit','You left full screen. Please stay on the test screen until you submit.');
      });
      document.addEventListener('visibilitychange',()=>{
        if(!payload?.attempt||payload.submitted)return;
        if(document.hidden)integrityWarning('visibility_hidden','You left the test tab. Please return to the test screen.');
        else requestFullscreenSafe();
      });
      window.addEventListener('blur',()=>{if(payload?.attempt&&!payload.submitted)integrityWarning('window_blur','Please stay on the test screen.');});
      window.addEventListener('focus',()=>{if(payload?.attempt&&!payload.submitted){postActivity('window_focus');requestFullscreenSafe();}});
      root.addEventListener('copy',event=>blockedEvent(event,'copy_attempt','Copying test questions is not allowed.'));
      root.addEventListener('paste',event=>blockedEvent(event,'paste_attempt','Pasting into this test is not allowed.'));
      root.addEventListener('contextmenu',event=>blockedEvent(event,'context_menu_attempt','Please use the test controls on this page.'));
      setInterval(()=>{if(payload?.attempt&&!payload.submitted&&lastInputAt&&Date.now()-lastInputAt>180000){lastInputAt=Date.now();postActivity('idle_timeout',{metadata:{seconds:180}});}},60000);
    }
    function blockedEvent(event,type,message){
      if(!payload?.attempt||payload.submitted)return;
      event.preventDefault();
      integrityWarning(type,message);
    }
    async function requestFullscreenSafe(){
      try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();}catch(_){}
    }
    function armFullscreen(){fullscreenArmed=true;requestFullscreenSafe();}
    function integrityWarning(type,message){
      warningCount+=1;
      postActivity(type,{question_id:activeQuestion?Number(activeQuestion.dataset.qid):null,metadata:{warning_number:warningCount}});
      showWarning(warningCount===1?message:`${message} This warning has been recorded.`,warningCount>1);
    }
    function showWarning(message,withSound){
      warn.innerHTML=`<div class="warnbox">${escapeHtml(message)}</div>`;
      document.body.classList.remove('pulse');void document.body.offsetWidth;document.body.classList.add('pulse');
      if(withSound&&!payload?.attempt?.sound_disabled)playTone();
      setTimeout(()=>{const box=document.querySelector('.warnbox');if(box)box.remove();},5200);
    }
    function playTone(){
      try{const ctx=new AudioContext();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.frequency.value=520;gain.gain.value=.08;osc.connect(gain);gain.connect(ctx.destination);osc.start();setTimeout(()=>{osc.stop();ctx.close();},360);}catch(_){}
    }

    async function renderSubmitted(){
      let html=`<h1>${escapeHtml(payload.assignment.title)}</h1><p class="lead">Your test has been submitted.</p>`;
      const r=await fetch(`/api/tests/${assignmentId}/results`);
      if(r.ok){const d=await r.json();html+=`<section class="section"><h2>Results</h2>${d.sections.map(s=>`<div class="result"><span>${escapeHtml(s.title)}</span><strong>${s.earned} / ${s.possible}</strong></div>`).join('')}<div class="result"><span>Total</span><strong>${d.total.earned}</strong></div></section>`;}
      else{html+='<p class="notice">Results will show here after your teacher releases them.</p>';}
      root.innerHTML=html;timer.textContent='';fullscreenBtn.style.display='none';
    }
    function wordCount(text){return String(text||'').trim().split(/\s+/).filter(Boolean).length;}
    function escapeHtml(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
    boot();
  </script>
</body>
</html>
