<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InkHeron — Change password</title>
  <link rel="icon" href="/assets/InkHeron%20Logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    :root{--bg:#F7F6F2;--surface:#FFFFFF;--border:rgba(20,20,18,0.12);--border-2:rgba(20,20,18,0.22);--ink:#141412;--text:#1C1C1A;--text-2:#5C5B55;--text-3:#8C8B83;--green-50:#EAF3EC;--green-600:#246343;--green-700:#1B4A32;--maroon-500:#8C2F3B;--sage-500:#6E8A5E;--r-sm:10px;--r-lg:20px;--r-xl:26px;--font:'Inter',-apple-system,system-ui,sans-serif;--serif:'Source Serif 4',Georgia,serif;--shadow-card:0 2px 14px rgba(20,20,18,0.05);--shadow-lift:0 10px 30px rgba(20,20,18,0.10);--ease:cubic-bezier(.22,.61,.36,1);}
    *{box-sizing:border-box;}
    body{margin:0;font-family:var(--font);font-size:14px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{width:100%;max-width:420px;}
    .brandmark{display:inline-flex;align-items:center;gap:11px;margin-bottom:30px;}
    .brandmark .glyph{width:46px;height:46px;border-radius:14px;background:var(--green-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:24px;font-weight:600;box-shadow:0 6px 18px rgba(36,99,67,0.28);transform:rotate(-4deg);}
    .brandmark .nm{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.01em;}
    .box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:34px 30px;box-shadow:var(--shadow-card);text-align:left;}
    .box h1{font-size:20px;margin-bottom:4px;}
    .box p{color:var(--text-2);font-size:13.5px;margin:0 0 22px;}
    label.fl{display:block;font-size:12.5px;font-weight:500;color:var(--text-2);margin:0 0 6px;}
    .field{border:1.5px solid var(--border-2);border-radius:var(--r-sm);background:var(--surface);padding:11px 14px;font:inherit;font-size:14px;color:var(--text);width:100%;transition:border-color .2s,box-shadow .2s;}
    .field:focus{outline:none;border-color:var(--green-600);box-shadow:0 0 0 3px var(--green-50);}
    .fgroup{margin-bottom:16px;}
    .btn{font-size:14px;font-weight:600;padding:11px 18px;border-radius:var(--r-sm);border:1.5px solid var(--border-2);background:var(--surface);color:var(--text);transition:transform .12s var(--ease),box-shadow .2s,background .2s;cursor:pointer;}
    .btn:hover{transform:translateY(-1px);} .btn:active{transform:translateY(0);}
    .btn.p{background:var(--green-600);color:#fff;border:none;box-shadow:0 4px 14px rgba(36,99,67,0.25);}
    .btn.p:hover{box-shadow:0 7px 20px rgba(36,99,67,0.32);}
    .btn.full{width:100%;}
    .hint{font-size:12px;color:var(--text-3);margin-top:18px;text-align:center;}
    .msg{display:none;margin-bottom:16px;border-radius:var(--r-sm);padding:10px 12px;font-size:13px;}
    .msg.on{display:block;}
    .msg.ok{background:var(--green-50);color:var(--green-700);}
    .msg.err{background:#F6E9EB;color:var(--maroon-500);}
    .back{display:inline-flex;align-items:center;gap:7px;color:var(--text-2);font-size:13.5px;font-weight:500;background:none;border:none;padding:6px 0;border-radius:8px;transition:color .2s;cursor:pointer;margin-bottom:14px;}
    .back:hover{color:var(--text);}
  </style>
</head>
<body>
  <main class="card">
    <div class="brandmark"><div class="glyph">i</div><div class="nm">InkHeron</div></div>
    <div class="box">
      <button class="back" onclick="history.back()">← Back</button>
      <h1>Change your password</h1>
      <p>Pick something you will remember but others cannot guess.</p>
      <div class="msg" id="msg"></div>
      <form id="changeForm" novalidate>
        <div class="fgroup"><label class="fl" for="current">Current password</label><input class="field" id="current" name="current_password" type="password" required autocomplete="current-password"></div>
        <div class="fgroup"><label class="fl" for="newPassword">New password</label><input class="field" id="newPassword" name="new_password" type="password" required minlength="8" autocomplete="new-password"></div>
        <button class="btn p full" type="submit" id="submitBtn">Update password</button>
      </form>
      <div class="hint">Forgotten your current password? Ask your teacher to reset it for you.</div>
    </div>
  </main>

    <script>
    let csrfToken='';
    async function init(){
      const r=await fetch('/api/me');
      if(r.ok){ const data=await r.json(); csrfToken=data.user.csrf_token; }
    }
    init();

    const form=document.getElementById('changeForm');
    const msg=document.getElementById('msg');
    const submitBtn=document.getElementById('submitBtn');

    form.addEventListener('submit',async e=>{
      e.preventDefault();
      msg.className='msg';
      submitBtn.disabled=true;submitBtn.textContent='Updating...';
      try{
        const r=await fetch('/api/students/me/password',{
          method:'POST',
          headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},
          body:JSON.stringify({current_password:form.current_password.value,new_password:form.new_password.value})
        });
        const data=await r.json().catch(()=>({}));
        if(r.ok){
          msg.textContent='Password updated. Redirecting to your dashboard...';
          msg.className='msg on ok';
          setTimeout(()=>window.location.href='/',1200);
        }else{
          msg.textContent=data.error==='invalid_current_password'?'Your current password is wrong.':(data.error==='password_too_short'?'New password must be at least 8 characters.':'Could not update password. Please try again.');
          msg.className='msg on err';
          submitBtn.disabled=false;submitBtn.textContent='Update password';
        }
      }catch(err){
        msg.textContent='Could not update password. Please try again.';
        msg.className='msg on err';
        submitBtn.disabled=false;submitBtn.textContent='Update password';
      }
    });
  </script>
</body>
</html>
